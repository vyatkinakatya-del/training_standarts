<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Нормативка — тренажёр</title>
<style>
  :root {
    --paper: #F2F5F8;
    --paper-line: #D8E0E8;
    --ink: #16324F;
    --ink-soft: #4A6178;
    --ink-mute: #7C90A3;
    --accent: #1E4C7A;
    --accent-soft: #E4ECF4;
    --good: #2F7A5C;
    --good-bg: #E4F1EA;
    --bad: #AE4438;
    --bad-bg: #F7E9E7;
    --card-bg: #FFFFFF;
    --radius: 10px;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, 'Segoe UI', 'Inter', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .titleblock {
    border: 1.5px solid var(--ink);
    background: var(--card-bg);
    padding: 18px 22px;
    margin-bottom: 22px;
    position: relative;
  }
  .titleblock::before, .titleblock::after {
    content: '';
    position: absolute;
    width: 8px; height: 8px;
    border: 1.5px solid var(--ink);
  }
  .titleblock::before { top: -1.5px; left: -1.5px; border-right: none; border-bottom: none; }
  .titleblock::after { bottom: -1.5px; right: -1.5px; border-left: none; border-top: none; }
  .titleblock h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .titleblock .sub {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stats-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    padding: 10px 14px;
  }
  .stat .num { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--accent); }
  .stat .lbl { font-size: 11px; color: var(--ink-mute); margin-top: 2px; }

  .block-card {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }
  .block-card:hover { box-shadow: 0 3px 10px rgba(20,50,80,0.10); transform: translateY(-1px); }
  .block-card .info { flex: 1; min-width: 0; }
  .block-card .num-tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 6px;
    display: inline-block;
    margin-bottom: 4px;
  }
  .block-card .name { font-weight: 600; font-size: 15px; }
  .block-card .count { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
  .progress-ring {
    width: 46px; height: 46px;
    flex-shrink: 0;
    position: relative;
  }
  .progress-ring svg { transform: rotate(-90deg); }
  .progress-ring .pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
  }

  .btn {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    border: 1.5px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .top-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .back-link {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }

  .quiz-progress {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-mute);
    margin-bottom: 8px;
  }
  .quiz-progress-bar {
    height: 4px; background: var(--paper-line); border-radius: 2px; overflow: hidden; margin-bottom: 20px;
  }
  .quiz-progress-bar > div { height: 100%; background: var(--accent); transition: width 0.2s ease; }

  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .question-card .qtext { font-size: 16px; font-weight: 500; line-height: 1.5; margin-bottom: 18px; }
  .qimg {
    background: var(--accent-soft);
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
    display: flex;
    justify-content: center;
  }
  .qimg svg { max-width: 100%; height: auto; }

  .option {
    border: 1.5px solid var(--paper-line);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1.4;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .option:hover:not(.locked) { border-color: var(--accent); background: var(--accent-soft); }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .option.correct { border-color: var(--good); background: var(--good-bg); }
  .option.incorrect { border-color: var(--bad); background: var(--bad-bg); }
  .option.locked { cursor: default; }

  .explain-box {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
  .explain-box.good { background: var(--good-bg); color: var(--good); }
  .explain-box.bad { background: var(--bad-bg); color: var(--bad); }
  .explain-box b { display: block; margin-bottom: 4px; }
  .explain-box .body-text { color: var(--ink-soft); }

  .quiz-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .quiz-actions .btn { flex: 1; }

  .results-hero {
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    padding: 32px 20px;
    margin-bottom: 18px;
  }
  .results-hero .score { font-family: var(--mono); font-size: 42px; font-weight: 700; color: var(--accent); }
  .results-hero .score-lbl { font-size: 13px; color: var(--ink-mute); margin-top: 4px; }

  .wrong-item {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-left: 3px solid var(--bad);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .wrong-item .q { font-weight: 600; margin-bottom: 4px; }
  .wrong-item .a { color: var(--good); }

  .action-row { display: flex; gap: 10px; margin-top: 16px; }
  .action-row .btn { flex: 1; }

  .empty-hint {
    font-size: 12px; color: var(--ink-mute); text-align: center; padding: 20px 0;
  }

  .tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 18px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .tab {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid var(--paper-line);
    background: var(--card-bg);
    flex-shrink: 0;
  }
  .tab.active {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
  }

  .qtext-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 18px;
  }
  .qtext-row .qtext { margin-bottom: 0; flex: 1; }
  .fav-star {
    font-size: 22px;
    color: var(--paper-line);
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
    user-select: none;
  }
  .fav-star.active { color: #C98E2E; }

  .action-card {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .action-card .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .action-card .count { font-size: 12px; color: var(--ink-mute); margin-bottom: 12px; }

  .export-link-row { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .storage-mode-badge {
    font-size: 10.5px; color: var(--ink-mute); background: var(--paper);
    border: 1px solid var(--paper-line); border-radius: 10px; padding: 2px 8px;
    white-space: nowrap;
  }
  .export-link-row span {
    font-size: 12px; color: var(--accent); cursor: pointer;
    border-bottom: 1px dashed var(--accent); padding-bottom: 1px;
  }
  .export-warning {
    background: var(--accent-soft); border-radius: 8px; padding: 12px 14px;
    font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; line-height: 1.5;
  }
  .export-section-label { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--ink); }
  .export-textarea {
    width: 100%; min-height: 100px; font-family: var(--mono); font-size: 11px;
    padding: 10px; border: 1px solid var(--paper-line); border-radius: 8px;
    background: var(--card-bg); color: var(--ink-soft); resize: vertical;
    box-sizing: border-box; margin-bottom: 8px; word-break: break-all;
  }
  .export-status { font-size: 12px; color: var(--good); min-height: 16px; margin-bottom: 20px; }

  /* --- Мобильная адаптация --- */
  @media (max-width: 480px) {
    body { padding: 16px 10px 40px; }
    .titleblock { padding: 14px 16px; }
    .titleblock h1 { font-size: 17px; }
    .stats-row { flex-wrap: wrap; }
    .stat { min-width: 40%; }
    .tab { padding: 9px 12px; font-size: 12.5px; }
    .block-card { padding: 12px 14px; }
    .block-card .name { font-size: 14px; }
    .question-card { padding: 16px; }
    .qtext { font-size: 15px !important; }
    .option { padding: 13px 14px; font-size: 13.5px; }
    .btn { width: 100%; padding: 13px 18px; }
    .quiz-actions { width: 100%; }
    .action-row { flex-direction: column; }
    .action-row .btn { width: 100%; }
    .results-hero .score { font-size: 34px; }
  }
/* --- Раздел «Теория» — стили для чтения markdown --- */
  .theory-title-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1.5px solid var(--ink);
  }
  .theory-note-title {
    font-size: 18px;
    font-weight: 700;
    flex: 1;
  }
  .speak-btn { flex-shrink: 0; padding: 8px 12px; font-size: 12.5px; }
  .voice-select-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px;
  }
  .voice-select-label { font-size: 12px; color: var(--ink-mute); flex-shrink: 0; }
  .voice-select {
    flex: 1;
    font-size: 12.5px;
    padding: 6px 8px;
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--ink);
    font-family: var(--sans);
    max-width: 260px;
  }
  .voice-select:focus { outline: none; border-color: var(--accent); }
  .theory-content {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    padding: 18px;
    line-height: 1.65;
    font-size: 15px;
    color: var(--ink);
  }
  .theory-content .md-h2 { font-size: 19px; font-weight: 700; margin: 22px 0 10px; color: var(--accent); }
  .theory-content .md-h2:first-child { margin-top: 0; }
  .theory-content .md-h3 { font-size: 16.5px; font-weight: 700; margin: 18px 0 8px; color: var(--ink); }
  .theory-content .md-h4 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; }
  .theory-content .md-p { margin: 0 0 10px; }
  .theory-content .md-list { margin: 0 0 12px; padding-left: 22px; }
  .theory-content .md-list li { margin-bottom: 5px; }
  .theory-content .md-hr { border: none; border-top: 1px solid var(--paper-line); margin: 18px 0; }
  .theory-content .md-inline-code {
    background: var(--accent-soft); padding: 1px 5px; border-radius: 4px;
    font-family: var(--mono); font-size: 0.9em; color: var(--accent);
  }
  .theory-content .wikilink {
    color: var(--ink-soft); font-weight: 600; border-bottom: 1px dashed var(--paper-line);
  }
  .theory-content .wikilink-active {
    color: var(--accent); border-bottom: 1px dashed var(--accent);
    cursor: pointer;
  }
  .theory-content .wikilink-active:active { opacity: 0.6; }
  .theory-content .md-table-wrap { overflow-x: auto; margin: 0 0 14px; }
  .theory-content .md-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .theory-content .md-table th {
    background: var(--accent-soft); text-align: left; padding: 7px 9px;
    border: 1px solid var(--paper-line); font-weight: 600;
  }
  .theory-content .md-table td { padding: 7px 9px; border: 1px solid var(--paper-line); }
  .theory-content .md-code {
    background: var(--ink); color: #fff; padding: 10px 12px; border-radius: 6px;
    font-family: var(--mono); font-size: 12px; overflow-x: auto; margin: 0 0 12px;
    white-space: pre-wrap;
  }
  .theory-content .md-diagram-placeholder {
    background: var(--accent-soft); border: 1px dashed var(--accent);
    border-radius: 8px; padding: 14px; margin: 0 0 14px; font-size: 13px;
    color: var(--accent); text-align: center;
  }
  .theory-content .diagram-wrap {
    overflow-x: auto; margin: 0 0 16px; padding: 14px;
    background: #FAFBFC; border: 1px solid var(--paper-line); border-radius: 10px;
    display: flex; justify-content: center;
  }
  .theory-content .diagram-wrap svg { max-width: 100%; height: auto; }
  .theory-content .md-callout {
    border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; font-size: 14px;
  }
  .theory-content .md-callout p { margin: 0 0 6px; }
  .theory-content .md-callout p:last-child { margin-bottom: 0; }
  .theory-content .md-callout-title { font-weight: 700; margin-bottom: 6px; }
  .md-callout-important, .md-callout-warning { background: var(--bad-bg); }
  .md-callout-important .md-callout-title, .md-callout-warning .md-callout-title { color: var(--bad); }
  .md-callout-note { background: var(--accent-soft); }
  .md-callout-note .md-callout-title { color: var(--accent); }
  .md-callout-success { background: var(--good-bg); }
  .md-callout-success .md-callout-title { color: var(--good); }
  .md-callout-question { background: #FFF6E0; }
  .md-callout-question .md-callout-title { color: #A6740A; }

  .note-annotation-box {
    margin-top: 16px;
    background: #FFFBEA;
    border: 1px solid #E8D9A0;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .note-annotation-label {
    font-size: 12.5px;
    font-weight: 600;
    color: #8A6D1D;
    margin-bottom: 8px;
  }
  .note-annotation-box textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid #E8D9A0;
    border-radius: 6px;
    background: #FFFFFF;
    padding: 10px 12px;
    font-family: var(--sans);
    font-size: 13.5px;
    color: var(--ink);
    resize: vertical;
    box-sizing: border-box;
  }
  .note-annotation-box textarea:focus { outline: none; border-color: #C9A227; }
  .note-annotation-status {
    font-size: 11px; color: #8A6D1D; margin-top: 6px; min-height: 14px;
  }
  .theory-nav-row { display: flex; justify-content: space-between; margin-top: 14px; gap: 10px; }

  .search-input {
    width: 100%;
    font-size: 15px;
    padding: 12px 14px;
    border: 1.5px solid var(--paper-line);
    border-radius: 10px;
    margin-bottom: 16px;
    font-family: var(--sans);
    background: var(--card-bg);
    color: var(--ink);
    box-sizing: border-box;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-section-label {
    font-size: 12px; font-weight: 700; color: var(--ink-mute);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 14px 0 8px;
  }
  .search-section-label:first-child { margin-top: 0; }
  .theory-nav-row .btn { flex: 1; }

  @media (max-width: 480px) {
    .theory-content { padding: 14px; font-size: 14px; }
    .theory-content .md-h2 { font-size: 17px; }
    .theory-content .md-h3 { font-size: 15px; }
    .theory-content .md-table { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---------------------------------------------------------------------------
// БАНК ВОПРОСОВ — легко расширять: просто добавляй объекты в этот массив.
// block: номер блока, blockName: название, q: вопрос,
// options: варианты, correct: индекс правильного (с нуля), explain: пояснение
// ---------------------------------------------------------------------------
const QUESTIONS = [
  // ===== Блок 1: Пожарная безопасность и эвакуация (18 вопросов) =====
  {id:'b1-1', block:1, blockName:'Пожарная безопасность', q:'Жилой дом Ф1.3, площадь квартир на этаже секции — 520 м². Сколько эвакуационных выходов допустимо при высоте ≤28 м?', options:['Только 2 выхода','1 выход при адресной сигнализации в прихожих','1 выход без дополнительных условий','2 выхода, оба Н2'], correct:1, explain:'520 м² попадает в переходную зону 500–550 м² (п.6.1.1 СП1.13130) — один выход допустим при адресной пожарной сигнализации.'},
  {id:'b1-2', block:1, blockName:'Пожарная безопасность', q:'Секционный жилой дом высотой 34 м, площадь квартир на этаже секции 1200 м². Какой набор выходов нужен?', options:['1 выход, Н1','2 выхода: Н1 + Н2 без окон','2 выхода, оба Н2','1 выход, Л1'], correct:1, explain:'Высота 34 м — диапазон 28–75 м. Площадь >550 м² → 2 выхода: один Н1 (с адресной сигнализацией), второй — Н2 без окон с тамбур-шлюзом. Оба-Н2 — это правило для высоты >75 м.'},
  {id:'b1-3', block:1, blockName:'Пожарная безопасность', q:'Какая высота ограждения лестницы требуется при зазоре между маршами более 0,12 м (жильё)?', options:['0,9 м','1,2 м','1,5 м','Не нормируется'], correct:1, explain:'СП54, п.6.4.5: базово 0,9 м, но при зазоре >0,12 м — уже 1,2 м.'},
  {id:'b1-4', block:1, blockName:'Пожарная безопасность', q:'Какой документ регулирует систему оповещения и управления эвакуацией (СОУЭ)?', options:['СП2.13130','СП3.13130','СП4.13130','СП1.13130'], correct:1, explain:'СП3.13130 — специально про СОУЭ. Актуальная редакция в базе — 2026 года.'},
  {id:'b1-5', block:1, blockName:'Пожарная безопасность', q:'Категория помещения А присваивается, если избыточное давление взрыва превышает:', options:['1 кПа','5 кПа','10 кПа','20 кПа'], correct:1, explain:'123-ФЗ, ст.27: категория А/Б — если расчётное избыточное давление взрыва превышает 5 кПа.'},
  {id:'b1-6', block:1, blockName:'Пожарная безопасность', q:'Многоквартирный жилой дом — это класс функциональной пожарной опасности:', options:['Ф1.2','Ф1.3','Ф1.4','Ф4.3'], correct:1, explain:'Ф1.3 — многоквартирные жилые дома. Ф1.2 — гостиницы, Ф1.4 — одноквартирные.'},
  {id:'b1-7', block:1, blockName:'Пожарная безопасность', q:'ЛК типа Н1 защищена от задымления с помощью:', options:['Тамбур-шлюза на каждом этаже','Подпора воздуха в объём ЛК','Наружной незадымляемой воздушной зоны','Естественных окон'], correct:2,

    explain:'Н1 — вход с этажа через незадымляемую наружную воздушную зону по открытым переходам (см. схему — переход снаружи здания). Н2 — подпор в саму ЛК, Н3 — тамбур-шлюз.'},
  {id:'b1-8', block:1, blockName:'Пожарная безопасность', q:'Минимальная ширина марша для жилого секционного дома высотой до 75 м:', options:['0,9 м','1,05 м','1,2 м','1,35 м'], correct:1, explain:'1,05 м — базовая ширина марша для жилых секционных зданий. 1,2 м — для коридорных.'},
  {id:'b1-9', block:1, blockName:'Пожарная безопасность', q:'Максимальное число подъёмов в одномаршевой лестнице в пределах первого этажа:', options:['16','18','20','Не ограничено'], correct:1, explain:'СП1.13130, п.4.4.4: как правило не более 16, но в одномаршевых лестницах и в марше в пределах 1-го этажа — до 18.'},
  {id:'b1-10', block:1, blockName:'Пожарная безопасность', q:'Аварийный выход на балкон с глухим простенком — какой минимальный простенок от торца балкона до окна?', options:['0,9 м','1,2 м','1,6 м','2,0 м'], correct:1, explain:'СП1.13130, п.4.2.4: не менее 1,2 м от торца до оконного проёма, либо 1,6 м между остеклёнными проёмами.'},
  {id:'b1-11', block:1, blockName:'Пожарная безопасность', q:'Здание I степени огнестойкости — какой предел огнестойкости у внутренних стен лестничной клетки (табл.21)?', options:['REI 60','REI 90','REI 120','R 60'], correct:2, explain:'Табл.21 123-ФЗ: I степень → внутренние стены ЛК REI 120 (самое строгое значение в таблице).'},
  {id:'b1-12', block:1, blockName:'Пожарная безопасность', q:'Класс конструктивной опасности С0 — какой класс К у всех конструкций (табл.22)?', options:['К0 для всех','К0 только для несущих','К1 для всех','Разные классы для разных конструкций'], correct:0, explain:'Табл.22: С0 — самый строгий класс, все конструкции без исключения должны быть К0.'},
  {id:'b1-13', block:1, blockName:'Пожарная безопасность', q:'По табл.6.8 СП2.13130 (жильё Ф1.3), какая максимальная высота допустима для комбинации II степень/класс С0?', options:['28 м','50 м','75 м','Не ограничена'], correct:1, explain:'Табл.6.8: I/С0 — до 75м, II/С0 — до 50м, III/С0 — до 28м. Часто путают со следующей строкой.'},
  {id:'b1-14', block:1, blockName:'Пожарная безопасность', q:'Простенок между лестничной клеткой и жилым помещением в наружной стене — минимум:', options:['900 мм','1200 мм','1500 мм','2000 мм'], correct:1, explain:'Не менее 1200 мм — простенок между ЛК и жилым помещением в наружной стене здания.'},
  {id:'b1-15', block:1, blockName:'Пожарная безопасность', q:'Минимальная ширина пути эвакуации в межквартирном коридоре:', options:['1200 мм','1400 мм','1600 мм','1800 мм'], correct:1, explain:'Не менее 1400 мм — минимальная ширина пути эвакуации в межквартирном коридоре (отдельно от ширины марша ЛК).'},
  {id:'b1-16', block:1, blockName:'Пожарная безопасность', q:'Высота горизонтальных путей эвакуации (коридоры) в здании Ф1.3 должна быть не менее:', options:['1,9 м','2,0 м','2,2 м','2,5 м'], correct:1, explain:'2,0 м — для горизонтальных путей (коридоров). Для вертикальных путей по лестнице — отдельная норма, 2,2 м.'},
  {id:'b1-17', block:1, blockName:'Пожарная безопасность', q:'Максимальная высота ступени на путях эвакуации:', options:['180 мм','200 мм','220 мм','250 мм'], correct:2, explain:'Не более 220 мм (и не менее 50 мм) — стандартный диапазон высоты подступенка на путях эвакуации.'},
  {id:'b1-18', block:1, blockName:'Пожарная безопасность', q:'Площадь проёмов в противопожарной преграде не должна превышать:', options:['15%','25%','35%','50%'], correct:1, explain:'СП2.13130, п.5.3.4: площадь проёмов в преграде — не более 25% от её площади (если заполнение проёмов не имеет предел огнестойкости не ниже самой преграды).'},

  {id:'b1-19', block:1, blockName:'Пожарная безопасность', q:'Площадь этажа в пределах пожарного отсека (для табл.6.8 СП2.13130) считается:', options:['С учётом лестничных клеток', 'Без учёта лестничных клеток', 'Только жилая площадь', 'По наружному контуру стен'], correct:1, explain:'СП2.13130, разд.6: без учёта площади лестничных клеток — отличие от площади этажа для ТЭП, которая, наоборот, их включает.'},
  {id:'b1-20', block:1, blockName:'Пожарная безопасность', q:'Ширина воздушной зоны у лестничной клетки типа Н1?', options:['0,9 м','1,0 м','1,2 м','1,5 м'], correct:2, explain:'П.4.4.14 СП1.13130: переход через наружную воздушную зону — ширина не менее 1,2 м, высота ограждения тоже не менее 1,2 м.'},
  {id:'b1-21', block:1, blockName:'Пожарная безопасность', q:'Ширина тамбур-шлюза относительно ширины дверного проёма?', options:['Равна ширине проёма', 'Шире не менее чем на 0,3 м', 'Шире не менее чем на 0,5 м', 'Шире не менее чем на 1,0 м'], correct:2, explain:'П.4.3.11 СП1.13130: ширина тамбура/тамбур-шлюза — больше ширины дверного проёма не менее чем на 0,5 м.'},
  {id:'b1-22', block:1, blockName:'Пожарная безопасность', q:'Минимальная глубина тамбур-шлюза (независимо от ширины дверного полотна)?', options:['1,0 м','1,2 м','1,5 м','2,0 м'], correct:2, explain:'Глубина — больше дверного полотна не менее чем на 0,5 м, но в любом случае не менее 1,5 м.'},
  {id:'b1-23', block:1, blockName:'Пожарная безопасность', q:'Минимальное число подъёмов (ступеней) в марше лестницы?', options:['2','3','4','5'], correct:1, explain:'П.4.4.4 СП1.13130: не менее 3 подъёмов в марше (и не более 16, кроме особых случаев).'},
  {id:'b1-24', block:1, blockName:'Пожарная безопасность', q:'Категория помещения Г присваивается веществам:', options:['Горючим газам и ЛВЖ', 'Негорючим в горячем/раскалённом состоянии, либо горючим как топливо', 'Негорючим в холодном состоянии', 'Только пыли и волокнам'], correct:1, explain:'Категория Г — умеренная пожароопасность: негорючие вещества в горячем состоянии (искры, лучистое тепло) или горючие материалы, сжигаемые как топливо.'},
  {id:'b1-25', block:1, blockName:'Пожарная безопасность', q:'Категория помещения Д — это:', options:['Взрывопожароопасные материалы', 'Только горючие жидкости', 'Негорючие вещества и материалы в холодном состоянии', 'Пыль во взвешенном состоянии'], correct:2, explain:'Д — самая мягкая категория: негорючие вещества и материалы в холодном состоянии.'},
  {id:'b1-26', block:1, blockName:'Пожарная безопасность', q:'Разделение категорий В1–В4 зависит от:', options:['Только площади помещения', 'Количества и способа размещения пожарной нагрузки + объёмно-планировочных характеристик', 'Этажности здания', 'Класса конструктивной опасности здания'], correct:1, explain:'123-ФЗ, ст.27, п.8 — точные числовые пороги (в МДж/м²) в самом законе не приводятся, детальная методика в СП12.13130 (не в базе).'},
  {id:'b1-27', block:1, blockName:'Пожарная безопасность', q:'Здание классифицируется как категория А, если суммарная площадь помещений А превышает:', options:['3% или 100 м²', '5% или 200 м²', '10% или 300 м²', '15% или 500 м²'], correct:1, explain:'123-ФЗ, ст.27, п.12: категория А присваивается зданию, если сумм. площадь помещений А >5% всех помещений здания ИЛИ >200 м².'},
  {id:'b1-28', block:1, blockName:'Пожарная безопасность', q:'Максимальный уклон открытой лестницы для прохода к одиночным рабочим местам?', options:['1:1','1:1,5','2:1','1:2'], correct:2, explain:'СП1.13130: до 2:1 — самый крутой из нормируемых уклонов, специально для редко используемых лестниц к одиночным рабочим местам.'},
  {id:'b1-29', block:1, blockName:'Пожарная безопасность', q:'Простенок от торца балкона до оконного проёма (при надстройке существующего 5-этажного здания одним этажом, ЛК типа Л1 сохранена) — какой аварийный выход нужен на новом этаже?', options:['Обычный — 1,2 м', 'Увеличенный — 3,6 м (или 4,8 м между остеклёнными)', 'Аварийный выход не требуется', 'Достаточно люка 0,6×0,8 м'], correct:1, explain:'П.6.1.4 СП1.13130: редкое исключение — при надстройке с сохранением Л1 простенок увеличен до 3,6 м (вместо стандартных 1,2 м) — компенсация за незадымляемую ЛК на новом этаже.'},
  {id:'b1-30', block:1, blockName:'Пожарная безопасность', q:'Незадымляемая ЛК требуется независимо от высоты здания для класса:', options:['Ф1.3', 'Ф5 категорий А/Б', 'Ф2.1', 'Ф4.3'], correct:1, explain:'П.4.4.18: Ф5 категорий А/Б — незадымляемая ЛК нужна вне зависимости от высоты (в отличие от прочих классов, где порог — высота >28 м).'},
  {id:'b1-31', block:1, blockName:'Пожарная безопасность', q:'Стены ЛК типа Н2 могут иметь оконные проёмы в наружных стенах, если они:', options:['Открывающиеся', 'Неоткрывающиеся', 'Любые', 'Только аварийные'], correct:1, explain:'П.4.4.13: стены Н2 не должны иметь иных проёмов, кроме неоткрывающихся окон и специальных дверных проёмов с защитой.'},
  {id:'b1-32', block:1, blockName:'Пожарная безопасность', q:'Минимальное расстояние между ближайшими гранями двух эвакуационных выходов из одного помещения?', options:['1/4 максимальной диагонали', '1/3 максимальной диагонали', 'Половина максимальной диагонали', 'Равно ширине выхода'], correct:2, explain:'П.4.2.16 СП1.13130: не менее половины максимальной диагонали помещения (для коридора — формула L≥0,4·D).'},
  {id:'b1-33', block:1, blockName:'Пожарная безопасность', q:'Подвальный/цокольный этаж площадью >300 м² делится на секции противопожарными преградами — максимальная площадь одной секции?', options:['500 м²', '700 м²', '1000 м²', '1500 м²'], correct:1, explain:'П.4.2.11 СП1.13130: секции не более 700 м², перегородки не ниже 1-го типа, перекрытия не ниже 3-го.'},
  {id:'b1-34', block:1, blockName:'Пожарная безопасность', q:'В зданиях Ф1–Ф4 высотой >28 м допускается заменить на Н3 или Н2-с-тамбуром не более какой доли лестничных клеток в отсеке?', options:['30%', '50%', '70%', '100%'], correct:1, explain:'П.4.4.18: до 50% ЛК можно заменить, остальные — обязательно Н1.'},

  // --- Из заметки «Класс функциональной пожарной опасности» ---
  {id:'b1-35', block:1, blockName:'Пожарная безопасность', q:'К классу Ф1.1 относятся:', options:['Гостиницы', 'Детские дошкольные учреждения, дома престарелых (неквартирные), медицинские стационары', 'Многоквартирные дома', 'Офисы и банки'], correct:1, explain:'Ф1.1 — учреждения с круглосуточным пребыванием людей, нуждающихся в помощи (дети, пожилые, стационарные больные).'},
  {id:'b1-36', block:1, blockName:'Пожарная безопасность', q:'Общежитие НЕ квартирного типа — какой класс Ф?', options:['Ф1.1', 'Ф1.2', 'Ф1.3', 'Ф1.4'], correct:1, explain:'Ф1.2 — гостиницы и общежития кроме квартирного типа. Общежития квартирного типа идут в Ф1.3, вместе с обычными МКД.'},
  {id:'b1-37', block:1, blockName:'Пожарная безопасность', q:'Поликлиника (амбулаторная медицинская помощь, не стационар) — какой класс Ф?', options:['Ф1.1', 'Ф3.4', 'Ф4.3', 'Ф2.1'], correct:1, explain:'Частая ловушка: стационар — Ф1.1, а амбулаторная медицина (поликлиника) — Ф3.4. Разные классы для одной и той же «медицины».'},
  {id:'b1-38', block:1, blockName:'Пожарная безопасность', q:'Офисы, банки, конторы, органы управления — какой класс Ф?', options:['Ф3.1', 'Ф4.1', 'Ф4.3', 'Ф5.1'], correct:2, explain:'Ф4.3 — органы управления учреждений, проектно-конструкторские, банки, конторы, офисы.'},
  {id:'b1-39', block:1, blockName:'Пожарная безопасность', q:'Многофункциональное здание (жильё + коммерция + паркинг) получает:', options:['Единый класс Ф по преобладающей функции', 'Каждая часть анализируется по своему классу Ф отдельно', 'Класс Ф не определяется для многофункциональных зданий', 'Всегда Ф1.3, если есть жильё'], correct:1, explain:'Здание не получает «среднего» класса — каждая функциональная часть классифицируется отдельно, а на стыках нормируются разделяющие преграды.'},

  // --- Из заметки «Огнестойкость» ---
  {id:'b1-40', block:1, blockName:'Пожарная безопасность', q:'В обозначении REI буква E означает:', options:['Несущую способность', 'Целостность (отсутствие трещин/отверстий)', 'Теплоизолирующую способность', 'Электробезопасность'], correct:1, explain:'R — несущая способность, E — целостность, I — теплоизолирующая способность. Число после буквы — минуты.'},
  {id:'b1-41', block:1, blockName:'Пожарная безопасность', q:'В обозначении REI буква I означает:', options:['Несущую способность', 'Целостность', 'Теплоизолирующую способность', 'Индекс огнестойкости'], correct:2, explain:'I — теплоизолирующая способность: обратная от огня сторона не должна нагреваться выше допустимого предела.'},
  {id:'b1-42', block:1, blockName:'Пожарная безопасность', q:'Здание V степени огнестойкости — какой предел огнестойкости у большинства конструкций (табл.21)?', options:['R 15', 'REI 15', 'Не нормируется', 'R 30'], correct:2, explain:'V степень — почти везде «не нормируется». Такие здания обычно одноэтажные, риск компенсируется другими мерами, не огнестойкостью конструкций.'},
  {id:'b1-43', block:1, blockName:'Пожарная безопасность', q:'Здание II степени огнестойкости — предел огнестойкости наружных ненесущих стен?', options:['E 15', 'E 30', 'REI 45', 'R 90'], correct:0, explain:'Табл.21: II степень → наружные ненесущие стены E15 (у I степени — E30, строже).'},

  // --- Из заметки «Класс конструктивной пожарной опасности» ---
  {id:'b1-44', block:1, blockName:'Пожарная безопасность', q:'Класс конструктивной опасности С1 — какой класс К у стен ЛК и противопожарных преград?', options:['К0', 'К1', 'К2', 'К3'], correct:0, explain:'Даже в здании класса С1 (не самом строгом), стены ЛК и преграды — всегда К0, строже, чем остальные конструкции того же здания.'},
  {id:'b1-45', block:1, blockName:'Пожарная безопасность', q:'Класс конструктивной опасности С3 — несущие стержневые элементы:', options:['К0', 'К1', 'К3', 'Не нормируются'], correct:3, explain:'Табл.22: в С3 несущие стержневые элементы и наружные стены не нормируются, а вот стены ЛК и преграды — всё равно К1 (никогда «не нормируется»).'},
  {id:'b1-46', block:1, blockName:'Пожарная безопасность', q:'Класс конструктивной опасности С2 — какой класс К у несущих стержневых элементов?', options:['К0', 'К1', 'К2', 'К3'], correct:3, explain:'Табл.22: С2 → несущие элементы К3 (самый пожароопасный класс материалов).'},

  // --- Из заметки «Пожарные отсеки и противопожарные преграды» ---

  {id:'b2-18', block:2, blockName:'Жилые здания (СП54)', q:'Здание коридорного типа — квартиры этажа выходят в коридор не менее чем в:', options:['1 лестничную клетку','2 лестничные клетки','3 лестничные клетки','Не регламентировано'], correct:1, explain:'П.3.1.9: квартиры этажа — выход через общий коридор не менее чем в две лестничные клетки.'},
  {id:'b2-19', block:2, blockName:'Жилые здания (СП54)', q:'Здание секционного типа — квартиры одной секции имеют выход:', options:['На одну лестничную клетку напрямую/через коридор/лифтовый холл', 'Обязательно на 2 лестницы', 'Через общую галерею', 'На любую из лестниц здания'], correct:0, explain:'П.3.1.10: секции разделены стенами без проёмов, квартиры секции — выход на одну ЛК непосредственно, через коридор или лифтовый холл.'},
  {id:'b2-20', block:2, blockName:'Жилые здания (СП54)', q:'«Зелёное» многоквартирное здание — критерий по определению СП54?', options:['Только энергоэффективность', 'Комфортность + энергоэффективность + ресурсосбережение + экологичность (принципы устойчивого развития)', 'Только наличие озеленения кровли', 'Класс энергоэффективности не ниже В'], correct:1, explain:'П.3.1.11: комплексный критерий — комфортность для жителей, энергоэффективность, ресурсосбережение, экологическая безопасность по принципам устойчивого развития и декарбонизации.'},
  {id:'b2-21', block:2, blockName:'Жилые здания (СП54)', q:'Квартира (жилое помещение) по определению СП54 — это:', options:['Любое отдельное помещение в доме', 'Структурно обособленное помещение с прямым доступом к местам общего пользования + жилые комнаты + вспомогательные помещения', 'Только жилые комнаты без вспомогательных', 'Помещение с отдельным счётчиком'], correct:1, explain:'П.3.1.12 — полное определение включает именно прямой доступ к помещениям общего пользования как признак.'},
  {id:'b2-22', block:2, blockName:'Жилые здания (СП54)', q:'Отличие кухни-ниши от кухни-столовой?', options:['Ниша — обязательно с газовой плитой, столовая — с электрической', 'Ниша — зона смежная с жилым/вспомогательным помещением с электроплитой; столовая — отдельное помещение для всей семьи одновременно', 'Разницы нет', 'Ниша — только в общественных зданиях'], correct:1, explain:'Кухня-ниша (3.1.17) — зона, смежная с другим помещением, обязательно электроплита. Кухня-столовая (3.1.18) — отдельное помещение с обеденной зоной для всей семьи.'},
  {id:'b2-23', block:2, blockName:'Жилые здания (СП54)', q:'Лоджия отличается от балкона тем, что:', options:['Лоджия всегда без остекления', 'Лоджия имеет стены с трёх сторон (или двух — угловая) на всю высоту этажа, балкон — выступающая площадка без таких стен', 'Балкон всегда шире лоджии', 'Разницы в определениях нет'], correct:1, explain:'Лоджия (3.1.19) встроена в здание, со стенами с 3 сторон. Балкон (3.1.2) — выступающая из плоскости стены площадка.'},
  {id:'b2-24', block:2, blockName:'Жилые здания (СП54)', q:'Балкон французский (3.1.3) отличается от обычного балкона тем, что:', options:['Он шире', 'У него НЕТ наружной площадки — это световой проём с ограждением', 'Он всегда остеклён', 'Он больше по глубине'], correct:1, explain:'Французский балкон — световой проём с балконным блоком и внешним ограждением, БЕЗ наружной площадки. Нижняя грань проёма шириной <0,6м не считается эксплуатируемой площадкой.'},
  {id:'b2-25', block:2, blockName:'Жилые здания (СП54)', q:'Веранда (3.1.4) — это помещение:', options:['Отапливаемое круглогодичное', 'Застеклённое сезонное неотапливаемое', 'Открытое без остекления', 'Только на первом этаже'], correct:1, explain:'Веранда — застеклённое сезонное неотапливаемое помещение, без ограничения по глубине.'},
  {id:'b2-26', block:2, blockName:'Жилые здания (СП54)', q:'Терраса (3.1.34) отличается от веранды тем, что:', options:['Терраса — открытая площадка без остекления, веранда — застеклённая', 'Терраса всегда остеклена', 'Разницы нет, это синонимы', 'Терраса — только на кровле'], correct:0, explain:'Терраса — открытая площадка БЕЗ остекления (может иметь только покрытие). Веранда — застеклённое помещение.'},
  {id:'b2-27', block:2, blockName:'Жилые здания (СП54)', q:'Антресоль (3.1.1) — площадка площадью не более:', options:['30% помещения','40% помещения','50% помещения','60% помещения'], correct:1, explain:'Антресоль — доступная площадка в помещении повышенной высоты, площадью не более 40% площади помещения. Не является этажом.'},
  {id:'b2-28', block:2, blockName:'Жилые здания (СП54)', q:'Помещение встроенно-пристроенное — вынесено за контур здания более чем на:', options:['1,0 м','1,5 м','2,0 м','2,5 м'], correct:1, explain:'П.3.1.28: более чем на 1,5 м за внешний контур жилого здания.'},
  {id:'b2-29', block:2, blockName:'Жилые здания (СП54)', q:'Отличие туалета от уборной (по СП54)?', options:['Туалет — только с унитазом, уборная — унитаз + умывальник', 'Наоборот', 'Разницы нет', 'Уборная — только в общественных зонах'], correct:0, explain:'Туалет (3.1.35) — только унитаз со смывным бачком. Уборная (3.1.36) — унитаз + умывальник (дополнительное оборудование).'},
  {id:'b2-30', block:2, blockName:'Жилые здания (СП54)', q:'Узел лестнично-лифтовой может включать в себя:', options:['Только ЛК и шахту лифта', 'ЛК + шахта лифта + опционально лифтовой холл, ПБЗ для МГН, мусоропровод', 'Только лифтовой холл', 'Только мусоропровод'], correct:1, explain:'П.3.1.37: помещение ЛК с шахтой(ами) лифта(ов), допускается с размещением лифтового холла, ПБЗ для МГН, мусоропровода.'},
  {id:'b2-31', block:2, blockName:'Жилые здания (СП54)', q:'Помещения общественного назначения, встроенные в МКД, не должны:', options:['Иметь отдельный вход', 'Оказывать вредных воздействий на условия проживания в МКД', 'Превышать 500 м²', 'Располагаться выше 2 этажа'], correct:1, explain:'П.3.1.31: помещения для учреждений/предприятий, НЕ оказывающие вредных воздействий на условия проживания в МКД и жилой застройке.'},
  {id:'b2-32', block:2, blockName:'Жилые здания (СП54)', q:'Подполье проветриваемое — это:', options:['Подполье с трубопроводами', 'Открытое пространство между грунтом и нижним перекрытием 1-го надземного этажа', 'Любое подполье с вентиляцией', 'Подполье высотой более 1,8м'], correct:1, explain:'П.3.1.25: именно открытое пространство (не закрытое подполье с коммуникациями, как техническое).'},
  {id:'b2-33', block:2, blockName:'Жилые здания (СП54)', q:'Общежитие квартирного типа — размещение проживающих:', options:['В общих комнатах барачного типа', 'В жилых комнатах квартир', 'Только в студиях', 'В отдельных модулях'], correct:1, explain:'П.3.1.21: МКД/секция с отдельным входом для временного проживания, размещение — именно в жилых комнатах квартир (не в общих спальнях).'},
  {id:'b2-34', block:2, blockName:'Жилые здания (СП54)', q:'Остекление панорамное — габаритная высота конструкции равна:', options:['2,5 м фиксировано', 'Высоте помещения в чистоте', 'Высоте окна стандартного размера', '3,0 м фиксировано'], correct:1, explain:'П.3.1.23: высота = высоте помещения в чистоте, ширина = ширине помещения, включая выступающие несущие конструкции.'},
  {id:'b2-35', block:2, blockName:'Жилые здания (СП54)', q:'Этаж (жилого МКД) отсчитывается от отметки верха перекрытия ИЛИ:', options:['Верха стены', 'Пола по грунту', 'Кровли', 'Планировочной отметки земли всегда'], correct:1, explain:'П.3.1.41: «верха перекрытия ИЛИ пола по грунту» — важная альтернатива для этажей, стоящих прямо на грунте.'},
  {id:'b2-36', block:2, blockName:'Жилые здания (СП54)', q:'Этаж надземный — отметка пола:', options:['Не ниже наиболее низкой планировочной отметки земли', 'Всегда выше 1-го этажа', 'Не ниже 0,5 м от земли', 'Определяется по проекту произвольно'], correct:0, explain:'П.3.1.43: критерий именно про соотношение с планировочной отметкой земли, не про номер этажа.'},
  {id:'b2-37', block:2, blockName:'Жилые здания (СП54)', q:'Этаж технический — где может располагаться?', options:['Только в нижней части здания', 'Только в верхней части здания', 'Внизу, вверху, или между надземными этажами', 'Только под землёй'], correct:2, explain:'П.3.1.47: технический этаж может быть расположен в любой из этих позиций.'},
  {id:'b2-38', block:2, blockName:'Жилые здания (СП54)', q:'Чердак технический отличается от обычного чердака тем, что:', options:['Он ниже по высоте', 'В нём размещены трубопроводы/коммуникации (без оборудования и помещений)', 'Он не подлежит вентиляции', 'Он всегда отапливаемый'], correct:1, explain:'П.3.1.40: чердак технический — с трубопроводами инженерных систем, но по-прежнему без оборудования и помещений.'},
  {id:'b2-39', block:2, blockName:'Жилые здания (СП54)', q:'Оборудование внутриквартирное — где может располагаться?', options:['Только в кухне', 'Во вспомогательном помещении, нише или ограждающих конструкциях квартиры', 'Только в специальном техническом помещении', 'Только на балконе'], correct:1, explain:'П.3.1.20: инженерно-техническое оборудование с индивидуальными вводами, в вспомогательном помещении/нише/ограждающих конструкциях именно квартиры.'},
  {id:'b2-40', block:2, blockName:'Жилые здания (СП54)', q:'Отметка уровня земли планировочная — это:', options:['Отметка чистого пола 1-го этажа', 'Геодезическая отметка поверхности земли на границе с отмосткой здания', 'Средняя отметка участка', 'Отметка верха фундамента'], correct:1, explain:'П.3.1.22 — точное определение привязано именно к границе с отмосткой.'},
  {id:'b2-41', block:2, blockName:'Жилые здания (СП54)', q:'Область применения СП54 — до какой высоты МКД?', options:['50 м','75 м','100 м','Без ограничения'], correct:1, explain:'П.1.1: до 75 м. Выше — уже требует других специализированных документов (СП477, СП267).'},
  {id:'b2-42', block:2, blockName:'Жилые здания (СП54)', q:'На какие дома СП54 НЕ распространяется?', options:['На общежития квартирного типа', 'На одноквартирные дома (отдельно стоящие/блокированные)', 'На здания коридорного типа', 'На здания галерейного типа'], correct:1, explain:'Одноквартирные дома регулируются отдельным документом — СП55.13330, не СП54.'},
  {id:'b2-43', block:2, blockName:'Жилые здания (СП54)', q:'Продухи в наружных стенах подвала без вытяжной вентиляции — общая площадь не менее:', options:['1/200 площади пола подвала', '1/400 площади пола подвала', '1/600 площади пола подвала', '1/800 площади пола подвала'], correct:1, explain:'П.7.8 СП54: не менее 1/400 площади пола подполья/подвала, минимум 0,05 м² каждый продух, не менее 2 на секцию.'},
  {id:'b2-44', block:2, blockName:'Жилые здания (СП54)', q:'Приток воздуха в квартире с механической вытяжной вентиляцией:', options:['Не требуется, вытяжка обеспечивает всё', 'Всё равно нужен через оконные/стеновые клапаны, даже при наличии регулируемых створок', 'Нужен только зимой', 'Обеспечивается только естественным путём'], correct:1, explain:'П.9.10 СП54: даже при механической вытяжке приток всё равно нужно обеспечить через клапаны — частая ошибка думать, что вытяжка сама всё компенсирует.'},
  {id:'b2-45', block:2, blockName:'Жилые здания (СП54)', q:'Внутриквартирный пожарный кран — диаметр крана для шланга?', options:['≥10 мм','≥15 мм','≥20 мм','≥25 мм'], correct:1, explain:'П.6.2.4.3: кран Ø≥15мм для шланга с распылителем, для первичного пожаротушения в каждой квартире.'},
  {id:'b2-46', block:2, blockName:'Жилые здания (СП54)', q:'Площадь застройки (Прил.А, п.А.1.1) включает выступающие части здания на высоте:', options:['Менее 3,0 м','Менее 4,5 м','Менее 6,0 м','Любой высоты'], correct:1, explain:'П.А.1.1: включаются выступающие части (балконы, козырьки, эркеры) на высоте менее 4,5 м от уровня земли.'},
  {id:'b2-47', block:2, blockName:'Жилые здания (СП54)', q:'Площадь здания (Прил.А, п.А.1.2) НЕ включает:', options:['Эксплуатируемую кровлю', 'Чердак и техническое подполье', 'Балконы и лоджии', 'Лестничные площадки'], correct:1, explain:'Площадь здания считается по сумме этажей, БЕЗ чердака и технического подполья — в отличие от площади этажа, которая включает балконы/лоджии/лестничные площадки.'},
  {id:'b2-48', block:2, blockName:'Жилые здания (СП54)', q:'Площадь квартиры (Прил.А, п.А.2.1, для минимумов табл.5.1) считается:', options:['С учётом лоджий и балконов', 'Без учёта лоджий/веранд/холодных кладовых/тамбуров/балконов/террас', 'Только жилые комнаты', 'С коэффициентом 0,5 для летних помещений'], correct:1, explain:'Для минимальной площади квартиры по табл.5.1 берётся площадь БЕЗ летних/неотапливаемых помещений — это отдельное число от «общей площади квартиры с коэффициентами», которая используется в ТЭП.'},
  {id:'b2-49', block:2, blockName:'Жилые здания (СП54)', q:'Коэффициент для лоджии при расчёте общей площади квартир «с летними помещениями» (Приказ Минстроя №854/пр)?', options:['0,3','0,5','0,7','1,0'], correct:1, explain:'Лоджии — коэффициент 0,5. Балконы и террасы — 0,3. Веранды — 1,0 (без понижения).'},
  {id:'b2-50', block:2, blockName:'Жилые здания (СП54)', q:'Коэффициент для балкона (не лоджии) при расчёте общей площади квартир?', options:['0,3','0,5','0,7','1,0'], correct:0, explain:'Балкон — 0,3. Легко перепутать с лоджией (0,5) — у лоджии коэффициент выше, так как она более защищена (три стены).'},
  {id:'b2-51', block:2, blockName:'Жилые здания (СП54)', q:'Площадь этажа (Прил.А, п.А.1.3) измеряется между внутренними поверхностями наружных стен на высоте от пола:', options:['0–0,5 м','0–1,10 м','0,5–1,5 м','На уровне подоконника'], correct:1, explain:'На высоте от 0 до 1,10 м от пола (при наклонных стенах — на уровне пола).'},
  {id:'b2-52', block:2, blockName:'Жилые здания (СП54)', q:'Строительный объём здания (Прил.А, п.А.1.8) — это произведение:', options:['Площади застройки на этажность', 'Площади этажа (по чистовой фасадной отделке) на высоту этажа', 'Периметра здания на высоту', 'Площади здания на коэффициент 1,2'], correct:1, explain:'Площадь этажа по чистовой поверхности фасадной отделки, умноженная на высоту этажа (от УЧП до УЧП) — сумма подземного и надземного объёма считается отдельно.'},
  {id:'b2-53', block:2, blockName:'Жилые здания (СП54)', q:'Этажность 18-этажного корпуса с одноэтажной пристройкой в ТЭП записывается как:', options:['18', '1 и 18 отдельно', '1–18', '18/1'], correct:2, explain:'При объединении разновысотных элементов (секция + пристройка) в один столбец — запись через тире по возрастанию: «1–18».'},
  {id:'b2-54', block:2, blockName:'Жилые здания (СП54)', q:'Минимальный габарит кабины стандартного пассажирского лифта (ширина×глубина, НЕ для носилок)?', options:['900×1200 мм', '1100×1400 мм', '1300×1600 мм', '2100×2100 мм'], correct:1, explain:'1100×1400 мм — базовый габарит. 2100 мм по глубине/ширине — увеличенный габарит именно для транспортировки на носилках.'},
  {id:'b2-55', block:2, blockName:'Жилые здания (СП54)', q:'При надстройке существующего 5-этажного здания одним этажом — лифты:', options:['Обязательны всегда', 'Можно не предусматривать', 'Нужны только грузовые', 'Определяется расчётом нагрузки'], correct:1, explain:'П.9.18 СП54: при надстройке одним этажом 5-этажных зданий лифты допускается не предусматривать — специальное исключение.'},
  {id:'b2-56', block:2, blockName:'Жилые здания (СП54)', q:'Число жителей для ТЭП рассчитывается по:', options:['Только по СП54', 'СП42 (табл.5.1) или местным нормативам градостроительного проектирования (МНГП)', 'Формуле 18 м²/чел. без исключений', 'Только по заданию заказчика без проверки'], correct:1, explain:'Число жителей — по СП42, табл.5.1, либо по МНГП, с обязательной сверкой с ТЗ, если там указаны свои цифры.'},
  {id:'b2-57', block:2, blockName:'Жилые здания (СП54)', q:'Ширина ниши под коллектор водоснабжения при этажности ≤17 и ≤6 квартирах на этаже?', options:['900 мм','1200 мм','1500 мм','1800 мм'], correct:1, explain:'Минимальная ширина ниши коллектора ВК — 1200 мм при этажности ≤17 и ≤6 квартирах (обслуживает до 6 квартир).'},

// ---------------------------------------------------------------------------
// Работа с постоянным хранилищем
// ---------------------------------------------------------------------------
const STORAGE_KEY = 'quiz-progress-v1';

function hasClaudeStorage() {
  return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');
}

async function loadProgress() {
  const defaults = { stats: {}, sessions: [], favorites: [], activeQuiz: null, notes: {}, streak: { count: 0, lastDate: null }, voicePref: null };
  try {
    let raw = null;
    if (hasClaudeStorage()) {
      // Открыто внутри интерфейса Claude — используем встроенное хранилище артефакта
      const res = await window.storage.get(STORAGE_KEY);
      raw = res && res.value ? res.value : null;
    } else {
      // Открыто как обычный сайт (свой хостинг) — используем стандартный localStorage браузера
      raw = localStorage.getItem(STORAGE_KEY);
    }
    if (raw) {
      const p = JSON.parse(raw);
      if (!p.favorites) p.favorites = [];
      if (!p.sessions) p.sessions = [];
      if (!p.stats) p.stats = {};
      if (p.activeQuiz === undefined) p.activeQuiz = null;
      if (!p.notes) p.notes = {};
      if (!p.streak) p.streak = { count: 0, lastDate: null };
      if (p.voicePref === undefined) p.voicePref = null;
      return p;
    }
  } catch (e) {
    console.error('[Нормативка] ошибка при чтении хранилища:', e);
  }
  return defaults;
}

async function saveProgress(progress) {
  try {
    const json = JSON.stringify(progress);
    if (hasClaudeStorage()) {
      await window.storage.set(STORAGE_KEY, json);
    } else {
      localStorage.setItem(STORAGE_KEY, json);
    }
  } catch (e) {
    console.error('[Нормативка] ошибка при сохранении:', e);
  }
}

QUESTIONS.forEach(q => { BLOCK_NAMES[q.block] = q.blockName; });
const BLOCK_NUMBERS = Object.keys(BLOCK_NAMES).map(Number).sort((a,b) => a-b);
const TICKET_SIZE = 20;

function getTickets() {
  const tickets = [];
  for (let i = 0; i < QUESTIONS.length; i += TICKET_SIZE) {
    tickets.push(QUESTIONS.slice(i, i + TICKET_SIZE));
  }
  return tickets;
}

const THEORY = {"1": {"name": "Пожарная безопасность и эвакуация", "notes": [{"title": "Конспект-залп (главное)", "file": "КОНСПЕКТ-ЗАЛП — Блок 1", "md": "#нормативка #конспект #пожарная_безопасность #эвакуация\n\n← [[Нормативная база — карта]] · далее: [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]] · [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]] · [[КОНСПЕКТ-ЗАЛП — Общественные здания (Блок 4)]]\n\n# КОНСПЕКТ-ЗАЛП · Блок 1: пожарная безопасность и эвакуация\n\nЧитать целиком за один подход. Детали, примеры и обоснования — в исходных заметках (ссылки в конце каждого раздела). Здесь — только то, что должно всплывать в голове мгновенно.\n\n---\n\n## 1. Три критерия пожарно-технической классификации (123-ФЗ, ст.29)\n\n**Класс функциональной пожарной опасности (Ф)** — ст.32:\n- Ф1.1 — детсады, интернаты, дома престарелых (неквартирные), стационары\n- Ф1.2 — гостиницы, общежития (не квартирного типа)\n- **Ф1.3 — МКД** (наша основная типология)\n- Ф1.4 — одноквартирные/блокированные\n- Ф2.х — зрелищные (2.1/2.2 закрытые, 2.3/2.4 открытые)\n- Ф3.1–3.7 — обслуживание населения (торговля, общепит, вокзалы, поликлиники (не путать с Ф1.1 — там стационар), быт.обслуживание, спорт без трибун, религия)\n- Ф4.1–4.4 — образование/офисы (4.3 — банки, конторы, офисы), пожарные депо\n- Ф5.1–5.3 — производство/склады (5.2 — паркинг без ТО)\n\n**Степень огнестойкости (I–V)** — ст.30, определяется по табл. высота/площадь в СП2.13130 (своя для каждого Ф; для Ф1.3 — табл.6.8)\n**Класс конструктивной опасности (С0–С3)** — ст.31, определяется той же таблицей, в паре со степенью\n\n→ [[Класс функциональной пожарной опасности]] · [[Огнестойкость]] · [[Класс конструктивной пожарной опасности]]\n\n---\n\n## 2. Как подобрать степень + класс (Ф1.3, табл.6.8 СП2.13130)\n\n| Степень | Класс | Высота, м | Площадь этажа отсека, м² |\n|---|---|---|---|\n| I | С0 | 75 | 2500 |\n| II | С0 | 50 | 2500 |\n| II | С1 | 28 | 2200 |\n| III | С0 | 28 | 1800 |\n| III | С1 | 15 | 1800 |\n| IV | С0/С1/С2 | 3–5 | 500–1400 |\n\n**Алгоритм:** знаешь класс Ф + высоту + площадь этажа отсека → ищешь минимально достаточную строку → это и есть степень+класс. Выбирают наименее строгую подходящую (дешевле).\n\n**Высота (пожарно-техническая)** = отметка верхнего этажа минус отметка проезда пожарных машин; если нет открывающегося окна — полусумма отметок пола/потолка (СП1.13130, п.3.1).\n**Площадь этажа в пределах отсека** — без учёта лестничных клеток (СП2.13130, разд.6) — **не путать** с площадью этажа для ТЭП (та включает лестничные площадки).\n\nДеление на отсеки регулирует **только площадь**, не высоту — высота это характеристика здания целиком.\n\n→ [[Пожарные отсеки и противопожарные преграды]]\n\n---\n\n## 3. Таблицы 21/22 123-ФЗ — что означают буквы\n\n**R** — несущая способность, **E** — целостность (нет трещин/отверстий), **I** — теплоизоляция. Число = минуты.\nПример: II степень → внутр. стены ЛК **REI 90**, марши **R 60**.\n\n**К0–К3** — класс пожарной опасности конструкции (что выделяет при горении, не время). К0 = непожароопасно.\nПример: класс С1 → стены ЛК/преграды **К0**, несущие элементы **К1**.\n\nОгнестойкость и класс К — **независимые** требования к одной конструкции, проверяются одновременно.\n\n→ [[Огнестойкость]] · [[Класс конструктивной пожарной опасности]]\n\n---\n\n## 4. Площадь этажа в пределах пожарного отсека\n\nЭто единственное «площадное» понятие, которое реально принадлежит теме пожарной безопасности — используется в табл.6.8 СП2.13130 (раздел 2 выше) для подбора степени огнестойкости/класса. Считается **без учёта лестничных клеток** (СП2.13130, разд.6).\n\n⚠️ **Не путать** с обычной «площадью этажа» для ТЭП (СП54, А.1.3) — та, наоборот, **включает** лестничные площадки. Взять не то число в табл.6.8 — получить неверную степень огнестойкости.\n\nПолная терминология площадей (застройка/здание/квартира и т.д.) для ТЭП — это отдельная тема, не пожарной безопасности, вынесена целиком → **[[Площади здания — термины ТЭП]]** (там же и коэффициенты летних помещений, паркинг, ПОН и другие практические детали расчёта).\n\n**Категории помещений (А, Б, В1–В4, Г, Д)** — ещё одна смежная тема, отдельная методика для производственных/складских помещений (в т.ч. встроенных технических/кладовых внутри жилых/общественных зданий) → **[[Категории помещений по пожарной опасности]]**\n\n---\n\n## 5. Число эвакуационных выходов\n\n**Аварийные выходы — что это (п.4.2.4)**: не учитываются в расчёте эвакуации, доп. мера безопасности. 5 типов:\n- а) балкон/лоджия с простенком ≥1,2м (или ≥1,6м между остеклёнными проёмами) + 2 окна ≥0,8м² + верх окна ≥2,5м от пола\n- б) переход (галерея) ≥0,6м в смежную секцию\n- в) балкон/лоджия ≥0,6м с лестницей через люк ≥0,6×0,8м на нижний этаж\n- г) выход наружу из помещений на отметке −4,5…+5,0м через окно/дверь ≥0,75×1,5м или люк ≥0,6×0,8м\n- д) выход на кровлю (I–III степень, С0/С1) через окно/дверь/люк с лестницей\n\n**Общие правила (любые здания, п.4.2.7–4.2.17):**\n- ≥50 человек в помещении → 2 выхода\n- Подвал/цоколь (>0,5м) >6 человек → 2 выхода (6–15 чел — один может быть аварийным)\n- Путь >25м до выхода (кроме Ф5, <50 чел) → 2 выхода\n- Классы Ф1.1/Ф1.2/Ф2.1/Ф2.2/Ф3/Ф4 → как правило 2 выхода (искл: h≤15м + Ф1.2/Ф3/Ф4.3 + S≤300м² + ≤20 чел → 1 выход)\n\n**Жильё Ф1.3 (п.6.1.1) — своя матрица по площади квартир на этаже секции:**\n- **>500 м²** → как правило 2 выхода\n- **500–550 м²** (переходная зона, НЕ ошибка!) → допустим 1 выход:\n  - высота ≤28м → обычная ЛК + адресная сигнализация в прихожих\n  - высота >28м → ЛК типа Н1 + сигнализация/автопожаротушение во ВСЕХ помещениях квартир (кроме мокрых зон)\n- 1 выход + квартира выше 15м → нужен аварийный выход\n\n→ [[Пути эвакуации — жилые здания (Ф1.3)]] · [[Эвакуационные и аварийные выходы — раздел 4.2 СП1.13130]] (полный текст главы — все общие правила п.4.2.5–4.2.17 целиком, плюс аварийные выходы п.4.2.4)\n\n---\n\n## 6. Типы ЛК — матрица по высоте (секционные дома, Ф1.3)\n\n| Высота | S≤500м² | 500–550м² | >550м² (=>500 факт.) |\n|---|---|---|---|\n| до 9м | Л2, 1 выход | Л2, 1 выход | Л2, 2 выхода |\n| 9–12м (Л2 только при автооткрывании верхнего светового проёма при пожаре) | Л2, 1 выход | Л2, 1 выход | Л2, 2 выхода |\n| до 28м | Л1+сигнал., 1 выход | Л1+сигнал., 1 выход | 1: Л1; альт: Н2/Н3 без окон, 2 выхода |\n| **28–75м** | Н1(станд.) или Н2 по п.6.1.3 (тамбур-шлюз+лифт+сигнал.+СОУЭ1), 1 выход | Н1, 1 выход | **2 выхода: один Н1, второй Н2 без окон+тамбур-шлюз** |\n| >75м | Н2+тамбур-шлюз, 1 выход | Н2, 1 выход | 2×Н2 с тамбур-шлюзом; один из двух может быть Н3 |\n\n⚠️ **Частая ошибка** (моя же!): перепутать диапазон 28–75м и >75м — в 28–75м только ВТОРОЙ выход требует тамбур-шлюза, в >75м — ОБА.\n\n⚠️ **Ещё одна деталь, которую легко упустить:** строки «до 9м» и «9–12м» дают одинаковый результат по числу выходов/типу ЛК, но это не значит, что их можно сливать в одну — сам **допуск применения Л2 выше 9м обусловлен отдельным условием** (автоматическое открывание верхнего светового проёма при пожаре), которого нет для базового случая до 9м. Плюс отдельно, **независимо от площади**, для любого здания с ЛК типа Л2 высотой >9м действует п.6.1.5: каждая квартира выше 4 м должна иметь аварийный выход.\n\n**Определения:** Л1 — естественный свет через стены; Л2 — через покрытие; Н1 — воздушная зона снаружи; Н2 — подпор воздуха на ЛК; Н3 — тамбур-шлюз на каждом этаже.\n\n→ [[Лестницы — ширина марша и высота ограждения]] · [[Пути эвакуации — жилые здания (Ф1.3)]]\n\n---\n\n## 7. Геометрия — марш, ограждение\n\n**Ширина марша (мин) / уклон (макс):**\n- Секционные 2-этажные: 1,05м / 1:1,5\n- Секционные 3+ этажные: 1,05м / 1:1,75\n- Коридорные: 1,2м / 1:1,75\n- Внутриквартирные/подвал: 0,9м / 1:1,25\n\n**Высота ограждения (СП54, п.6.4.5):**\n- Базово: **0,9 м**\n- Зазор между маршами **>0,12 м** → **1,2 м**\n- Наружные лестницы/балконы/перепады пола ≥0,45м → 1,2 м всегда\n\n⚠️ В общественных зданиях (СП118) порог другой — **0,3 м**, не 0,12 — разные документы, разные пороги.\n\n→ [[Лестницы — ширина марша и высота ограждения]]\n\n---\n\n## 8. Противопожарные преграды\n\n8 типов: стены, перегородки, перекрытия, разрывы, занавесы/шторы/экраны, водяные завесы, минерализованные полосы, зона без нагрузки.\n\n**Табл.24 123-ФЗ (заполнение проёмов):** двери/ворота 1/2/3 типа — EI 60/30/15. Двери лифтовых шахт — EI 30 (E30 если здание ≤28м). Площадь проёмов в преграде ≤25%.\n\n**Тамбур-шлюз** нужен: вход в категории А/Б, сообщение подвала с 1-м этажом через отдельную лестницу, выход из встроенного паркинга в жильё.\n\n→ [[Пожарные отсеки и противопожарные преграды]]\n\n---\n\n## 9. Аварийные выходы (не эвакуационные!)\n\n→ Полный текст с формулировками — **[[Эвакуационные и аварийные выходы — раздел 4.2 СП1.13130]]** · **[[Пути эвакуации — жилые здания (Ф1.3)]]**\n\n> [!important] В чём разница — коротко\n> **Эвакуационный выход** — основной, штатный путь спасения, который считается при проектировании: от него зависит число выходов, их ширина, соответствие нормам путей эвакуации.\n> **Аварийный выход** — дополнительная, резервная мера безопасности (балкон с простенком, наружная лестница, люк). Он **не учитывается** в расчёте числа/ширины эвакуационных выходов и не может их заменить — это подстраховка сверх основной схемы эвакуации, а не альтернатива ей.\n\n**Когда аварийный выход обязателен (зависит от типа ЛК и высоты):**\n\n| Тип ЛК / высота здания | Порог квартиры, с которого нужен аварийный выход |\n|---|---|\n| Л1, здание до 28 м | выше 15 м |\n| Л2, здание выше 9 м | выше 4 м |\n| Н1/Н2, здание 28–75 м | выше 15 м |\n| Любой тип, здание выше 75 м | не требуются |\n\n⚠️ **Почему для >75 м «не требуются»:** допускается не предусматривать аварийные выходы при спринклерном пожаротушении по всей площади квартир (сам пункт условия не проверен дословно — если попадётся здание такой высоты, свериться отдельно, не отвечать по памяти).\n\n**Двухуровневые квартиры** (верхний уровень выше 18 м) — как правило, выход нужен с каждого уровня, кроме исключений при адресной сигнализации + СОУЭ.\n\n---\n\n## 10. Пожаробезопасные зоны для МГН\n\n→ Подробнее — **[[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]]**\n\n**Пожаробезопасная зона (ПБЗ)** — место на путях эвакуации, где человек, который не может самостоятельно продолжить эвакуацию (в первую очередь группа М4 — колясочники), дожидается помощи спасателей в относительной безопасности от пожара.\n\n**4 типа зон:**\n1. Отдельное помещение или тамбур-шлюз — двери с пределом огнестойкости **EI 60**\n2. Эксплуатируемая кровля, балкон или лоджия\n3. Отдельный пожарный отсек с самостоятельной схемой эвакуации\n4. Сама лестничная клетка — **но не типа Н2** (Н2 быстро выхолаживается за счёт подпора наружного воздуха, для длительного ожидания не подходит)\n\n**Расчёт вместимости зоны:**\n- Группы МГН М2–М4 — не менее 1 человека на этаж (секцию)\n- Группа М1 — не менее 35% от общего числа МГН в здании (для МКД)\n\n---\n\n## 11. Встроенные функции (паркинг, коммерция, кладовые внутри жилого дома)\n\n→ Подробнее — **[[Пути эвакуации — жилые здания (Ф1.3)]]**\n\n**Паркинг → жильё** (сообщение через общие ЛК/лифты):\n- Допустимо только через тамбур-шлюзы **1-го типа** с раздельной подачей воздуха\n- Шахты лифтов — предел огнестойкости REI 120, двери — EI 60\n- С этажа стоянки — не менее **2 рассредоточенных выходов** (1 выход допустим только при ≤5 машиномест)\n- Общую ЛК, служащую для функциональной связи паркинг↔жильё, **нельзя** одновременно использовать как эвакуационный путь из паркинга\n\n**Коммерция → жильё** (встроенные нежилые помещения):\n- Сообщение — через вестибюль жилой части, с тамбуром (без подпора воздуха до высоты 28 м, с подпором — выше)\n- 1 выход из коммерческой части допустим при пути эвакуации <25 м и вместимости ≤50 человек\n\n**Хозяйственные кладовые:**\n- Каждая кладовая — не более 10 м²\n- Блок кладовых — не более 200 м²\n- Отделяются перегородками **1-го типа**\n\n---\n\n## 12. Лифты для пожарных, выходы на кровлю\n\nЛифт для пожарных нужен: Ф1.1 >10м, **Ф1.3 >50м**, прочие Ф >28м, подземный паркинг >2 этажей.\nВыход на кровлю — здания ≥10м, не реже чем через 100м (чердачное) или 1000м² (бесчердачное).\n\n---\n\n## 13. Дополнительные уточнения (проверенные ответы)\n\nПравильные ответы ниже — сверенные, уточняющие детали к основным пунктам блока.\n\n- Высота **горизонтальных** путей эвакуации (коридоры) — **2,0 м** (отдельно от высоты по ЛК — там 2,2 м)\n- Высота эвакуационных дверей в свету — **1,9 м**\n- Максимальная высота ступени на путях эвакуации — **220 мм**\n- Максимальная высота порога для МГН группы М4 — **14 мм**\n- Простенок между ЛК и жилым помещением в наружной стене — **не менее 1200 мм**\n- Ширина пути эвакуации в межквартирном коридоре — **не менее 1400 мм**\n- Простенок между окном ПБЗ и окнами смежных помещений — **2 метра**\n- Ограждение кровли обязательно при высоте здания **более 10 м**\n- Ширина двери из коридора жилой части на ЛК — **не менее 900 мм**\n- Насосная станция ниже земли, площадь <54 м² — достаточно **одного** выхода через изолированную ЛК\n- Зазор для рукавных линий между маршами: до 75м высоты — **75 мм**, в высотных зданиях — **120 мм** (СП477.1325800, п.8.6 — не в базе)\n- ПБЗ обязательна конкретно при доступе МГН группы **М4** (не любой МГН-группы вообще)\n- Ширина коридора с открывающимися дверями: к требуемой ширине +½ длины полотна (двери с одной стороны) / +целая длина полотна (двери с двух сторон)\n- Лифт для пожарных в **лечебных учреждениях** — уже при высоте **более 5 м** (самый низкий порог из всех типов зданий)\n- Встроенный паркинг → жилая часть: 1 тамбур-шлюз 1-го типа с подпором на выходе из паркинга + 2 парно-последовательных тамбур-шлюза на выходе из лифтов в помещение хранения (упоминается **СП7** как источник для лифтовой части — документ не в базе)\n- Грубое нарушение ПБ: путь пожарных на кровлю через люк из коридора/офиса **в общее пространство чердака** — недопустимо, нужен проход через ЛК/лестницу 3-го типа\n\n⚠️ **Найдено прямое противоречие с первоисточником:** таблица отмечает как верный ответ «ограждение ЛК всегда ≥1,2 м», но дословный текст СП54.13330.2022 п.6.4.5 говорит «0,9 м, а при зазоре >0,12 м — 1,2 м» (мы это проверяли ранее). На защите решения ориентируйся на текст СП, а не на этот вариант, если не найдёшь дополнительного обоснования для 1,2 м всегда.\n\n→ Полный список вопросов и ответов — в самой таблице «секретная.xlsx», лист «ПБ»\n\n---\n1. Спутала диапазон высоты 28–75м и >75м для типа ЛК (см. п.6 выше)\n2. Сначала неверно объявила «550 м²» опечаткой — на деле это отдельный легитимный порог из п.6.1.1 (число выходов), отличный от порога 500м² из п.6.1.3 (замена типа ЛК)\n3. Путала «площадь квартиры» (без балконов, для min по СП54) и «общую площадь квартир» (с балконами, для расчёта выходов по СП1.13130)\n\n---\n\n## Связанные заметки\n[[Блок 1 — Пожарная безопасность и эвакуация]] · [[Класс функциональной пожарной опасности]] · [[Огнестойкость]] · [[Класс конструктивной пожарной опасности]] · [[Пожарные отсеки и противопожарные преграды]] · [[Лестницы — ширина марша и высота ограждения]] · [[Площади здания — термины ТЭП]] · [[Пути эвакуации — жилые здания (Ф1.3)]] · [[Нормативная база — карта]]\n", "diagrams": []}, {"title": "Класс функциональной пожарной опасности", "file": "Класс функциональной пожарной опасности", "md": "#нормативка #пожарная_безопасность #справочник\n\n← назад: [[Блок 1 — Пожарная безопасность и эвакуация]] · [[Нормативная база — карта]]\n\n---\n\n# Класс функциональной пожарной опасности\n\nТретий из трёх критериев пожарно-технической классификации (наряду с [[Огнестойкость|огнестойкостью]] и [[Класс конструктивной пожарной опасности|классом конструктивной опасности]]) — и первый шаг всей цепочки: именно он определяет, какой объектный СП и какая таблица СП2.13130 применяются к зданию.\n\n**Документы:** [[123-ФЗ]], ст. 32\n\n---\n\n## Зачем нужна эта классификация\n\nИз ст. 28 123-ФЗ: применяется для установления требований пожарной безопасности **в зависимости от функционального назначения и пожарной опасности** здания — то есть определяет, по какому объектному своду правил проектировать (жилой дом → СП54, общественное здание → СП118 и т.д.), и какую строку таблицы СП2.13130 использовать для подбора степени огнестойкости/класса конструктивной опасности (см. [[Пожарные отсеки и противопожарные преграды]]).\n\nКритерий классификации — не просто назначение, а ещё и **возраст, физическое состояние и количество людей**, а также возможность пребывания в состоянии сна (ст. 32 ч.1) — поэтому, например, детский сад и офис при похожей вместимости попадают в разные, не смежные классы.\n\n---\n\n## Полная классификация (123-ФЗ, ст. 32)\n\n### Ф1 — для постоянного проживания и временного пребывания людей\n| Класс | Что относится |\n|---|---|\n| **Ф1.1** | Детские дошкольные организации, специализированные дома престарелых и инвалидов (неквартирные), спальные корпуса образовательных организаций с интернатом и детских организаций, медицинские организации для стационарной помощи (круглосуточно) |\n| **Ф1.2** | Гостиницы, общежития (кроме квартирного типа), спальные корпуса санаториев и домов отдыха общего типа, кемпингов |\n| **Ф1.3** | Многоквартирные жилые дома, в т.ч. общежития квартирного типа |\n| **Ф1.4** | Одноквартирные жилые дома, в т.ч. блокированные |\n\n### Ф2 — зрелищные и культурно-просветительные учреждения\n| Класс | Что относится |\n|---|---|\n| **Ф2.1** | Театры, кинотеатры, концертные залы, клубы, цирки, спортивные сооружения с трибунами, библиотеки — в закрытых помещениях |\n| **Ф2.2** | Музеи, выставки, танцевальные залы и подобное — в закрытых помещениях |\n| **Ф2.3** | То же, что Ф2.1, но на открытом воздухе |\n| **Ф2.4** | То же, что Ф2.2, но на открытом воздухе |\n\n### Ф3 — организации по обслуживанию населения\n| Класс | Что относится |\n|---|---|\n| **Ф3.1** | Организации торговли |\n| **Ф3.2** | Организации общественного питания |\n| **Ф3.3** | Вокзалы |\n| **Ф3.4** | Медицинские организации для медицинской деятельности (амбулаторно — не путать с Ф1.1, где стационар) |\n| **Ф3.5** | Помещения для посетителей бытового/коммунального обслуживания с нерасчётным числом мест |\n| **Ф3.6** | Физкультурно-оздоровительные комплексы и спортивно-тренировочные учреждения без трибун, бытовые помещения, бани |\n| **Ф3.7** | Объекты религиозного назначения |\n\n### Ф4 — образовательные, научные, проектные организации, органы управления\n| Класс | Что относится |\n|---|---|\n| **Ф4.1** | Общеобразовательные организации, доп. образование детей, профессиональные образовательные организации |\n| **Ф4.2** | Образовательные организации высшего образования, доп. профессиональное образование |\n| **Ф4.3** | Органы управления учреждений, проектно-конструкторские, информационные, редакционно-издательские, научные организации, банки, конторы, офисы |\n| **Ф4.4** | Здания пожарных депо |\n\n### Ф5 — производственного или складского назначения\n| Класс | Что относится |\n|---|---|\n| **Ф5.1** | Производственные здания, сооружения, производственные и лабораторные помещения, мастерские, крематории |\n| **Ф5.2** | Складские здания, сооружения, стоянки автомобилей без техобслуживания и ремонта, книгохранилища, архивы, складские помещения |\n| **Ф5.3** | Здания сельскохозяйственного назначения |\n\n---\n\n## Практические нюансы, о которых легко забыть\n\n> [!warning] Ф1.1 vs Ф3.4 — оба «медицинские», но разные\n> Ф1.1 — медицинские организации для **стационарной** помощи (круглосуточно, есть спальные места). Ф3.4 — медицинские организации для амбулаторной деятельности (поликлиники). Один и тот же профиль «медицина» может попасть в два разных класса в зависимости от формата оказания помощи.\n\n> [!warning] Ф1.2 vs Ф1.3 — гостиница или общежитие квартирного типа?\n> Ф1.2 — общежития **кроме** квартирного типа. Общежития квартирного типа идут в Ф1.3 вместе с обычными МКД (это прямо повлияет на то, по какому СП проектировать — СП54, а не гостиничные нормы).\n\n> [!warning] Многофункциональные здания\n> Если здание сочетает несколько функций (например, жильё + встроенные коммерческие помещения + паркинг), каждая часть анализируется по своему классу Ф отдельно, а на стыках применяются требования к разделяющим конструкциям (см. [[Пожарные отсеки и противопожарные преграды]]) — здание не получает единого «среднего» класса.\n\n---\n\n## Где эта классификация используется дальше по программе\n\n- [[Пожарные отсеки и противопожарные преграды]] — таблица СП2.13130 для подбора степени огнестойкости/класса конструктивной опасности своя для каждого класса Ф\n- [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]] — весь блок про Ф1.3\n- [[КОНСПЕКТ-ЗАЛП — Общественные здания (Блок 4)]] — Ф1.2, Ф2, Ф3, Ф4\n- [[КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)]] — Ф5.2 как самостоятельный объект, либо встроенный в другой класс Ф\n\n---\n\n## Связанные заметки\n[[123-ФЗ]] · [[Огнестойкость]] · [[Класс конструктивной пожарной опасности]] · [[Пожарные отсеки и противопожарные преграды]] · [[Блок 1 — Пожарная безопасность и эвакуация]] · [[Нормативная база — карта]]\n", "diagrams": []}, {"title": "Огнестойкость", "file": "Огнестойкость", "md": "#нормативка #пожарная_безопасность #справочник\n\n← назад: [[Блок 1 — Пожарная безопасность и эвакуация]] · [[Пожарные отсеки и противопожарные преграды]] · [[Нормативная база — карта]]\n\n---\n\n# Огнестойкость\n\nЧто такое степень огнестойкости здания и предел огнестойкости конструкций — тема «сколько времени конструкция держится».\n\n**Документы:** [[123-ФЗ]] (ст. 30, 87 ч.1–2, приложение табл. 21)\n\n---\n\n## Что нормируется\n\n**Степень огнестойкости здания** — одна из трёх характеристик пожарно-технической классификации (наряду с классом конструктивной опасности и классом функциональной опасности, см. [[Класс конструктивной пожарной опасности]]). Здания делятся на I, II, III, IV и V степени огнестойкости (123-ФЗ ст. 30).\n\n**Предел огнестойкости конструкции** — сколько времени (в минутах) конструкция сохраняет заданные свойства при стандартном огневом испытании, по трём признакам:\n\n| Индекс | Что проверяется | Смысл простыми словами |\n|---|---|---|\n| **R** | Несущая способность | Конструкция не должна обрушиться |\n| **E** | Целостность | Не должно появиться сквозных трещин/отверстий, через которые пройдёт пламя и дым |\n| **I** | Теплоизолирующая способность | Обратная от огня сторона не должна нагреваться выше допустимого предела |\n\nЧисло после буквы — минуты. Например, **REI 60** — конструкция 60 минут одновременно держит нагрузку, остаётся целостной и не пропускает критическое тепло.\n\n---\n\n## Таблица 21 123-ФЗ — предел огнестойкости конструкций по степеням\n\nОтсылка — ст. 87 ч.2 123-ФЗ.\n\n| Степень огнестойкости | Несущие стены, колонны | Наружные ненесущие стены | Междуэтажные перекрытия | Покрытие: настилы | Покрытие: фермы/балки/прогоны | ЛК: внутренние стены | ЛК: марши и площадки |\n|---|---|---|---|---|---|---|---|\n| I | R 120 | E 30 | REI 60 | RE 30 | R 30 | REI 120 | R 60 |\n| II | R 90 | E 15 | REI 45 | RE 15 | R 15 | REI 90 | R 60 |\n| III | R 45 | E 15 | REI 45 | RE 15 | R 15 | REI 60 | R 45 |\n| IV | R 15 | E 15 | REI 15 | RE 15 | R 15 | REI 45 | R 15 |\n| V | не нормируется | не нормируется | не нормируется | не нормируется | не нормируется | не нормируется | не нормируется |\n\n> [!note] Нюанс\n> Таблица задаёт **требуемый** предел огнестойкости — то, что нужно обеспечить конструктивным решением. Как именно этого добиться (толщина, армирование, огнезащита) таблица не говорит — фактический предел подтверждается сертификатом/техническим свидетельством или расчётом.\n>\n> V степень почти везде «не нормируется» — такие здания обычно одноэтажные, ограниченного класса функциональной опасности, риск компенсируется не огнестойкостью конструкций, а другими мерами.\n\n---\n\n## Как определить степень огнестойкости для конкретного проекта\n\nТаблица 21 показывает **что обеспечить**, если степень уже выбрана. Сам выбор степени — не свободное решение, а обратный подбор по таблице СП2.13130, привязанной к желаемой высоте и площади здания — этот механизм и связь с классом конструктивной опасности разобраны в [[Пожарные отсеки и противопожарные преграды]].\n\n---\n\n## Связь с классом пожарной опасности конструкций\n\nОгнестойкость (R/E/I, сколько держится) и класс пожарной опасности конструкций (К0–К3, что выделяет при горении) — два **независимых, но параллельных** требования к одной и той же конструкции. Оба проверяются одновременно. Подробнее — [[Класс конструктивной пожарной опасности]].\n\n---\n\n## Связанные заметки\n[[123-ФЗ]] · [[Класс функциональной пожарной опасности]] · [[Класс конструктивной пожарной опасности]] · [[Пожарные отсеки и противопожарные преграды]] · [[Блок 1 — Пожарная безопасность и эвакуация]] · [[Нормативная база — карта]]\n", "diagrams": []}, {"title": "Класс конструктивной пожарной опасности", "file": "Класс конструктивной пожарной опасности", "md": "#нормативка #пожарная_безопасность #справочник\n\n← назад: [[Блок 1 — Пожарная безопасность и эвакуация]] · [[Пожарные отсеки и противопожарные преграды]] · [[Нормативная база — карта]]\n\n---\n\n# Класс конструктивной пожарной опасности\n\nЧто такое класс конструктивной пожарной опасности здания и класс пожарной опасности конструкций — тема «что конструкция выделяет при горении и способствует ли распространению пожара».\n\n**Документы:** [[123-ФЗ]] (ст. 31, 87 ч.5–6, приложение табл. 22)\n\n---\n\n## Что нормируется\n\n**Класс конструктивной пожарной опасности здания** — одна из трёх характеристик пожарно-технической классификации (наряду со степенью огнестойкости, см. [[Огнестойкость]], и классом функциональной опасности). Здания делятся на классы **С0, С1, С2, С3** (123-ФЗ ст. 31).\n\nВ отличие от огнестойкости (которая про время сопротивления), здесь нормируется поведение материала конструкции при горении — образно говоря, «насколько сама конструкция подливает масла в огонь».\n\n**Класс пожарной опасности конструкций (К):**\n\n| Класс | Смысл |\n|---|---|\n| **К0** | Непожароопасные — конструкция не способствует распространению пожара |\n| **К1** | Малопожароопасные |\n| **К2** | Умеренно пожароопасные |\n| **К3** | Пожароопасные |\n\nЧем выше цифра — тем хуже поведение конструкции при пожаре.\n\n---\n\n## Таблица 22 123-ФЗ — класс пожарной опасности конструкций по классам здания\n\nОтсылка — ст. 87 ч.6 123-ФЗ.\n\n| Класс констр. опасности здания | Несущие стержневые элементы | Наружные стены | Стены/перегородки/перекрытия | Стены ЛК и противопожарные преграды | Марши и площадки ЛК |\n|---|---|---|---|---|---|\n| С0 | К0 | К0 | К0 | К0 | К0 |\n| С1 | К1 | К2 | К1 | К0 | К0 |\n| С2 | К3 | К3 | К2 | К1 | К1 |\n| С3 | не нормируется | не нормируется | не нормируется | К1 | К3 |\n\n> [!note] Ключевой паттерн\n> Столбец «стены ЛК и противопожарные преграды» почти всегда строже соседних (везде К0 или К1, никогда «не нормируется») — пути эвакуации и преграды между отсеками защищены жёстче, чем рядовые несущие конструкции, даже в зданиях самого мягкого класса С3.\n\n---\n\n## Как определить класс для конкретного проекта\n\nКласс конструктивной опасности не выбирается свободно — он подбирается вместе со степенью огнестойкости, одной парой, по таблице СП2.13130 (своей для каждого класса Ф), исходя из желаемой высоты здания и площади этажа. Алгоритм и пример подбора — в [[Пожарные отсеки и противопожарные преграды]].\n\n---\n\n## Связь с огнестойкостью\n\nКласс пожарной опасности (что выделяет при горении) и степень огнестойкости (сколько держится, R/E/I) — два **независимых, но параллельных** требования к одной и той же конструкции. Оба проверяются одновременно и не заменяют друг друга. Например, внутренняя стена лестничной клетки в здании II степени огнестойкости класса С1 должна одновременно иметь REI 90 (по огнестойкости) и К0 (по классу пожарной опасности). Подробнее про огнестойкость — [[Огнестойкость]].\n\n---\n\n## Связанные заметки\n[[123-ФЗ]] · [[Класс функциональной пожарной опасности]] · [[Огнестойкость]] · [[Пожарные отсеки и противопожарные преграды]] · [[Блок 1 — Пожарная безопасность и эвакуация]] · [[Нормативная база — карта]]\n", "diagrams": []},
