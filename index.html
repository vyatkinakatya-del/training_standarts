· [[КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)]] · [[Нормативная база — карта]]\n", "diagrams": []}, {"title": "Ограждения — требования по всем случаям", "file": "Ограждения — требования по всем случаям", "md": "#нормативка #ограждения #справочник\n\n← [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[Лестницы — ширина марша и высота ограждения]] · [[Нормативная база — карта]]\n\n# Ограждения — требования по всем случаям\n\nСводная заметка — тема сквозная, разбросана по 6 файлам. Здесь всё в одном месте, с указанием, где искать подробности.\n\n---\n\n## Лестницы — внутренние марши и площадки\n\n**Норма (СП54, п.6.4.5 / СП118, п.6.12):**\n- Базово — не менее **0,9 м**\n- При зазоре между маршами/ограждениями **>0,12 м** (жильё) — не менее **1,2 м**\n- При зазоре **>0,3 м** (общественные здания, СП118) — не менее **1,2 м**\n\n⚠️ **Разные пороги для жилья и общественных зданий** — 0,12 м vs 0,3 м, разные документы.\n\n> [!note] Внутренняя рекомендация (не жёсткая норма)\n> Рекомендуемая высота ограждения внутренней лестницы — **1,2 м** даже там, где формально можно 0,9 м. Применение пониженного варианта — согласовывать с ГИПом.\n\n→ Подробнее: [[Лестницы — ширина марша и высота ограждения]]\n\n---\n\n## Наружные элементы — единое правило 1,2 м\n\n**Наружные лестницы, балконы, лоджии, террасы, перепады пола ≥0,45 м** — всегда не менее **1,2 м**, независимо от зазора между маршами (в отличие от внутренних лестниц, где порог зависит от зазора).\n\n## Кровля\n\n**Жилое здание (Ф1.3), плоская неэксплуатируемая кровля** — ограждение не менее **1,2 м**.\n\nДля зданий **>75 м** — высота ограждения по **СП267.1325800** (документ не в базе).\n\n## Воздушная зона незадымляемой ЛК типа Н1\n\nПереход через наружную воздушную зону у ЛК типа Н1 — ограждение не менее **1,2 м** (та же величина, что и ширина самой зоны).\n\n→ Подробнее: [[Лестничные клетки — типы Л1 Л2 Н1 Н2 Н3]]\n\n## Балконы/лоджии для МГН (колясочников)\n\n- Высота ограждения — **1,15–1,2 м**, с прозрачным заполнением (чтобы человек на кресле-коляске видел через ограждение)\n- Простенок от наружной стены до ограждения — не менее **1,4 м** (для манёвра кресла-коляски)\n- Порог двери на балкон/лоджию — не более **14 мм**\n\n→ Подробнее: [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]]\n\n## Подоконник ниже нормируемой высоты (0,9 м от УЧП)\n\nЕсли нижний уровень остекления ниже 0,9 м — требуются дополнительные меры безопасности:\n- Горизонтальный импост, рассчитанный на нагрузку\n- Безопасное стекло ниже импоста\n- **Ограждение снаружи**\n\n→ Подробнее: [[КОНСПЕКТ-ЗАЛП — Общестроительные]]\n\n---\n\n## Сводная таблица — все высоты в одном месте\n\n| Случай | Высота ограждения |\n|---|---|\n| Внутренние лестницы, зазор ≤0,12м (жильё) / ≤0,3м (общественные) | 0,9 м |\n| Внутренние лестницы, зазор больше порога | 1,2 м |\n| Наружные лестницы/балконы/лоджии/террасы/перепады ≥0,45м | 1,2 м |\n| Кровля жилого здания, плоская неэксплуатируемая | 1,2 м |\n| Воздушная зона ЛК типа Н1 | 1,2 м |\n| Балкон/лоджия для колясочников (МГН) | 1,15–1,2 м |\n| Кровля/лестницы зданий >75 м | по СП267.1325800 (не в базе) |\n\n⚠️ Заметь: почти везде итоговое число — **1,2 м**. Единственное системное исключение — базовые 0,9 м для внутренних лестниц с небольшим зазором между маршами.\n\n---\n\n## Связанные заметки\n[[Лестницы — ширина марша и высота ограждения]] · [[Лестничные клетки — типы Л1 Л2 Н1 Н2 Н3]] · [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]] · [[КОНСПЕКТ-ЗАЛП — Общестроительные]] · [[КОНСПЕКТ-ЗАЛП — Общественные здания (Блок 4)]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[Нормативная база — карта]]\n", "diagrams": []}]}, "2": {"name": "Жилые здания (СП54)", "notes": [{"title": "Конспект-залп СП54", "file": "КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)", "md": "#нормативка #конспект #жилые_здания\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]]\n\n# КОНСПЕКТ-ЗАЛП · СП 54.13330.2022 целиком (Блок 2)\n\nДополняет блок 1 — здесь всё остальное содержание СП54, не связанное напрямую с эвакуацией/ПБ (то уже разобрано в блоке 1).\n\n> [!important] Стандарт точности\n> Определения терминов (раздел 2) даны **дословно**, с номером пункта — не пересказ. Остальные разделы (размеры, лифты, инженерия) — сжато для беглого чтения, но числа и пороги сверены с текстом СП.\n\n> [!warning] Приложение А (площади, объём, этажность) — вынесено в отдельную заметку\n> Всё содержимое **Приложения А** СП54 (площадь застройки/здания/этажа/квартиры, строительный объём, этажность) находится **не здесь**, а в **[[Площади здания — термины ТЭП]]** — вместе с практическими правилами подсчёта ТЭП. Это самое часто используемое приложение СП54, поэтому ссылка продублирована в оглавлении ниже.\n\n**Оглавление:**\n1. Область применения\n2. Ключевые определения (разд.3.1)\n3. Комнаты и помещения квартир — размеры\n4. Лифты\n5. Санитарно-эпидемиологические требования (разд.7)\n6. Энергосбережение (разд.8)\n7. Инженерное оборудование (разд.9)\n8. Отдельные практические детали\n→ **Приложение А (площади, объём, этажность) — [[Площади здания — термины ТЭП]]**\n→ Приложение Б (номенклатура встроенных учреждений) — см. [[Пути эвакуации — жилые здания (Ф1.3)]]\n→ Приложение В (число лифтов) — раздел 4 этой заметки\n\n---\n\n## 1. Область применения (п.1.1–1.2)\n\nРаспространяется на: новые и реконструируемые МКД (включая блокированные) **высотой до 75 м**, малоэтажная/среднеэтажная/многоэтажная застройка, общежития квартирного типа, жилые помещения в зданиях иного назначения.\n\n**Не распространяется на:** одноквартирные дома отдельно стоящие/блокированные (→ СП55.13330), мобильные жилые здания, спецжилфонд (ст.92 ЖК РФ п.2–8).\n\n## 2. Ключевые определения (разд.3.1) — весь глоссарий, 48 терминов\n\n⚠️ Раньше здесь была примерно половина терминов (то, что случайно попало в один поисковый запрос). Отдельная проверка показала, что список организационной практики (стадии, оси, ГПЗУ, авторский надзор) — это не термины СП54, так что не помогла сузить список. Поэтому — весь раздел 3.1 целиком, ничего не выбирая на глаз.\n\n### Типы зданий (3.1.6–3.1.11)\n- **Здание жилое многоквартирное** (3.1.6): жилое здание, включающее 2+ квартиры, помещения общего пользования и общие инженерные системы\n- **...блокированное** (3.1.7): для малоэтажной застройки, общие инженерные системы, каждая квартира — самостоятельный выход на приквартирный участок и/или придомовую территорию; помещения разных квартир могут располагаться друг над другом\n- **...галерейного типа** (3.1.8): все квартиры этажа — выход через общую галерею у наружной стены не менее чем на **две** лестницы\n- **...коридорного типа** (3.1.9): квартиры этажа — выход через общий коридор не менее чем в **две** лестничные клетки\n- **...секционного типа** (3.1.10): состоит из секций, разделённых стенами без проёмов (кроме проёмов на техэтажах/нежилых этажах с учётом ПБ); квартиры секции — выход на одну ЛК напрямую, через коридор или лифтовый холл\n- **...«зелёное»** (3.1.11): отвечает требованиям комфортности/энергоэффективности/ресурсосбережения/экологичности по принципам устойчивого развития и декарбонизации\n\n### Квартира и её помещения (3.1.12, 3.1.14–3.1.18, 3.1.27)\n- **Квартира (жилое помещение)** (3.1.12): структурно обособленное помещение с прямым доступом к местам общего пользования, состоящее из жилых комнат + вспомогательных помещений\n- **Комната жилая** (3.1.15): часть квартиры для непосредственного проживания\n- **Комната ванная** (3.1.14): с ванной/душевой кабиной + раковиной\n- **Кухня** (3.1.16): с обеденной зоной + место для приготовления пищи/мойки/хранения посуды\n- **Кухня-ниша** (3.1.17): зона смежно с жилым/вспомогательным помещением, с электроплитой + мойкой + приточно-вытяжной вентиляцией (мех. или естеств.)\n- **Кухня-столовая** (3.1.18): обеденная зона для всей семьи одновременно + место для готовки\n- **Помещение вспомогательное** (3.1.27): для коммуникационных/санитарных/технических/хозбытовых нужд — кухня, передняя, внутриквартирные холл/коридор, ванная/душевая, уборная, туалет, совмещённый санузел, кладовая, постирочная, теплогенераторная и т.п.\n\n### Летние и полуоткрытые помещения (3.1.1–3.1.4, 3.1.19, 3.1.34)\n- **Антресоль** (3.1.1, не этаж!): площадка с доступом на/под неё, высота — для безопасной эксплуатации, площадь ≤40% помещения\n- **Балкон** (3.1.2): выступающая огороженная площадка, ограниченная глубина увязана с освещением примыкающего помещения; может быть с покрытием/остеклением\n- **Балкон французский** (3.1.3): световой проём с балконным блоком + внешним визуально проницаемым ограждением, БЕЗ наружной площадки; нижняя грань проёма шириной <0,6 м эксплуатируемой площадкой не является\n- **Веранда** (3.1.4): застеклённое сезонное неотапливаемое помещение, без ограничения по глубине, может быть на перекрытии нижерасположенного этажа\n- **Лоджия** (3.1.19): неотапливаемое помещение, стены с трёх сторон (или двух — угловое расположение) на всю высоту этажа, ограждение с открытой стороны, глубина увязана с освещением; может быть с покрытием/остеклением\n- **Терраса** (3.1.34): открытая площадка без остекления, без ограничения по глубине, может иметь покрытие, устраивается на кровле нижерасположенного этажа\n\n### Этаж и его виды (3.1.41–3.1.48)\n- **Этаж жилого МКД** (3.1.41): между отметками верха перекрытия **или пола по грунту** и верха вышерасположенного перекрытия, пространство высотой в чистоте **≥1,8 м**, для размещения жилых/вспомогательных/общего пользования/общественных/технических помещений\n- **...мансардный (мансарда)** (3.1.42): фасад полностью/частично образован наклонной/ломаной/криволинейной крышей, линия пересечения крыши и фасада — на высоте **≤1,5 м** от пола, размещены жилые/вспомогательные/общественные помещения\n- **...надземный** (3.1.43): отметка пола **не ниже** наиболее низкой планировочной отметки земли\n- **...первый** (3.1.44): нижний надземный, доступный для входа с прилегающей территории\n- **...подвальный** (3.1.45): отметка пола ниже планировочной отметки земли **более чем на половину** высоты\n- **...подземный** (3.1.46): отметка пола ниже планировочной отметки земли на **всю высоту** помещений\n- **...технический** (3.1.47): для размещения/обслуживания внутридомовых инженерных систем — может быть внизу, вверху, или между надземными этажами\n- **...цокольный** (3.1.48): отметка пола ниже планировочной отметки земли **не более чем на половину** высоты\n\n⚠️ Разница между подвальным и цокольным — только в одном слове («более» vs «не более» половины высоты) — легко перепутать на слух.\n\n### Подполье, чердак, техпространство (3.1.24–3.1.26, 3.1.32, 3.1.39–3.1.40)\n- **Подполье** (3.1.24): высота в чистоте <1,8 м, между перекрытием 1-го/цокольного этажа и грунтом/полом по грунту/фундаментной плитой\n- **...проветриваемое** (3.1.25): открытое пространство между грунтом и нижним перекрытием 1-го надземного этажа\n- **...техническое** (3.1.26): подполье с трубопроводами/коммуникациями, без оборудования и помещений\n- **Пространство техническое** (3.1.32): между перекрытиями, для трубопроводов/коммуникаций, БЕЗ оборудования, высота <1,8 м; примечание — не считается этажом\n- **Чердак** (3.1.39): между перекрытием верхнего этажа и кровлей, БЕЗ жилых/вспомогательных/общественных/технических помещений и оборудования\n- **...технический** (3.1.40): чердак с трубопроводами/коммуникациями (без оборудования и помещений)\n\n### Помещения — назначение и статус (3.1.5, 3.1.13, 3.1.29–3.1.31, 3.1.35–3.1.38)\n- **Душевая** (3.1.5): с душем/душевой кабиной + раковиной\n- **Клетка лестничная в жилом МКД** (3.1.13): помещение общего пользования с лестничными площадками/маршами для связи между этажами и с выходом наружу\n- **Помещение техническое** (3.1.29): для обслуживания внутридомовых инженерных систем, с доступом служб эксплуатации/безопасности/спасения\n- **Помещения общего пользования** (3.1.30): не части квартир, обслуживают >1 помещения (ЛК, коридоры, лифтовые холлы, вестибюли, колясочные, техпомещения, консьерж, мусоросборные камеры)\n- **Помещения общественного назначения** (3.1.31): для учреждений/предприятий/организаций, не оказывающих вредных воздействий на условия проживания в МКД и жилой застройке\n- **Уборная в жилом МКД** (3.1.36): с унитазом со смывным бачком + умывальником\n- **Туалет** (3.1.35): с унитазом со смывным бачком (без умывальника — отличие от уборной)\n- **Узел лестнично-лифтовой** (3.1.37): помещение ЛК + шахта(ы) лифта, может включать лифтовой холл, ПБЗ для МГН, мусоропровод\n- **Участок приквартирный** (3.1.38): земельный участок, примыкающий к МКД (в т.ч. блокированному), с непосредственным выходом на него из квартиры\n\n### Инженерные термины (3.1.20, 3.1.22–3.1.23, 3.1.33)\n- **Оборудование внутриквартирное** (3.1.20): инженерно-техническое оборудование с индивидуальными вводами/подключениями к внутридомовым системам и индивидуальными приборами учёта, в вспомогательном помещении/нише/ограждающих конструкциях квартиры\n- **Отметка уровня земли планировочная** (3.1.22): геодезическая отметка поверхности земли на границе с отмосткой здания\n- **Остекление панорамное** (3.1.23): светопрозрачные конструкции высотой = высоте помещения в чистоте, шириной = ширине помещения, включая выступающие несущие конструкции (пилоны, балки, ригели)\n- **Системы инженерно-технические внутридомовые** (3.1.33): вводы сетей для подачи коммунальных ресурсов/энергии + оборудование для трансформации/производства/подачи мощностей до внутриквартирного оборудования\n\n### Прочее\n- **Общежитие квартирного типа** (3.1.21): МКД/секция с отдельным входом для временного проживания, размещение — в жилых комнатах квартир\n- **Помещение встроенно-пристроенное** (3.1.28): в габаритах МКД + в объёмах, вынесенных за контур более чем на 1,5 м\n\n## 3. Комнаты и помещения квартир — размеры\n\n### Минимальная площадь квартир (п.5.2, табл.5.1)\n\nПлощади квартир (без учёта площадей балконов, лоджий, террас, холодных кладовых и приквартирных тамбуров) в зависимости от числа жилых комнат:\n\n| Число жилых комнат | 1 | 2 | 3 | 4 | 5 | 6 |\n|---|---|---|---|---|---|---|\n| Минимальная площадь квартиры, м² | 28 | 44 | 56 | 70 | 84 | 103 |\n\nДопускается отклонение от этих значений в соответствии со ст.50 ГрК РФ — с учётом демографических требований, достигнутого уровня обеспеченности населения жилищем и ресурсообеспеченности жилищного строительства.\n\n### Минимальные площади помещений квартиры (п.5.11)\n\nДословно: «Площадь жилых комнат и вспомогательных помещений в квартирах должна быть, м², не менее:»\n- **14** — общей жилой комнаты в однокомнатной квартире\n- **16** — общей жилой комнаты в квартирах с числом жилых комнат две и более\n- **8** — спальни (**10** — на двух человек)\n- **8** — кухни\n- **6** — кухонной зоны в кухне-столовой\n\nВ однокомнатных квартирах допускается проектировать кухни или кухни-ниши площадью не менее **5 м²**.\n\nПлощадь спальни и кухни в мансардном этаже (или этаже с наклонными ограждающими конструкциями) допускается не менее **7 м²** — при условии, что общая жилая комната (гостиная) имеет площадь не менее 16 м².\n\n### Высота потолков (п.5.12)\n\nДословно: «Высота (от пола до потолка) жилых комнат и кухни (кухни-столовой) в климатических подрайонах строительства **IA, IБ, IГ, IД и IVА**, определяемых по СП 131.13330, должна быть не менее **2,7 м**, а в других климатических подрайонах строительства — не менее **2,5 м**».\n\nВысота внутриквартирных коридоров, холлов, передних, на антресоли и под ней — не менее **2,1 м** (определяется условиями безопасности передвижения людей).\n\nВ жилых комнатах и кухнях квартир на этажах с наклонными ограждающими конструкциями или в мансардном этаже — допускается уменьшение высоты потолка относительно нормируемой на площади, не превышающей **50%**.\n\n### Ширина площадок перед лифтами (п.5.13)\n\nДословно: «Ширина площадок перед лифтами должна позволять использование лифта для транспортирования больного на носилках скорой помощи и быть, м, не менее:»\n- **1,5** — перед лифтами грузоподъёмностью 630 кг при ширине кабины 2100 мм\n- **2,1** — перед лифтами грузоподъёмностью 630 кг при глубине кабины 2100 мм\n\nПри двухрядном расположении лифтов ширина лифтового холла должна быть, м, не менее:\n- **1,8** — при установке лифтов с глубиной кабины менее 2100 мм\n- **2,5** — при установке лифтов с глубиной кабины 2100 мм и более\n\n### Смежные пункты про вспомогательные помещения (для контекста, кратко)\n- **П.5.7** — обязательное оборудование: мойка+плита на кухне; в санузле/ванной/кухне — место для стиральной машины (гос./муниципальный фонд)\n- **П.5.8** — лоджии/балконы обязательны в климат.районах III/IV по СП131, для семей с инвалидами, либо при неблагоприятных условиях (шум ≥75 дБ, пыль ≥1,5 мг/м³ и т.д.)\n- **П.5.10** — квартиры и жилые комнаты в подвальных/цокольных этажах многоэтажных домов — **не допускаются** (кроме вспомогательных помещений в частном жилфонде по ТЗ)\n\n## 4. Лифты (п.9.16–9.19, Приложение В)\n\n```mermaid\nflowchart TD\n    A[\"Отметка пола верхнего этажа −<br/>отметка пола вестибюля\"] -->|\"≤ 12 м\"| B[\"Лифты не обязательны\"]\n    A -->|\"> 12 м\"| C[\"Лифты обязательны\"]\n    C --> D[\"Смотрим табл. В.1:<br/>этажность → число, грузоподъёмность,<br/>скорость, макс. площадь квартир\"]\n    D --> E[\"Один лифт — кабина 2100 мм<br/>(для носилок)\"]\n```\n\n**Когда обязательны:** отметка пола верхнего жилого этажа превышает отметку пола вестибюля **более чем на 12 м**.\n\n**Таблица В.1 — минимальное число лифтов:**\n\n| Этажность | Число лифтов | Грузоподъёмность каждого лифта, кг | Скорость, м/с | Наибольшая поэтажная площадь квартир, м² |\n|---|---|---|---|---|\n| До 9 | 1 | 630 или 1000 | 1,0 | 600 |\n| 10–12 | 2 | 400 · 630 или 1000 | 1,0 | 600 |\n| 13–17 | 2 | 400 · 630 или 1000 | 1,0 | 450 |\n| 18–19 | 2 | 400 · 630 или 1000 | 1,6 | 450 |\n| 20–25 | 3 | 400 · 630 или 1000 · 630 или 1000 | 1,6 | 350 |\n| 20–25 | 4 | 400 · 400 · 630 или 1000 · 630 или 1000 | 1,6 | 450 |\n\nКаждое значение в столбце «Грузоподъёмность» — это отдельный лифт (не сумма) — при 4 лифтах это буквально 4 разных лифта с указанной для каждого грузоподъёмностью.\n\nРасчёт по таблице сделан из: 18 м² общей площади квартиры/чел., высота этажа 2,8 м, интервал 81–100 с. При иных параметрах — расчёт по ГОСТ Р 52941, но не меньше значений таблицы.\n\nОдин из лифтов — кабина глубиной/шириной **2100 мм** (для носилок), дверь — под кресло-коляску (по СП59.13330).\n\n⚠️ Не путать с лифтом для пожарных подразделений (СП4.13130, требуется в Ф1.3 при высоте **>50 м** — это уже блок 1).\n\n## 5. Санитарно-эпидемиологические требования (разд.7) — по пунктам\n\n⚠️ Раньше этот раздел был просто списком «куда смотреть» — без реального содержания самой главы 7. Вот она по пунктам.\n\n**П.7.1** — общая рамка: ГОСТ 30494, СанПиН 2.1.3684, СанПиН 1.2.3685.\n\n**П.7.2** — гигиенические нормативы условий проживания — по СанПиН 1.2.3685; параметры микроклимата — по ГОСТ 30494, с учётом климатического района строительства по СП131.13330.\n\n**П.7.3** — защита от шума — по СП51.13330. Допустимые уровни шума, инфразвука и вибрации — по СанПиН 1.2.3685.\n\n**П.7.4** — расчётные параметры воздуха — по СП60.13330. Кратность воздухообмена — табл. 7.1:\n\n| Помещение | Воздухообмен |\n|---|---|\n| Жилые комнаты (спальня, общая жилая комната/гостиная, детская) | По СП60.13330 |\n| Кладовая, бельевая, гардеробная | 0,2 ч⁻¹ |\n| Кухня (кухня-ниша, кухонная зона) с электроплитой | 60 м³/ч |\n| Кухня/кухня-столовая с газовой плитой | 100 м³/ч |\n| Помещение с теплогенератором/водонагревателем на газе (открытая камера сгорания, <50 кВт, h<6м) | 100 м³/ч (доп. +100 м³/ч при газовой плите, +60 м³/ч при электроплите) |\n| Помещение с теплогенератором (закрытая камера сгорания) | 1,0 (кратность) |\n| Ванная, душевая, совмещённый санузел | 50 м³/ч |\n| Уборная, туалет, постирочная | 25 м³/ч |\n| Машинное помещение лифта | По расчёту |\n| Мусоросборная камера | 1,0 (кратность = весь объём помещения) |\n\n**П.7.5** — теплотехнический расчёт ограждающих конструкций: температура внутреннего воздуха отапливаемых помещений — не менее **20°C**, относительная влажность — **50%**.\n\n**П.7.6** — качество воздушной среды определяется с учётом воздухообмена, присутствия людей и эмиссии вредных веществ материалами — по СанПиН 1.2.3685, ГОСТ Р 55654, ГОСТ 30494.\n\n**П.7.7** — тёплый чердак: удаление воздуха через **одну вытяжную шахту на каждую секцию**, высота шахты — по расчёту системы вентиляции (от перекрытия над последним этажом до верха шахты).\n\n**П.7.8** — в наружных стенах подвала/техподполья/холодного чердака без вытяжной вентиляции — продухи общей площадью не менее **1/400** площади пола подполья/подвала, минимум **0,05 м²** каждый, не менее **2 на секцию**, на противоположных стенах (для сквозного проветривания), с жалюзийными решётками. Вентиляция чердачного пространства — через коньковые/карнизные продухи, слуховые окна, площадью не менее **1/300** площади горизонтальной проекции кровли.\n\n**П.7.9** — технические помещения (электрощитовые, слаботочные, насосные станции, тепловые пункты) **нельзя** вентилировать воздухом технического/подвального этажа — только самостоятельные системы приточно-вытяжной вентиляции.\n\n**П.7.10** — продолжительность инсоляции квартир — по **СанПиН 1.2.3685** (не по отменённому СанПиН 2.2.1/2.1.1.1076-01! — см. [[КОНСПЕКТ-ЗАЛП — КЕО и инсоляция (Блок 5)]]).\n\n**П.7.11** — естественное освещение — согласно СП52.13330, СанПиН 1.2.3685, СП367.1325800.\n\n**П.7.12** — естественное освещение **обязательно должны иметь**: жилые комнаты и кухни (кроме кухонь-ниш), помещения общественного назначения, встроенные в МКД — кроме помещений, допустимых в подвальных/подземных этажах по СП118.13330.\n\n**П.7.13** — отношение площади световых проёмов к площади пола: не более **1:5,5** и не менее **1:8** для жилых комнат и кухни; для верхних этажей со световыми проёмами в наклонных ограждающих конструкциях — не менее **1:10** (с учётом характеристик окон и затенения соседними зданиями). Допускается принимать минимальную площадь проёмов по расчёту КЕО (СП52.13330 + СП367.1325800).\n\n**П.7.14** — естественное освещение **НЕ нормируется**:\n- для вспомогательных помещений квартир (**кроме** кухонь и кухонь-столовых)\n- для помещений общего пользования\n\n**П.7.15** — нормируемые показатели естественного/искусственного освещения — по СП52.13330, СанПиН 1.2.3685, ГОСТ 33984.1, ГОСТ Р 56943 — отдельно для помещений с лифтовым оборудованием, этажных площадок перед входом в лифт, площадок перед машинным помещением лифта.\n\n**П.7.16** — освещённость в местах входов в МКД — не менее **6 лк** на горизонтальных поверхностях, не менее **10 лк** на вертикальных (до высоты 2 м от пола).\n\n**П.7.17** — при освещении общих коридоров через световые проёмы в наружных стенах, длина коридора не более:\n- **24 м** — при световом проёме в одном торце\n- **48 м** — при проёмах в двух торцах\n\nПри большей длине — дополнительное освещение через **световые карманы**. Расстояние между двумя карманами — не более **24 м**, между карманом и торцевым проёмом — не более **30 м**. Ширина кармана (может быть лестничная клетка) — не менее **1,5 м**. Через один карман можно освещать коридоры длиной до **12 м** по обе стороны.\n\n**П.7.18** — солнцезащита: в климатрайоне III — жилые комнаты/кухни, в климатрайоне IV — плюс лоджии (сектор горизонта 200°–290°) — обязательны устройства регулируемой солнцезащиты (ГОСТ 33125), не создающие препятствий доступу пожарных подразделений.\n\n**П.7.19** — наружные ограждающие конструкции (контактирующие с наружным воздухом) и заглублённые конструкции стен/пола по грунту должны иметь теплозащиту/пароизоляцию — разница температур внутреннего воздуха и поверхности стен должна соответствовать СП50.13330.\n\n### Размещение помещений друг над другом (п.7.20–7.21) — важный практический блок\n\n**П.7.20** дословно: «Размещение уборной (туалета), ванной комнаты (душевой), совмещённого санузла **над** жилыми комнатами и кухнями (кухнями-нишами и кухнями-столовыми) **не допускается**».\n\nПримечание: над жилыми комнатами также нельзя размещать стиральную машину и другое оборудование с подключением к водопроводу или создающее шум/вибрацию.\n\n**Исключения:**\n- В **двухуровневых** квартирах — можно разместить санузел на верхнем уровне **над кухней**\n- Над вспомогательными помещениями (кроме кухни/кухни-ниши/кухонной зоны) — можно\n\n**П.7.21** — кухня (кухня-ниша, кухонная зона) **над жилыми комнатами не допускается**.\n\n**П.7.22** — при наличии почвенных газов (радон, метан) на участке — меры по изоляции полов/стен подвальных этажей от грунта.\n\n> [!note] Что не стала расписывать подробно (по договорённости)\n> Пункты 7.33–7.37 (мусоропровод, раздельный сбор ТКО, кладовая уборочного инвентаря, требования к встроенным общественным помещениям по шуму/загрязнению воздуха) — это уже скорее координационные детали для смежников (ОВ, эксплуатация), не то, что архитектору нужно держать в голове дословно. Если понадобится — можно развернуть отдельно.\n\n## 6. Энергосбережение (разд.8)\n\nЭнергетический паспорт МКД — фиксирует теплотехнические характеристики и класс энергоэффективности, обновляется по результатам эксплуатации. ПД должна содержать: перечень мероприятий по энергосбережению, обоснование архитектурных/конструктивных/инженерных решений, требования при вводе в эксплуатацию.\n\n## 7. Инженерное оборудование (разд.9) — по пунктам\n\n⚠️ Раньше этот раздел был просто таблицей «куда смотреть». Вот реальное содержание.\n\n**П.9.5–9.6** — установка радиорелейных мачт/башен **запрещена**. Газоснабжение — по СП62.13330, газопотребление — по СП402.1325800.\n\n**П.9.7** — отопление/вентиляция должны обеспечивать оптимальную температуру внутреннего воздуха (по разд.5 СП60.13330) в течение отопительного периода; при кондиционировании — оптимальные параметры должны обеспечиваться и летом.\n\n**П.9.8** — в районах с расчётной температурой **≤ −40°C** — обязательна теплозащита (СП50.13330), включая обогрев пола жилых комнат/кухонь/общественных помещений с постоянным пребыванием людей, если под ними — холодные неотапливаемые подполья/техподполья.\n\n**П.9.9** — вентиляция может быть:\n- с естественным притоком и удалением\n- комбинированная (естественная + механическое побуждение)\n- полностью механическая (если естественная не обеспечивает параметры круглый год)\n- смешанная (частичное использование естественной в подходящие периоды года)\n\nПо заданию допускается рекуперация тепла вытяжного воздуха и кухонные вытяжки со встроенными вентиляторами.\n\n**П.9.10** — приток воздуха в жилых комнатах/кухне при естественной вентиляции — через регулируемые оконные створки/фрамуги/форточки/клапаны или рекуператоры. **Важно:** даже при механической вытяжке приток всё равно нужно обеспечить через оконные/стеновые клапаны — наличие регулируемых створок не отменяет это требование.\n\nВ климатрайонах III/IV — воздухообмен можно обеспечить любым из способов: естественная/механическая/гибридная вентиляция, кондиционирование, **сквозное или угловое проветривание** (для односторонне ориентированных квартир — допустимо через лестничную клетку или другие проветриваемые помещения общего пользования).\n\nИндивидуальное оборудование вентиляции/кондиционирования **нельзя** устанавливать в межквартирных коридорах и холлах.\n\n**П.9.11** — удаление воздуха — из кухонь/уборных/ванных/совмещённых санузлов, с регулируемыми решётками/клапанами на каналах. Кухни-ниши — обязательна механическая вытяжка в здании.\n\n**П.9.12** — воздух с вредными веществами/запахами — удаляется **напрямую наружу**, не должен попадать в другие помещения (в т.ч. через каналы). **Перетоки воздуха между квартирами не допускаются.** Вентканалы кухонь/уборных/ванных/кладовых для продуктов **нельзя объединять** с каналами от газового оборудования и стоянок автомобилей. В двери санузла — переточная решётка или зазор под дверью.\n\n**П.9.13** — вентиляция встроенных общественных помещений — **автономная** (кроме случаев по п.4.20).\n\n**П.9.14** — тёплый чердак: удаление воздуха через вытяжную шахту на каждую секцию, параметры — расчётом по СП60.13330.\n\n**П.9.16–9.19** — лифты (уже разбирали в разделе 4): порог 12 м, табл.В.1, кабина 2100мм для носилок, надстройка 5-этажных зданий — лифты можно не предусматривать, для квартир инвалидов выше 1-го этажа — лифты/подъёмные платформы по СП59.13330 обязательны.\n\n**П.9.20** — в климатрайонах I–III — тамбуры/тамбур-шлюзы у всех наружных входов (кроме входа из воздушной зоны в Н1), с параметрами для доступности МГН по СП59.13330.\n\n**П.9.21** — двойные тамбуры — по этажности и району строительства, табл.9.1 (сама таблица не проверялась дословно).\n\n### Смежные требования по шуму инженерного оборудования (СП51.13330, для контекста)\n\nСмежная тема — инженерные ниши: вот что уже нашлось смежного в СП51 (не СП54!), пригодится для сопоставления:\n- **П.9.20 (СП51)** — скрытая электропроводка в межквартирных стенах — в отдельных для каждой квартиры каналах/штрабах, полости под коробки/розетки — несквозные\n- **П.9.21 (СП51)** — вентблоки — целостность стенок между каналами обязательна; вентотверстия смежных по вертикали квартир сообщаются через сборный/попутный канал **не ближе чем через этаж**\n- **П.9.21а (СП51)** — лифтовая лебёдка — виброизоляция (одно-/двухкаскадная, по расчёту СП413.1325800) для защиты от структурного шума\n- **П.9.21в (СП51)** — при вводе в эксплуатацию — обязательное исследование звукоизоляции ограждающих конструкций (в т.ч. от шума инженерного/сантехнического оборудования)\n\n## 8. Отдельные практические детали\n\n- **Внутриквартирный пожарный кран:** на сети водопровода в каждой квартире — кран Ø≥15мм для шланга с распылителем (первичное пожаротушение), длина шланга — до любой точки квартиры (п.6.2.4.3)\n- **Сауна в квартире:** объём парильни 8–24 м³, нагреватель с автоотключением при 130°C или через 8ч работы, вентканал с противопожарным клапаном, дренчер/сухотруб\n- **Тамбуры при входах:** в климатических районах I–III по СП131.13330 — обязательны тамбуры/тамбур-шлюзы у всех наружных входов (кроме входа из воздушной зоны Н1), с учётом доступности МГН\n- **Колясочные/велосипедные:** по заданию на проектирование, на 1-м этаже, выход допускается в вестибюль\n- **Кладовые твёрдого топлива:** цоколь/1-й этаж, выход прямо наружу, отделение по СП4.13130\n\n## Приложение Б — номенклатура встроенных учреждений\nПолный список см. в [[Пути эвакуации — жилые здания (Ф1.3)]], раздел про встроенные общественные помещения — там уже разобраны разрешённые типы функций и условия сообщения путей.\n\n---\n\n## Связанные заметки\n[[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[Пути эвакуации — жилые здания (Ф1.3)]] · [[Площади здания — термины ТЭП]] · [[Лестницы — ширина марша и высота ограждения]] · [[Инженерные ниши — практическое руководство]] · [[Нормативная база — карта]]\n", "diagrams": ["<svg viewBox=\"0 0 540 445\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans, sans-serif\">\n<defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4A6178\"/></marker></defs>\n<rect x=\"0\" y=\"0\" width=\"540\" height=\"445\" fill=\"#FAFBFC\"/>\n<rect x=\"90\" y=\"15\" width=\"360\" height=\"60\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"270.0\" y=\"41.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"270.0\" dy=\"0\">Отметка пола верхнего этажа − отметка пола</tspan><tspan x=\"270.0\" dy=\"15\">вестибюля</tspan></text><line x1=\"200\" y1=\"75\" x2=\"100\" y2=\"134\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"129.5\" y=\"98.5\" width=\"41.0\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"150.0\" y=\"107.5\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">≤12 м</text><rect x=\"10\" y=\"140\" width=\"200\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"110.0\" y=\"168.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"110.0\" dy=\"0\">Лифты не обязательны</tspan></text><line x1=\"340\" y1=\"75\" x2=\"430\" y2=\"134\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"364.5\" y=\"98.5\" width=\"41.0\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"385.0\" y=\"107.5\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">>12 м</text><rect x=\"320\" y=\"140\" width=\"210\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"425.0\" y=\"168.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"425.0\" dy=\"0\">Лифты обязательны</tspan></text><line x1=\"425\" y1=\"190\" x2=\"425\" y2=\"242\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"280\" y=\"250\" width=\"250\" height=\"65\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"405.0\" y=\"271.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"405.0\" dy=\"0\">Смотрим табл.В.1: этажность →</tspan><tspan x=\"405.0\" dy=\"15\">число, грузоподъёмность, скорость,</tspan><tspan x=\"405.0\" dy=\"15\">макс. площадь квартир</tspan></text><line x1=\"425\" y1=\"315\" x2=\"425\" y2=\"367\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"300\" y=\"375\" width=\"210\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"405.0\" y=\"396.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"405.0\" dy=\"0\">Один лифт — кабина 2100мм (для</tspan><tspan x=\"405.0\" dy=\"15\">носилок)</tspan></text>\n</svg>"]}, {"title": "Площади здания — термины ТЭП", "file": "Площади здания — термины ТЭП", "md": "#нормативка #ТЭП #жилые_здания #общественные_здания #справочник\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]]\n\n---\n\n# Площади здания — термины и правила подсчёта ТЭП\n\nКаждый показатель ниже — это **определение из СП + практика подсчёта + источник**, всё вместе, а не раздельно. Порядок — как в реальной форме ТЭП (сверху вниз, как считаешь на практике).\n\n**Документы:** [[СП 54.13330.2022]] (Прил. А) · [[СП 118.13330.2022]] (Прил. А) · СП 267.1325800 (Прил. А, для высотных) · [[СП 42.13330.2016]] (п.3.32б, табл.5.1) · [[СП 113.13330.2023]] (Прил. А)\n\n> [!important] Почему это вообще важно (не только для собеседования)\n> ТЭП уходят в заключение экспертизы, в договоры с собственниками, в банк — по ним формируется эскроу-счёт и выделяются деньги на строительство. Ошибка в ТЭП — это не абстрактный недочёт, а реальные проблемы с банком и заказчиком. При изменении ТЭП архитектор обязан сообщить в общий чат объекта с отметкой ГИПа, пом. ГИПа и всех ответственных смежников.\n\n⚠️ **Актуальность источника зависит от даты получения ГПЗУ** — версия применяемого СП привязана к моменту получения ГПЗУ, и по указанию ГИПа могут действовать нормы, отличные от текущего перечня нацстандартов.\n\n---\n\n## 1. Площадь земельного участка\nПереписывается из ГПЗУ — не считается, а копируется. Нормативного определения нет — это административная величина.\n\n---\n\n## 2. Площадь застройки\n\n**Жильё (СП54, Прил.А, п.А.1.1), дословно:**\n> «Площадь застройки многоквартирного жилого здания определяется как площадь горизонтального сечения по внешнему контуру здания, на уровне планировочной отметки земли, включая выступающие части (балконы, лоджии, эркеры, козырьки и навесы входных групп, входные площадки и ступени, веранды, террасы, приямки, входы в подвальный этаж, галереи и переходы между зданиями).\n> Площадь под многоквартирным жилым зданием, расположенным на столбах, проезды под зданием, а также выступающие части здания, консольно выступающие за плоскость стены на высоте менее 4,5 м, включаются в площадь застройки.\n> В площадь застройки дополнительно включается выходящая за контур надземной части площадь подземной части здания, которая определяется как площадь горизонтального сечения по внешнему контуру подземных ограждающих конструкций.»\n\n**Общественные здания (СП118, Прил.А, п.А.8)** — то же самое почти дословно, но с ключевым отличием: **«по внешнему обводу... по цоколю»**, а не «на уровне планировочной отметки земли», как в СП54. Проекции консольных выступов **выше** 4,5 м — не включаются (уточнение, добавленное Изм. №3, которого в жилой версии нет явно).\n\n**Практика:** проверить ограничения в ГПЗУ — там может быть отдельное лимитирующее значение. Округление — до 1 знака после запятой.\n\n---\n\n## 3. Площадь здания\n\n**Жильё (СП54, Прил.А, п.А.1.2), дословно:**\n> «Площадь здания (площадь многоквартирного жилого здания) определяют как сумму площадей этажей.\n> Площади подполья, проветриваемого подполья, технического подполья, чердака, технического чердака, внеквартирных инженерных коммуникаций с вертикальной разводкой (в каналах, шахтах), технических пространств в площадь здания не включают.\n> В площадь здания включают площади эксплуатируемой кровли и переходов между зданиями. При наличии переходов между корпусами их площадь делят поровну между корпусами, которые они соединяют.»\n\n**Площадь этажа** (входит в расчёт площади здания, СП54 п.А.1.3), дословно:\n> «Площадь этажа измеряют между внутренними поверхностями наружных стен на высоте от нуля до 1,10 м от уровня пола, при наклонных наружных стенах — на уровне пола (без учёта плинтусов). В площадь этажа включают площади балконов, лоджий, галерей, террас и веранд, внутренних перегородок и стен, а также лестничных площадок и ступеней. Площадь многосветных помещений, пространство между лестничными маршами более ширины марша или 1,5 м, проёмы в перекрытиях, а также лифтовые и другие шахты следует учитывать в пределах одного этажа.»\n\n**Практика:** из площади **НЕ вычитаются** площади под стенами/пилонами/перегородками. Внутренняя отделка стен включается в площадь.\n\n**Общественные здания (СП118, Прил.А, п.А.1)** — здесь другая логика: считается **«общая площадь»**, и она **включает** технические/мансардный/цокольный/подвальный этажи (в отличие от площади здания в жилье, которая их исключает). См. таблицу сравнения в конце заметки.\n\n---\n\n## 4. Площадь в габаритах наружных стен / Суммарная поэтажная площадь (ГНС/СПП)\n**СП42, п.3.32б** — сумма площадей всех наземных этажей **в габаритах наружных стен**, измеряется по наружной границе фасадной отделки. В контуре этажа **ничего не вырезается** (в отличие от площади здания). Проверить ограничение в ГПЗУ.\n\n---\n\n## 5. Общая расчётная площадь планируемых объектов капитального строительства\nДобавляется, только если указана в ГПЗУ; считается **по методике из ГПЗУ/МНГП** (местные нормативы градостроительного проектирования — региональные, не единые для всей РФ).\n\nПример состава (Дальний Восток): общая площадь квартир без летних + общая площадь нежилых помещений общественного назначения + административно-бытовые + МОП + технические помещения + техническое пространство + подземный паркинг.\n\n---\n\n## 6. Строительный объём\n\n**Жильё (СП54, Прил.А, п.А.1.8), дословно:**\n> «Строительный объём многоквартирного жилого здания определяется как сумма строительного объёма выше отметки 0,000 (надземная часть) и ниже этой отметки (подземная часть).\n> Строительный объём определяется в пределах ограничивающих наружных поверхностей с включением ограждающих конструкций, световых фонарей и других надстроек, начиная с отметки чистого пола надземной и подземной частей здания, **без учёта** выступающих архитектурных деталей и конструктивных элементов, козырьков, портиков, балконов, террас, объёма проездов и пространства под зданием на опорах (в чистоте), проветриваемого подполья и подпольных каналов.\n> Строительный объём подземной части определяется до отметки чистого пола нижнего подземного этажа, подвального этажа или технического подполья.»\n\n**Общественные здания (СП118, Прил.А, п.А.7)** — формулировка практически идентична, отличие лишь в измерении подземной части: «до уровня пола последнего подземного этажа» (без отдельного упоминания подвала/техподполья как в жилой версии).\n\n⚠️ **Важное отличие от упрощённого практического расчёта:** дословный текст СП считает объём **без учёта** балконов/террас/козырьков — а не просто «площадь этажа × высота», как упрощённо считается на практике. Приближённый способ (площадь по чистовой фасадной отделке × высота от УЧП до УЧП) даёт близкий результат, но сам норматив описывает объём через ограничивающие поверхности с явными исключениями. При спорных случаях (здание со сложной формой, много выступов) — ориентироваться на дословный текст СП, не на упрощённую формулу.\n\n---\n\n## 7. Этажность и количество этажей\n\n**Жильё (СП54, п.4.1 и контекст приложения А), ключевые правила:**\n- Этажность определяется **отдельно для каждой секции**, если из-за уклона участка меняется число этажей, или если в разных секциях изначально разное число этажей\n- При определении этажности **для расчёта числа лифтов** — технический этаж, расположенный **над верхним этажом, не учитывается**\n- При размещении на участке с уклоном (или фундаменте с перепадом уровней) — планировочная отметка земли и отметка низа фундамента берутся у наружной стены в месте **максимальной разности**\n\n**Общественные здания (СП118, Прил.А, п.А.9), дословно, для сравнения:**\n> «Этажность — количество всех надземных этажей... учитывают: все надземные этажи, в том числе мансардный; цокольный этаж.\n> Количество этажей... учитывают: все надземные этажи, в том числе мансардный; все подземные этажи, а также цокольный этаж.\n> При определении этажности и количества этажей **не учитывают**: подполье для проветривания на вечномерзлых грунтах; техническое подполье, а также междуэтажное пространство и технический чердак высотой менее 1,8 м; отдельные технические надстройки на кровле (выходы на кровлю из ЛК, выезды на кровлю для гаражей, машинные помещения лифтов на кровле, вентканалы и др. техпомещения суммарной площадью менее 15% площади кровли).»\n\n**Практика — запись при разновысотных частях:** объединение в один столбец через тире по возрастанию: например, 18-этажный корпус с одноэтажной пристройкой → **«1–18»**.\n\n---\n\n## 8. Количество квартир\nСумма всех квартир в планировочной ячейке (секция, корпус). Отдельно — разбивка по типам квартир (своя строка на каждый тип).\n\n---\n\n## 9. Площадь квартир — три разных числа\n\n**Площадь квартиры (СП54, Прил.А, п.А.2.1), дословно:**\n> «Площадь квартир определяют как сумму площадей всех отапливаемых помещений (жилых комнат и вспомогательных помещений, предназначенных для удовлетворения бытовых и иных нужд) и антресолей в них (при наличии) без учёта неотапливаемых помещений (лоджий, веранд, холодных кладовых и тамбуров), балконов, террас.»\n\nЭто — **база для минимумов по табл.5.1** (28/44/56/70/84/103 м² — раздел 3 конспекта блока 2). Но для ТЭП используются ещё **два дополнительных** показателя:\n\n| Показатель | Что входит | Источник |\n|---|---|---|\n| **Площадь квартиры** (для min по табл.5.1) | Без летних помещений вообще (см. дословный текст выше) | СП54, Прил.А, п.А.2.1 |\n| Общая площадь квартир **с летними помещениями (с коэфф.)** | Все помещения + летние с понижающим коэффициентом | Для ТЭП |\n| Общая площадь квартир **без коэффициентов** | Все помещения, включая летние, **без** коэффициента | Для ТЭП |\n\n**Коэффициенты для летних помещений (Приказ Минстроя РФ от 25.11.2016 №854/пр):**\n- Лоджии — **0,5**\n- Балконы — **0,3**\n- Террасы — **0,3**\n- Веранды — **1,0**\n\n> [!warning] Четвёртое число — не путать\n> «Общая площадь квартиры» для расчёта числа эвакуационных выходов (СП1.13130, п.6.1.1) — включает летние помещения, но неясно, с коэффициентами или без — это отдельная величина из другого документа, уточнить при необходимости.\n\n---\n\n## 10. Жилая площадь квартир\nПлощадь **комнат** в квартире. По ЖК РФ (гл.2, ст.16): комнатой признаётся часть жилого дома/квартиры, предназначенная для использования как место непосредственного проживания граждан. К жилым комнатам относятся: жилая комната, общая жилая комната (гостиная), спальня, детская комната.\n\n---\n\n## 11. Количество жителей\nПо **СП42, табл.5.1** или местным нормативам градостроительного проектирования (МНГП). Обязательно свериться с ТЗ — если там указаны цифры, проверить их совпадение с МНГП/СП42, не считать ТЗ автоматически приоритетным без сверки.\n\n---\n\n## 12. Нежилые помещения общественного назначения (ПОН)\n\n| Показатель | Определение | Источник |\n|---|---|---|\n| Общая площадь ПОН | Сумма всех продаваемых помещений внутри ПОН | СП118, Прил.А, п.А.4 |\n| Расчётная площадь ПОН | Минус входные тамбуры, проходы, санузлы, ПУИ — от неё считаются сотрудники | СП118, Прил.А, п.А.6 |\n| Количество ПОН | Число планировочных ячеек (всё, что покупается по одному договору = 1 помещение) | — |\n| Количество сотрудников ПОН | Из расчётной площади: если нет указаний в ТЗ — для Ф4.3 принять **6 м²/чел**, для другого конкретного назначения — сверить с СП44 | СП118, п.5.31 · СП44.13330 |\n\n**Расчётная площадь общественного здания (СП118, п.А.6), дословно (для контекста термина выше):**\n> «...сумма площадей входящих в него помещений, за исключением: коридоров, тамбуров, переходов, лестничных клеток, внутренних открытых лестниц и пандусов; лифтовых шахт; помещений и пространств, предназначенных для размещения инженерного оборудования и инженерных сетей. В расчётную площадь не включают пространство под наклонной поверхностью ниже 1,5 м.»\n\n---\n\n## 13. Административно-бытовые помещения (коммерция / МОП)\nУточнить у заказчика принадлежность блока (коммерция или МОП) — **прописать явно в скобках**. Площадь/расчётная площадь/сотрудники считаются теми же методами, что и для ПОН (п.А.4, п.А.6, СП118 п.5.31).\n\n## 14. Места общего пользования (МОП)\n- Площадь МОП — СП54, Прил.А, п.А.1.4\n- Площадь МОП **коммерческой части** считается отдельной строкой, если у коммерции есть свои МОП (например, общий коридор коммерции на 2 этаже, ЛК эвакуации со 2 этажа коммерции)\n\n## 15. Технические помещения и пространства\n- Площадь технических помещений — СП54, Прил.А, п.А.1.4 (сумма по планировочной ячейке)\n- Площадь технического пространства — то же, но помещение высотой **1790 мм и менее**\n\n## 16. Кладовые\nПлощадь — сумма площадей кладовых, **проходы не учитываются**. Количество — считаются и кладовые в блоке, и индивидуальные.\n\n---\n\n## 17. Паркинг — отдельный блок ТЭП\n\n| Показатель | Правило |\n|---|---|\n| Площадь подземного паркинга | С учётом м/мест и технических помещений паркинга (СП54, Прил.А, п.А.1.4) |\n| Площадь технических помещений паркинга | Отдельно — электрощитовая паркинга, венткамеры паркинга и т.п. |\n| Площадь машиномест | Считается спецификацией; минимальный габарит — 2,5×5,3 м (СП113, Прил.А) |\n| Площадь проходов/проездов/ЛК паркинга | Из площади паркинга вычитается площадь машиномест |\n| Количество машино-мест | Машино-место — зона для размещения машин; одно место может включать несколько машин (зависимые «семейные» места) |\n| Количество автостоянок | Считается количество *машин*, включая те, что на одном совмещённом машино-месте |\n\nТип паркинга указывается отдельно: подземный / наземный закрытого типа / подземный открытого типа / обвалованный (термины — [[СП 113.13330.2023]]).\n\n---\n\n## Ключевые термины (справочно)\n\n- **УЧП (уровень чистого пола)** — отметка по чистовой поверхности пола; для объёма/высоты здания/этажа берётся одна общая отметка на этаж\n- **Техническая надстройка** — техническое пространство **на кровле**; этажом не является\n- **Помещения общего пользования** — не части квартир, обслуживают более одного помещения: ЛК, коридоры, лифтовые холлы, вестибюли, колясочные, технические помещения, помещение консьержа, мусоросборные камеры\n\n## Автоматизация подсчёта (2 метода)\n1. **Графический** — отдельные планы в Revit (вкладка ПД → доп. вкладка «ТЭП»), обводки этажей цветовыми областями, сохраняются на всех стадиях\n2. **Спецификация** — сбор показателей через спецификации Revit, отдельные вкладки «ТЭП» с разбивкой по типам\n\n---\n\n## Сопоставление — что общее, что разное между жильём и общественными зданиями\n\n| Понятие | СП54 (жильё) | СП118 (общественные) |\n|---|---|---|\n| «Общая» площадь всего здания | **«площадь здания»** (А.1.2), техподполье/чердак **исключены** | **«общая площадь»** (А.1), технические этажи **включены** |\n| Площадь застройки | по планировочной отметке земли (А.1.1) | по цоколю (А.8) |\n| Полезная/расчётная площадь | таких терминов нет | два отдельных показателя: полезная (А.5), расчётная (А.6) |\n| Этажность — мансардный/цокольный этаж | включается в этажность как обычный этаж | СП118 явно перечисляет: включает мансардный и цокольный, исключает техподполье/надстройки <15% кровли |\n| Строительный объём | сумма надземной+подземной, без выступов/козырьков/балконов (А.1.8) | практически идентичная формулировка (А.7) |\n\n> [!important] Главная ловушка\n> В жилье техпомещения **исключаются** из площади здания, в общественных — **включаются** в общую площадь. Прямо противоположная логика — машинальный перенос из одного документа в другой даёт системную ошибку в ТЭП.\n\n---\n\n## Связанные заметки\n[[СП 54.13330.2022]] · [[СП 118.13330.2022]] · [[СП 42.13330.2016]] · [[СП 113.13330.2023]] · [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]] · [[КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)]] · [[Пожарные отсеки и противопожарные преграды]] · [[Нормативная база — карта]]\n", "diagrams": []}]}, "3": {"name": "МГН (СП59)", "notes": [{"title": "Конспект-залп МГН", "file": "КОНСПЕКТ-ЗАЛП — МГН (Блок 3)", "md": "#нормативка #конспект #МГН #ОДИ\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]]\n\n# КОНСПЕКТ-ЗАЛП · Блок 3: МГН / ОДИ (СП59.13330.2020)\n\n**Документы:** [[СП 59.13330.2020]], в связке с [[СП 1.13130.2020]] (эвакуация МГН), [[СП 54.13330.2022]] (жильё)\n\n---\n\n## Логика: нужна ли пожаробезопасная зона на этаже\n\n```mermaid\nflowchart TD\n    A[\"Доступ МГН группы М4 на этаж\"] -->|\"нет иного пути эвакуации<br/>(пандус/выход наружу)\"| B[\"Нужна ПБЗ — минимум 1 на этаж\"]\n    A -->|\"есть иной путь эвакуации\"| Z[\"ПБЗ не требуется\"]\n    B --> C[\"Площадь = число МГН × 0,96 м²/чел\"]\n    C --> D[\"Конструкция: перегородки 1-го типа,<br/>перекрытия 3-го типа, двери/окна не ниже 2-го\"]\n    D --> E{\"Зона в лифтовом холле?\"}\n    E -->|да| F[\"1 лифт — для пожарных подразделений,<br/>двери EI30-60, подпор в шахте\"]\n    E -->|нет| G[\"Обычная незадымляемая ПБЗ\"]\n```\n\n**Ключевое условие:** ПБЗ обязательна конкретно для группы **М4** (не любой МГН-группы), и только если эвакуация иным способом не обеспечена. Группы М1–М3 могут эвакуироваться по обычным ЛК.\n\n---\n\n## 1. Классификация МГН по группам мобильности (Прил.Б, табл.Б.1)\n\n| Группа | Кто относится | Площадь проекции, м²/чел |\n|---|---|---|\n| **М1** | Люди старшего возраста, дети дошкольного возраста, беременные, глухие/слабослышащие | 0,03–0,2 (зависит от подгруппы) |\n| **М2** | Инвалиды с нарушением зрения, пользующиеся белой тростью | 0,4 |\n| **М3** | Инвалиды с доп. опорами (костыли/трости), на протезах | 0,2–0,3 |\n| **М4** | Инвалиды и другие МГН на креслах-колясках | **0,96** |\n| НМ | Немобильные (не могут передвигаться самостоятельно) | 1,05 |\n| НТ | Нетранспортабельные (транспортировка = угроза жизни) | 1,58 |\n| НО | Люди с ограниченной степенью свободы (в т.ч. психические отклонения) | 0,1 |\n\n⚠️ **Частая ловушка:** нарушение зрения → это **М2**, не М1 (проверено по реальному вопросу аттестации).\n\n**Расчётное число МГН по классу Ф** (СП1.13130, табл.21 / СП59, табл.Б.2): например, Ф1.1 (детсады) — 2% общего числа мест, Ф1.2 (гостиницы) — 3% общей вместимости. Для больниц/спецучреждений/жилья для инвалидов — по заданию на проектирование.\n\nСкорость движения группы М1 при расчёте эвакуации — на **20% меньше**, чем у людей без ограничений мобильности.\n\n---\n\n## 2. Входные группы и двери\n\n- Дверные проёмы, доступные МГН — ширина в свету **не менее 0,9 м**\n- Пороги на путях движения МГН — **не более 14 мм**\n- Доводчик — задержка автоматического закрывания **не менее 5 с**\n- Двери МГН (полный набор): световая ширина ≥900 мм + рукоятки на высоте 0,9–1,1 м + автодвери с задержкой ≥5 с\n- Вход при перепаде 1,2 м — входная площадка **минимум 2,2×2,2 м**\n- На путях движения МГН **нельзя**: непрозрачные калитки на навесных петлях двустороннего действия, калитки с вращающимися полотнами, вращающиеся турникеты\n\n---\n\n## 3. Пандусы\n\n| Случай | Уклон | Условие |\n|---|---|---|\n| Основной путь движения (без ограничений длины) | **не более 1:20** (5%) | — |\n| Ограниченная длина пролёта | **не более 8%** | при длине пролёта ≤6 м, с горизонтальными площадками |\n| Горизонтальные участки/пандусы для эвакуации | максимум 5% | ширина ≥1,2 м при >15 чел. М2/М3 или наличии М4 |\n\nПандус, служащий путём эвакуации со 2-го и выше этажей — обязательно должен иметь выход наружу на прилегающую территорию.\n\n---\n\n## 4. Коридоры, пути движения\n\n- Оптимальное решение: коридор нормативной ширины + расширения в местах разворота (до размеров разворотных площадок) + без порогов на пути движения\n- Радиус свободного пространства для разворота кресла-коляски (в туалетной кабине) — **700 мм**\n- Полотно двери на путях эвакуации — цветовой контраст **не менее 0,7 (70%)** относительно стены\n\n### Ширина эвакуационных выходов с учётом МГН (СП59, п.6.2.21)\n- **≥1,2 м** — если эвакуируется >15 чел. групп М2–М4, или пребывание >5 чел. групп НМ/НТ\n- **≥0,9 м** — при наличии группы М4 в помещении, **кроме зданий класса Ф1.3** (там действует обычная жилая норма)\n\n---\n\n## 5. Санитарные кабины\n\n| Тип | Минимальная площадь/размер |\n|---|---|\n| Универсальная кабина с центральным расположением унитаза | не менее **2,2 × 2,25 м** |\n| Универсальная санитарная кабина в туалетном блоке (общественное здание) | **3,65 м²** |\n| Расстояние у унитаза для кресла-коляски | **800 мм** |\n| Санузел с ванной/унитазом/раковиной (жильё, Прил.7.1.5) | 5,50 м² |\n| Санузел с душевой/унитазом/раковиной | 3,65 м² |\n| Уборная с умывальником | 3,50 м² |\n| Уборная без умывальника | 3,00 м² |\n\n⚠️ Не путать «универсальную кабину с центральным унитазом» (2,2×2,25м) и «универсальную кабину в туалетном блоке» (3,65м²) — разные конфигурации.\n\n---\n\n## 6. Тамбуры (МГН-версия, дополняет общестроительный конспект)\n\nПри прямом движении МГН и ширине тамбура 1,6 м — глубина **2,45 м** (совпадает с общестроительным конспектом — хорошая перекрёстная валидация).\n\n---\n\n## 7. Лифты, доступные МГН\n\n- Кабина — минимум **1,1 × 1,4 м**\n- Кнопки — на высоте **0,85–1,1 м**, с тактильными метками\n- Дверной проём — **≥0,9 м** в свету\n- Платформа подъёмная (альтернатива лифту): свободная площадка перед ней ≥1,6×1,6 м (при капремонте в стеснённых условиях жилья — можно уменьшить до 1,2×1,2 м)\n\n---\n\n## 8. Пожаробезопасные зоны (ПБЗ) — детали\n\n- Обязательна минимум 1 на этаж, если обеспечен доступ МГН группы **М4** и эвакуация иным способом не решена (нет пандуса/выхода прямо наружу)\n- На этажах без доступа М4/НТ, или с выходом прямо наружу — ПБЗ не нужна\n- Группы М1–М3 — эвакуируются по обычным ЛК, для них ПБЗ не требуется\n- **Площадь** — рассчитывается по числу МГН, которые не могут самостоятельно эвакуироваться, исходя из площади проекции по табл.Б.1 (0,96 м²/чел для М4)\n- **Конструкция:** отделяется от других помещений противопожарными **стенами 2-го типа (перегородками 1-го типа)**, перекрытиями **3-го типа**, заполнение проёмов (двери, окна) — не ниже **2-го типа**. Зона должна быть незадымляемой\n- Выход из помещения с ПБЗ **не может вести в квартиру**\n- Для общественных зданий: каждая ПБЗ с выходом на ЛК должна иметь место для приспособлений эвакуации — **не менее 1 носилок + 2 эвакуационных кресла на каждые 10 человек** в зоне\n- **В лифтовом холле:** минимум 1 лифт должен соответствовать требованиям для пожарных подразделений; при группе М4 — также противопожарные двери не ниже **EI30-60** с подпором воздуха в шахтах\n\n---\n\n## 9. Жильё — специфика доступности (СП59, разд.7.1)\n\n- На придомовой территории доступны для МГН: пешеходные пути, стоянки, площадки отдыха/детские/физкультурные\n- Доступность обеспечивается для: лифтового холла/1-го этажа (в домах без лифта), жилых помещений для инвалидов, всех помещений общего пользования, всех входных групп, внутренних лестниц, поэтажных коридоров\n- Подземные стоянки: все этажи доступны для М1 (по заданию), верхний этаж — для М2–М4 (по заданию)\n- Балконы/лоджии в квартирах для колясочников: простенок от наружной стены до ограждения ≥1,4 м; высота ограждения 1,15–1,2 м с прозрачным заполнением; порог двери на балкон ≤14 мм\n\n---\n\n## Открытые вопросы (не проверено дословно)\n- Точный расчёт ширины межквартирного коридора при конкретной площади этажа и числе МГН (встречался в аттестации как задача с расчётом, но конкретную методику не проверяла отдельно)\n- Полная таблица Б.2 (расчётное число МГН по классам Ф) — есть только два примера (Ф1.1, Ф1.2)\n\n---\n\n## Связанные заметки\n[[СП 59.13330.2020]] · [[СП 1.13130.2020]] · [[СП 54.13330.2022]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]] · [[КОНСПЕКТ-ЗАЛП — Общестроительные]] · [[Нормативная база — карта]]\n", "diagrams": ["<svg viewBox=\"0 0 580 715\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans, sans-serif\">\n<defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4A6178\"/></marker></defs>\n<rect x=\"0\" y=\"0\" width=\"580\" height=\"715\" fill=\"#FAFBFC\"/>\n<rect x=\"150\" y=\"15\" width=\"280\" height=\"55\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"290.0\" y=\"46.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"290.0\" dy=\"0\">Доступ ow)\"/><rect x=\"10\" y=\"360\" width=\"260\" height=\"60\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"140.0\" y=\"378.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"140.0\" dy=\"0\">Конструкция: перегородки 1-го типа,</tspan><tspan x=\"140.0\" dy=\"15\">перекрытия 3-го типа, двери/окна не</tspan><tspan x=\"140.0\" dy=\"15\">ниже 2-го</tspan></text><line x1=\"120\" y1=\"420\" x2=\"120\" y2=\"472\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><polygon points=\"130.0,480 240,517.5 130.0,555 20,517.5\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"130.0\" y=\"514.25\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"130.0\" dy=\"0\">Зона в лифтовом</tspan><tspan x=\"130.0\" dy=\"13\">холле?</tspan></text><line x1=\"90\" y1=\"555\" x2=\"30\" y2=\"624\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"49.4\" y=\"583.5\" width=\"21.2\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"60.0\" y=\"592.5\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">да</text><rect x=\"10\" y=\"630\" width=\"260\" height=\"65\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"140.0\" y=\"658.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"140.0\" dy=\"0\">1 лифт для пожарных подразделений,</tspan><tspan x=\"140.0\" dy=\"15\">двери EI30-60, подпор в шахте</tspan></text><line x1=\"180\" y1=\"555\" x2=\"380\" y2=\"624\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"266.1\" y=\"583.5\" width=\"27.799999999999997\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"280.0\" y=\"592.5\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">нет</text><rect x=\"320\" y=\"630\" width=\"220\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"430.0\" y=\"658.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"430.0\" dy=\"0\">Обычная незадымляемая ПБЗ</tspan></text>\n</svg>"]}]}, "4": {"name": "Общественные здания (СП118)", "notes": [{"title": "Конспект-залп Общественные здания", "file": "КОНСПЕКТ-ЗАЛП — Общественные здания (Блок 4)", "md": "#нормативка #конспект #общественные_здания\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]] · [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]] · [[КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)]]\n\n# КОНСПЕКТ-ЗАЛП · Блок 4: Общественные здания (СП118.13330.2022)\n\n**Документ:** [[СП 118.13330.2022]] (с изм. №1–5)\n\n---\n\n## Иерархия размещения помещений — Приложение В\n\n```mermaid\nflowchart TD\n    A[\"Техническое подполье (В.1)\"] --> B[\"1-й подземный/подвальный этаж (В.2)<br/>для ВСЕХ общественных зданий\"]\n    B --> C[\"Цокольный этаж (В.3)<br/>всё из В.2 + доп. функции\"]\n    C --> D[\"Стилобатная часть (В.4)\"]\n\n    A -.-> A1[\"бойлерные, насосные, ИТП,<br/>стоянки, машинные лифтов\"]\n    B -.-> B1[\"вестибюль, гардероб, зальные,<br/>кладовые, магазины, общепит\"]\n    C -.-> C1[\"+ банки, бассейны,<br/>бани сухого жара, столярка\"]\n    D -.-> D1[\"торговля до 3500 м²,<br/>гостиница до 30 номеров\"]\n```\n\n*(та же диаграмма, что была выше в чате — сохранена здесь для Obsidian)*\n\n### Техническое подполье / подземные этажи (В.1)\nБойлерные, насосные, дизель-генераторные, трансформаторные подстанции, венткамеры, машинное отделение лифтов, помещения пожаротушения; стоянки автомобилей (по СП113); помещения безопасности (СП473); хранилища финансово-кредитных организаций; объекты гражданской обороны.\n\n### 1-й подземный или подвальный этаж — для ВСЕХ общественных зданий (В.2)\nВестибюль, гардеробные, уборные, умывальные, душевые, курительные (кроме ДОО/школ); комнаты персонала; зальные помещения (кроме детских образовательных); книгохранилища, архивы; кладовые (по СП4.13130); разгрузочные/экспедиция; инженерно-техническое обеспечение; магазины (кроме ЛВЖ/горючих — те по СП4.13130); общепит; салоны быт.обслуживания; спортивные без трибун; выставочные залы до 300 посетителей; репетиционные до 100 чел/отсек.\n\n### Цокольный этаж (В.3)\nВсё, что можно в подвале, **плюс**: административные/служебно-бытовые для персонала; операционные/кассовые залы банков, обменники, банкоматы; бассейны для плавания; бани сухого жара; столярная мастерская.\n\n> [!note] Особое послабление\n> Если пол цоколя ниже отметки тротуара/отмостки **не более чем на 0,5 м** — допускается размещать **всё**, кроме помещений для детей в ДОО, учебных помещений для детей, жилых помещений гостиниц.\n\n### Стилобатная часть (В.4)\nПомещения, допустимые к встраиванию в жилые здания (по СП54); торговля продовольственная/непродовольственная до **3500 м²** каждая; предприятия питания (в т.ч. с антресолями); универсальные спортзалы без трибун (с учётом акустики по СП51); библиотеки/музеи/выставочные залы без складов; **гостиницы до 30 номеров**; залы краткосрочной аренды 75–200 м².\n\n---\n\n## Определения (отличия от жилья)\n\n- **Лоджия (общественное здание):** вспомогательное неотапливаемое помещение со стенами с трёх сторон (или двух — при угловом расположении) на всю высоту этажа, глубина увязана с освещением примыкающего помещения — **то же определение, что в жилье**, просто отдельно прописано для общественных зданий\n- **Нежилые помещения с гибким функциональным назначением** — универсальные общественные помещения в структуре МКД без предустановленного деления, с возможностью переустройства без изменения несущих конструкций\n- **Здание общественное «зелёное»** — отдельная категория с требованиями энергоэффективности/экологичности (введено Изм. №3)\n\n---\n\n## Высота помещений\n\n- Основные помещения — по заданию (общее правило не процитировано полностью)\n- **2,4 м** — в коридорах (кроме рекреаций образовательных организаций) и холлах для посетителей, в помещениях без постоянного пребывания людей\n- **2,2 м** — в коридорах и помещениях вспомогательного назначения\n- При реконструкции/капремонте допустима существующая высота, но не менее: помещения — **2,4 м**, коридоры/холлы — **2,0 м**\n\n---\n\n## Входы и вестибюли\n\n- Отметка площадки перед входом — выше отметки тротуара **не менее чем на 0,15 м**\n- Тамбуры или воздушно-тепловые завесы (СП60.13330) — обязательны при всех наружных входах\n- **Двойные тамбуры** — обязательны в климатических подрайонах IА/IБ/IГ по СП131.13330 (совпадает с аналогичным правилом для жилья)\n- Минимум **1 вход, доступный МГН**, обязателен в любом общественном здании/изолированном блоке\n- Площадь вестибюля — **0,2–0,3 м²/посетителя**; гардероба — **0,15 м²/посетителя**, но не менее **18 м²** суммарно\n- Гардероб: глубина вешалки за барьером ≤6 м, проход между барьером и вешалкой ≥1 м\n\n---\n\n## Лифты\n\n- Расстояние от двери наиболее удалённого помещения с постоянным пребыванием людей до ближайшего пассажирского лифта — **не более 60 м**\n- Ширина лифтового холла (однорядное расположение) — от **2,0 м** (при глубине кабины ≤1,5 м) и больше при более глубоких кабинах\n- В организациях со стационаром — минимум у одного лифта размеры кабины/проёма должны позволять транспортировку на носилках\n- В ДОО/школах допускается один лифт без учёта требований по расстоянию; в двухэтажных зданиях образовательных организаций — можно подъёмную платформу в объёме ЛК вместо лифта\n\n---\n\n## Зрительные залы (специализированная тема)\n\n- Ширина дверных проёмов в зал — **1,2–2,4 м**; ширина кулуаров — **не менее 2,4 м**; двери в ложи — от 0,8 м\n- Двери из зала — самозакрывающиеся с уплотнёнными притворами\n- Число мест непрерывно в ряду: **≤26** при одностороннем выходе из ряда, **≤50** при двустороннем\n- Ширина прохода между рядами — не менее 0,45 м (по глубине кресел)\n\n### Площадь зала на 1 место (табл. 5.2)\n| Тип зала | м²/место |\n|---|---|\n| Актовый зал (дети) | 0,65 |\n| Актовый зал (взрослые) | 0,8 |\n| Универсальный зал | 0,7 |\n| Конференц-зал <150 мест, с пюпитрами / без | 1,25 / 1,1 |\n| Конференц-зал ≥150 мест, с пюпитрами / без | 1,1 / 1,0 |\n\n### Объём зала на 1 место, м³\nДрамтеатры 4–5, кинотеатры 4–6, клубы 4–7, муз.-драм. театры 5–7, опера/балет 6–8, аудитории 4–5.\n\n### Время эвакуации из зала (СП1.13130, табл.9)\nНормируется для класса С0; для С1 — значения уменьшить на **30%**, для С2/С3 — на **50%**. При объёме зала >60000 м³ — расчёт по отдельной формуле.\n\n⚠️ **Ограждение путей эвакуации в общественных зданиях** — порог замены 0,9→1,2м при просвете между маршами **>0,3 м** (не 0,12 м, как в жилье — см. [[Лестницы — ширина марша и высота ограждения]]).\n\n---\n\n## Специализированные площади (справочно)\n\n- Палата для взрослых в стационаре/изоляторе — не менее **12 м²**\n- Медицинский кабинет в общественном здании — не менее **12 м²**\n- Помещение для религиозных обрядов — не менее **12 м²**\n- Читальный зал библиотеки: **2,4 м²/место** (обычные столы) или **4,5 м²/место** (с ПЭВМ)\n- Хранение библиотечных фондов: 2,5 м²/1000 ед. (стационарные стеллажи) или 1,5 м²/1000 ед. (передвижные)\n\n---\n\n## Открытые вопросы (не проверено дословно)\n- Базовая (не сниженная) высота основных помещений общественных зданий — не нашла точного значения\n- Полная таблица 9 СП1.13130 (время эвакуации из залов) — знаем принцип корректировки по классам, не саму таблицу\n- Полная ширина лифтового холла для двухрядного расположения и кабин большей глубины\n\n---\n\n## Связанные заметки\n[[СП 118.13330.2022]] · [[СП 1.13130.2020]] · [[СП 59.13330.2020]] · [[СП 54.13330.2022]] · [[Лестницы — ширина марша и высота ограждения]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[Нормативная база — карта]]\n", "diagrams": ["<svg viewBox=\"0 0 640 340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans, sans-serif\">\n<defs <rect x=\"20\" y=\"185\" width=\"330\" height=\"55\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"185.0\" y=\"216.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"185.0\" dy=\"0\">Цокольный этаж (В.3) всё из В.2 + доп. функции</tspan></text><line x1=\"350\" y1=\"212\" x2=\"400\" y2=\"212\" stroke=\"#4A6178\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\" marker-end=\"url(#arrow)\"/><rect x=\"400\" y=\"185\" width=\"220\" height=\"55\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"510.0\" y=\"208.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"510.0\" dy=\"0\">+ банки, бассейны, бани сухого</tspan><tspan x=\"510.0\" dy=\"15\">жара, столярка</tspan></text><rect x=\"20\" y=\"270\" width=\"330\" height=\"55\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"185.0\" y=\"301.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"185.0\" dy=\"0\">Стилобатная часть (В.4)</tspan></text><line x1=\"350\" y1=\"297\" x2=\"400\" y2=\"297\" stroke=\"#4A6178\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\" marker-end=\"url(#arrow)\"/><rect x=\"400\" y=\"270\" width=\"220\" height=\"55\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"510.0\" y=\"293.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"510.0\" dy=\"0\">торговля до 3500 м², гостиница</tspan><tspan x=\"510.0\" dy=\"15\">до 30 номеров</tspan></text><line x1=\"185\" y1=\"70\" x2=\"185\" y2=\"92\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"185\" y1=\"155\" x2=\"185\" y2=\"177\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"185\" y1=\"240\" x2=\"185\" y2=\"262\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/>\n</svg>"]}]}, "5": {"name": "КЕО и инсоляция", "notes": [{"title": "Конспект-залп КЕО и инсоляция", "file": "КОНСПЕКТ-ЗАЛП — КЕО и инсоляция (Блок 5)", "md": "#нормативка #конспект #КЕО #инсоляция\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)]]\n\n# КОНСПЕКТ-ЗАЛП · Блок 5: КЕО и инсоляция (СП52.13330 / СП367.1325800)\n\n**Документы:** [[СП 52.13330.2016]] (базовые нормы КЕО, актуал. ред. СНиП 23-05-95*) · [[СП 367.1325800.2017]] (методика расчёта для жилых/общественных) · **ГОСТ Р 57795-2017** «Здания и сооружения. Методы расчёта продолжительности инсоляции» (методика расчёта инсоляции — подтверждён реальным чтением документа) · СП 23-102-2003 «Естественное освещение жилых и общественных зданий» (методика формул КЕО Б.1–Б.10 — упоминается в рабочих расчётах, сам документ дословно не читался, номера пунктов не проверены)\n\n⚠️ **Известная проблема источников (подтверждена повторно):** и в СП367, и в ряде рабочих материалов значения инсоляции и часть значений КЕО ссылаются на СанПиН 2.2.1/2.1.1.1076-01 и СанПиН 2.2.1/2.1.1.1278 — первый из них **официально отменён с 01.03.2021** (см. [[Пути эвакуации — жилые здания (Ф1.3)]] и [[Нормативная база — карта]]), актуальный источник — **СанПиН 1.2.3685-21** (табл. 5.58–5.60 — инсоляция; табл. 5.52 — КЕО). Это подтверждено дважды независимо, включая реальные проектные расчёты (см. раздел «Реальные примеры» ниже).\n\n---\n\n## Базовые определения\n\n- **КЕО (коэффициент естественной освещённости)** — отношение освещённости в точке внутри помещения к освещённости на открытой горизонтальной площадке снаружи, выраженное в процентах. Проще говоря — доля естественного света внутри относительно света под открытым небом. Это относительная величина — не зависит от времени суток/сезона/погоды, чем и отличается от освещённости в люксах\n- **Геометрический КЕО, ε** — часть КЕО, учитывающая только геометрию проникновения света (без светопропускания стекла, отражающих свойств помещения, загрязнения) — то, что считается по графикам Данилюка\n- **Инсоляция** — прямое солнечное облучение поверхностей и пространств (п.3.9 ГОСТ Р 57795-2017; не путать с КЕО — это про рассеянный свет неба, а не про прямое солнце)\n- **Непрерывная продолжительность инсоляции** — интервал, в течение которого инсоляция не прерывается (допускается 10-минутная прерывистость; при нескольких окнах разной ориентации считается **по каждому окну отдельно**, не суммарно)\n- **Расчётная точка (инсоляция)** — точка на пересечении теневых углов светового проёма (п.3.18 ГОСТ Р 57795-2017)\n- **Теневой угол** (горизонтальный/вертикальный) — угол, в пределах которого расчётная точка затенена противостоящим объектом (горизонтальный — на плане, вертикальный — на разрезе)\n- **Световой (инсоляционный) угол проёма** — углы, в пределах которых через проём в принципе может проникать прямой свет (с учётом балкона/лоджии/откоса)\n- **Инсоляционный график** — проекция траекторий солнца для заданной широты и периода, накладывается на план/разрез — практический инструмент, аналогичный по логике графикам Данилюка, но для другой величины\n- **Инсоляционная линейка (ИЛ)** — заранее построенный для конкретной географической широты инсоляционный график в виде готового шаблона/линейки\n\n> [!important] Практическое правило по инсоляционной линейке\n> Линейка для конкретного города/широты — это отдельно калиброванный инструмент (например, заказанный через СРО у специализированной организации), **не то, что чертится самостоятельно каждый раз заново**. На практике линейку предоставляет заказчик/застройщик/руководитель — искать или строить её самой не нужно.\n\n⚠️ КЕО и инсоляция — **разные требования**, хотя обе завязаны на одно и то же окно. КЕО обязателен при любой погоде (рассеянный свет неба), инсоляция — конкретно про прямое солнце в заданный календарный период. Здание может пройти по КЕО и не пройти по инсоляции (плотная застройка рассеивает достаточно света, но перекрывает прямые лучи в нужные часы) — и наоборот.\n\n---\n\n## Требуемая продолжительность инсоляции — географическая зависимость\n\nПодтверждённые практикой примеры (столбчатый график сравнения показан в чате):\n- **Краснодар (45°с.ш., южная зона), инсолируется 1 помещение:** непрерывная — 1,5 ч, прерывистая — 2 ч\n- **Санкт-Петербург (59°с.ш.), инсолируется 1 помещение:** непрерывная — 2,5 ч, прерывистая — 3 ч\n- **Санкт-Петербург, инсолируется 2 помещения:** непрерывная — 2 ч, прерывистая — 2,5 ч\n\n**Логика:** чем севернее — тем дольше требуемая инсоляция. Число комнат, которые должны быть инсолированы, зависит от общего числа жилых помещений в квартире (аналогично правилу для расчётной точки КЕО ниже — принцип «один на маленькую квартиру, больше на большую» повторяется в обеих темах).\n\n**Правила самого расчёта (ГОСТ Р 57795-2017, раздел 5–6):**\n- Из расчёта **исключается первый и последний час** светового дня (для широт севернее 58° с.ш. — **полтора часа**)\n- Допустимая погрешность метода — **не более ±10 минут**\n- **Инсоляция территорий** (детские игровые/спортивные площадки) — не менее **2,5 часов на 50% площади участка** (табл.5.60 СанПиН 1.2.3685-21), расчётная точка — в центре инсолируемой половины участка\n- Расчёт ведут для **самых критичных (нижних) этажей** — если инсолируются 1–2 этаж, вышестоящие этажи инсолируются тем более (но не абсолютное правило — при сложном рельефе/застройке может быть исключение)\n\n> [!note] Практический приём — расчёт по кругу\n> Удобно вести поквартирный расчёт **по часовой стрелке от лестничной клетки** — это не нормативное требование, а личный приём для системности, чтобы не пропустить ни одну квартиру на этаже.\n\n---\n\n## Последовательность расчёта инсоляции — пошагово (на примере Томск, ул. Енисейская)\n\n1. **По табл.5.58 СанПиН 1.2.3685-21** определить зону по широте, период и продолжительность → Томск (центральная зона, 58°–48°с.ш.) → период **22.04–22.08**, не менее **2 часов**\n2. **Определить критичные этажи** — расчёт ведут для самых нижних (обычно 2-й этаж — 1-й часто нежилой/технический), с учётом уже построенных соседних объектов\n3. **Идти по каждой квартире** (по часовой стрелке от ЛК), считать инсоляцию только для жилых комнат — не менее 1 комнаты для 1–3-комнатных квартир, не менее 2 — для 4-комнатных и более\n4. **Определить светопроём** конкретной комнаты — окно, балконный блок с балконом/лоджией (они по-разному экранируют лучи)\n5. **Найти расчётную точку** — на пересечении теневых углов проёма; построить теневые углы: горизонтальные (левый/правый) — на плане, вертикальный — на разрезе\n6. **Совместить инсоляционную линейку** (для широты Томска) с расчётной точкой на плане квартиры, совместив направление на север; определить время начала и конца инсоляции по горизонтальному теневому углу\n7. **Скорректировать результат**: не учитывать первый и последний час у восхода/заката (для широт севернее 58° — полтора часа); учесть погрешность метода ±10 минут\n8. **Внести в таблицу** результатов (№ квартиры, секция, этаж, время инсоляции, продолжительность) — например, квартира 1.2.1: время 7:58–11:26 → **3ч 28мин**\n9. **Сформулировать вывод по всему дому/секции** — обеспечена ли нормативная продолжительность на весь календарный период\n\nРезультат по всем секциям 1–4: нормативная продолжительность обеспечена, включая граничный случай (кв. 4.2.6 — ровно 2ч00мин).\n\n---\n\n## Предпроектный анализ по кварталу — то, чего нет в поквартирном «учебном» порядке\n\nРеальная практика на стадии предпроекта — это не расчёт одной-двух показательных квартир, а **анализ-отчёт по всему кварталу целиком**, с дополнительными шагами, которых нет в базовой последовательности выше:\n\n1. **Собрать все исходные данные окружающей застройки** — ПЗУ/АР соседних участков (в реальном отчёте по проекту в Перми — порядка 20 конкретных исходных документов по адресам вокруг участка)\n2. **Провести анализ в два этапа**: (а) с учётом затеняющих зданий окружающей застройки, (б) без их учёта — это разделяет эффект «мешает соседняя застройка» от эффекта «мешает планировка самой квартиры»\n3. **Пройти по ВСЕМ секциям и квартирам** проектируемого дома целиком (не выборочно несколько критичных, а весь дом), с указанием конкретных этажей, где не хватает инсоляции, и на сколько именно минут/часов не хватает\n4. **Отдельно проверить придомовые площадки** (детские/спортивные — норма 2,5ч на 50% площади)\n5. **Обратная проверка** — как ПРОЕКТИРУЕМЫЙ объект влияет на инсоляцию УЖЕ существующей окружающей застройки (соседние жилые дома, детсад, школа), тоже в два этапа (с учётом/без учёта нового корпуса) — чтобы отделить «эти квартиры соседей не инсолируются из-за нашего нового здания» от «эти квартиры и так были на грани ещё до нашего проекта»\n\n**Реальные формулировки вывода:** «Квартира... имеет недостаточное время инсоляции на этажах 2 и 3 (не хватает 40 минут и 2 минуты непрерывной инсоляции соответственно)» / «Затеняются две квартиры на 2-3 этажах [адрес соседнего дома] — не хватает 39 минут инсоляции. При расчёте без учёта проектируемых корпусов инсоляция данных квартир достаточна» — то есть прямое текстовое подтверждение, что именно новый корпус создаёт затенение конкретных соседних квартир.\n\n⚠️ Шаг 5 (проверка влияния на существующую застройку) — это отдельный крупный блок анализа, которого нет в стандартной поквартирной методичке. Стоит держать в голове как отдельный вопрос, если спросят про инсоляцию именно на стадии предпроекта/градсовета, а не про конкретный расчёт одной квартиры.\n\n---\n\n## Расчётная точка КЕО\n\n> [!important] Два документа — два разных вопроса\n> **СанПиН 1.2.3685-21** отвечает на «сколько нужно» (нормируемые значения). **ГОСТ Р 57795-2017** отвечает на «как считать» (геометрический метод). Для КЕО аналогично: нормируемые значения — СП52 (прил.Л), методика графиков Данилюка — СП23-102-2003. Разделение полезно проговорить на защите явно, а не смешивать в одну ссылку.\n\n**Общее правило (СП52, п.5.3):** при двусторонн
