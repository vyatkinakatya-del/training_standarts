Блок 9)]])\n- Описание/обоснование наружного противопожарного водоснабжения, проездов/подъездов для пожарной техники\n- Обоснование конструктивных/объёмно-планировочных решений, **степени огнестойкости и класса конструктивной пожарной опасности** (см. [[Огнестойкость]], [[Класс конструктивной пожарной опасности]])\n- Обоснование решений по безопасности людей при пожаре\n- Мероприятия по безопасности подразделений пожарной охраны при тушении\n- Сведения о категориях зданий/помещений/оборудования по взрывопожарной и пожарной опасности\n- Перечень зданий/помещений, подлежащих защите автоматическими установками пожаротушения и пожарной сигнализацией\n- Описание противопожарной защиты (АУПТ, сигнализация, СОУЭ, внутренний противопожарный водопровод, противодымная защита)\n- Расчёт пожарных рисков (**не требуется**, если выполнены все обязательные требования техрегламентов)\n\nГрафическая часть: ситуационный план с подъездами пожарной техники и гидрантами, **схемы эвакуации людей**, структурные схемы систем противопожарной защиты.\n\n---\n\n## Раздел 11 «Мероприятия по обеспечению доступа инвалидов» (ОДИ) — детально\n\nТекстовая часть:\n- Перечень мероприятий по обеспечению доступа МГН\n- Обоснование конструктивных/объёмно-планировочных решений, обеспечивающих безопасное перемещение МГН **и их эвакуацию** при пожаре/ЧС\n- Описание решений по обустройству рабочих мест инвалидов (при необходимости)\n\nГрафическая часть: схема ПЗУ (или фрагмент) с путями перемещения МГН; **поэтажные планы с путями перемещения и путями эвакуации МГН**.\n\n→ Пересекается с [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]] почти полностью — раздел ОДИ в ПД буквально документирует то, что мы разбирали в блоке 3.\n\n---\n\n## Раздел 10 «Требования к безопасной эксплуатации» — кратко\n\n- Требования к способам техобслуживания (чтобы не нарушалась безопасность конструкций/инженерных систем)\n- Минимальная периодичность проверок/осмотров/освидетельствований конструкций и систем\n- Предельные эксплуатационные нагрузки, которые нельзя превышать\n- Организационно-технические мероприятия по ПБ в процессе эксплуатации\n- Сроки эксплуатации здания и условия их продления\n\n---\n\n## Общее требование ко всем разделам (п.5)\n\nРазделы ПД разрабатываются в объёме, обеспечивающем соблюдение: требований техрегламентов (мех./пожарная/иная безопасность, энергоэффективность, доступность МГН — для соцкультбыта/жилья/торговли/транспорта), санитарно-эпидемиологических требований, требований к процессам строительства/эксплуатации, ТУ подключения к сетям, и — обязательно — **задания застройщика/técзаказчика на проектирование**.\n\n---\n\n## Связь с реальным рабочим процессом\n\nПолный разбор реального рабочего процесса (BPMN-схема) — в отдельной заметке: [[Операционный процесс — от установочной сессии до ПД]]. Практические детали оформления (стадии, изменения в РД, ГПЗУ, авторский надзор) — в [[Организация проектирования — стадии и оформление]].\n\nСудя по операционной схеме (её ты присылала) — весь долгий путь «установочная сессия → моделирование → проверка концепции → согласования → ТЭП → стадия ПД» это и есть процесс **производства раздела 3 (АР)**, с параллельной подготовкой материалов для разделов 9 (ПБ) и 11 (ОДИ), которые в схеме прямо названы («Планировки для ПБ», «Оформление комплекта ОДИ»). Отдельные шаги «Расчёт инсоляции», «Расчёт ЭЭ», «Расчёт Звук» — это те самые расчётные обоснования, которые в итоге попадают в пояснительную записку и графическую часть раздела АР, подтверждая соответствие смежным нормам (СанПиН/СП50/СП51 — блоки 5–7).\n\n---\n\n## Связанные заметки\n[[123-ФЗ]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]] · [[КОНСПЕКТ-ЗАЛП — Градостроительство (Блок 9)]] · [[Нормативная база — карта]]\n", "diagrams": []}, {"title": "Организация проектирования — стадии и оформление", "file": "Организация проектирования — стадии и оформление", "md": "#нормативка #ПД #РД #организация_проектирования #справочник\n\n← [[КОНСПЕКТ-ЗАЛП — Постановление №87 (состав ПД)]] · [[Операционный процесс — от установочной сессии до ПД]] · [[Нормативная база — карта]]\n\n# Организация проектирования — стадии, оформление, статус\n\nНе про термины конкретного СП, а про то, как устроен сам процесс проектирования: стадии, состав документации, оформление изменений, статус документов.\n\n---\n\n## Стадии и состав документации\n\n- **Основание для разработки РД** — положительное заключение экспертизы по разделу ПД. Раздел ПД **без** такого заключения — НЕ основание для РД\n- **Задания смежникам для отработки инженерных отверстий** — запрашиваются у ВК, ОВ, СС, ЭОМ\n- **Состав работы специалиста на стадии П** (по Постановлению №87): объёмно-планировочные и архитектурные решения + мероприятия по обеспечению доступа инвалидов\n- **Объём работы на стадии Р**: кладочные планы, отделочные планы, фасады, разрезы\n- **ТХ** — марка комплекта «Технологические решения»\n- **Нормативный документ для состава проекта стадии П** — Постановление Правительства РФ №87 от 16.02.2008 (ред. 21.10.2025)\n- **ТЭП в разделе 3 (АР)** — НЕ обязательны, в Постановлении №87 нет прямого указания на их включение туда\n\n## Оформление чертежей\n\n- **Буквы, недопустимые для координационных осей**: Е, З, Й, О, Х, Ц, Ч, Щ, Ъ, Ы, Ь\n- **Порядок листов**: обложка → титульный лист → общие данные\n- **Оси на фасадах** — указываются крайние оси, между которыми расположен фасад\n- **Номер разрешения для листа изменений РНИ** — запрашивается у ГИПа\n\n## Изменения в документации\n\n- **Что считается изменением ПД/РД**: любое исправление, исключение или добавление данных в ранее выданный заказчику документ **без изменения его обозначения**\n- **Порядок оформления изменения в РД**:\n  1. Когда: комплект уже выдан в производство работ / обнаружена ошибка / запросил заказчик\n  2. У кого запросить номер изменения: у ГИПа\n  3. Как оформить: таблица на титульном листе + лист регистрации изменений + отметка на самом листе (изм / зам / анн)\n- **Код изменения «3» по ГОСТ Р 21.101** — дополнительные требования заказчика\n\n## Смежные разделы и документы\n\n- **Данные АР для сметной документации**: ведомость объёма работ\n- **Данные, необходимые от заказчика на старте проекта** (стадия П, МКД): ТЗ, ГПЗУ, стандарты (при наличии), концепция, мастер-план, планы БТИ окружающей застройки, наличие/содержание СТУ, решения фасадов (если отсутствуют в концепции), Revit-модель (при наличии) — совпадает с [[Операционный процесс — от установочной сессии до ПД]]\n\n## Термины и понятия\n\n- **Анфилада** — ряд последовательно примыкающих друг к другу помещений\n- **Жилой квартал** — часть территории населённого пункта, ограниченная красными линиями улиц/проездов/пешеходных аллей, предназначенная для жилой застройки\n- **Отметка абсолютная** — отметка по выбранной системе координат (напр. МСК); с ней больше работают специалисты ГП\n- **Отметка относительная** — отметка элемента, отсчитанная от заданной отметки нуля (отметка нуля соотносится с абсолютной)\n- **Авторский надзор** — контроль лица, подготовившего ПД, за соблюдением требований ПД в процессе строительства (по 123-ФЗ)\n- **«Архитектурный проект»** — архитектурная часть документации для строительства и градостроительной документации\n\n## ГПЗУ и версия нормативной базы\n\n- **Что такое ГПЗУ**: градостроительный план земельного участка — ограничения и параметры землепользования\n- **Что проверять архитектору в ГПЗУ**: возможна предельная высота/площадь в ГНС, ограничение по функциональному использованию\n- **Как влияет ГПЗУ на выбор редакции СП**: ГПЗУ действует **3 года**; редакция нормативных документов принимается на первую или вторую половину срока действия ГПЗУ — в зависимости от даты захода в экспертизу\n\n## ТЭП — что НЕ входит в состав показателей\n**Класс энергетической эффективности** — не относится к технико-экономическим показателям проектируемых объектов (в отличие от площадей/объёмов/этажности, которые ТЭП)\n\n## Разрешительная документация\n\n- **Основание для начала СМР** заказчиком — разрешение на строительство\n- **ГОСТ, устанавливающий требования к текстовым частям разделов ПД** — ГОСТ Р 21.101 «Единая система конструкторской документации. Общие требования к текстовым документам»\n- **Если для ПД требуется отступление от норм** — проектирование и строительство ведётся в соответствии со **специальными техническими условиями (СТУ)**\n\n## Особые категории объектов (уровень «Ведущий»)\n\n- **Не относится к особо опасным технически сложным** — объекты высотой >100 м для ветроэнергетических установок >250 м (то есть сама ветроустановка исключение, а не общее правило высоты)\n- **Научно-техническое сопровождение** обязательно — для зданий/сооружений класса **КС-3**\n- **Критический дефект** (при СМР) — дефект, при котором здание/сооружение/его части функционально непригодны, дальнейшее ведение работ по условиям прочности/устойчивости небезопасно, либо может привести к снижению этих характеристик при эксплуатации\n- **Повторное утверждение ПД** после изменений при строительстве/реконструкции/капремонте — застройщиком **или** техническим заказчиком\n- **Авторский надзор в обязательном порядке** — для объектов культурного наследия\n- **Архитектурная деятельность** (по смыслу) — профессиональная деятельность архитекторов, имеющая целью создание архитектурного объекта\n\n---\n\n## Связанные заметки\n[[КОНСПЕКТ-ЗАЛП — Постановление №87 (состав ПД)]] · [[Операционный процесс — от установочной сессии до ПД]] · [[Площади здания — термины ТЭП]] · [[Нормативная база — карта]]\n", "diagrams": []}]}, "12": {"name": "Инженерные ниши", "notes": [{"title": "Инженерные ниши — практическое руководство", "file": "Инженерные ниши — практическое руководство", "md": "#нормативка #инженерные_ниши #жилые_здания #справочник\n\n← [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]] · [[Нормативная база — карта]]\n\n# Инженерные ниши — практическое руководство (АР_ПД: Ниши ИОС)\n\nЭто не нормативный текст СП, а рабочая практика проектирования — числа и правила размещения ниш, которые архитектор закладывает в планировку, координируясь со смежниками (ВК, ОВ, ЭОМ/СС).\n\n**Смежные нормативные заметки:** [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]] (разд.9 — инженерное оборудование) · [[Пожарные отсеки и противопожарные преграды]] (тамбур-шлюзы)\n\n---\n\n## Два типа ниш\n\n1. **Общедомовые** — обслуживают помещения МОП / группу целевых помещений (например, несколько квартир)\n2. **Внутри ячейки** — обслуживают одну планировочную ячейку (квартира, ПОН, групповая в ДОО)\n\n---\n\n## 1. Водоснабжение и канализация\n\n### Выпуск канализации\nТруба выводится из здания в пространстве подземного этажа (поворачивает под плитой 1-го этажа) к уличной сети. Сети идут по МОП — при планировке подземного этажа нужно оставить проход к наружным стенам:\n1. Коридор, подходящий к наружной стене\n2. Проход блока кладовых к наружной стене\n3. Техническое пространство в пределах того же этажа\n\n### Стояки канализации (К1) — внутри ячейки\n\n| Параметр | Значение |\n|---|---|\n| Трасса | Прямолинейная, с последнего по 1-й этаж, с выходом на кровлю (фановый стояк) |\n| Диаметр стояка | До 160 мм |\n| Ответвление к унитазу | 110 мм |\n| Ответвление к раковине | 50 мм |\n| Ответвление к постирочной | 32 мм |\n| Отверстие в плите под стояк | 200×200 мм |\n| Ревизия | 90 мм от оси стояка, на каждом 3-м этаже начиная с 1-го жилого (напр. 2, 5, 8) |\n\n**Строгие запреты:**\n- Перекидки стояков в квартирах и коридорах жилых этажей — **недопустимы**\n- Размещение стояков в жилых комнатах — **запрещено**\n- Подключение разных квартир к одному стояку К1 — **нельзя**\n- Оборудование не крепится к межквартирной стене, ограждающей жилые комнаты — **либо** стена двойная со звукоизоляционным слоем (п.7.27 СП54)\n\n> [!note] Перекидка в МОП 1-го этажа — не запрещена нормативно, но рискованно\n> Место изгиба (колено) — самое уязвимое место, может прорвать при эксплуатации, ремонт — за счёт застройщика. Обязательно согласовывать с заказчиком; чаще прописывают отсутствие перекидок прямо в ТЗ.\n\nНе стоит проектировать унитаз впритык к стене — учитывать узел подключения. Канализацию можно тянуть через санузел к кухне — согласовать со специалистом ВК. На 1-х этажах стояк можно не тянуть на кровлю через всё здание — тоже по согласованию с ВК.\n\n### Стояки ливневой канализации (К2) — общедомовой\n\n| Параметр | Значение |\n|---|---|\n| Расположение стояка | В нише МОП, кровельные воронки — над МОП |\n| Уклон трубы от воронки | 5‰ (5 тысячных) |\n| Диаметр трубы от воронки | До 110 мм |\n| Диаметр стояка | До 160 мм |\n| Отверстие в плите | 200×200 мм |\n\nТрубы от воронок идут в запотолочном пространстве последнего этажа либо в техническом пространстве. Стояк спускается в подземный этаж и выводится к уличной ливнёвке (та же логика с проходами, что у К1).\n\n### Водоснабжение — коллектор (В1/Т3) vs поквартирные стояки\n\nДве альтернативные схемы, применяется одна из двух.\n\n**Коллектор (общедомовой):** система стояков ХВС (В1) + ГВС (Т3) + Т4 (поддержание температуры Т3, без гребёнки) с распределительными гребёнками на каждую квартиру. Разводка от гребёнки в квартиру — **в полу**. Рекомендуемая толщина пола — **100 мм**.\n\n**Число ниш:**\n- ≤9 квартир на этаже — 1 ниша\n- ≥10 квартир на этаже — 2 ниши\n\n**Ширина ниши (стояк + коллектор):**\n\n| Этажность | Мин. ширина (≤6 квартир) | Макс. ширина (9 квартир, +100мм/кв.) |\n|---|---|---|\n| ≤17 этажей | 1200 мм | 1500 мм |\n| ≥18 этажей | 1500 мм | 1800 мм |\n\nГлубина ниши — **280 мм**.\n\n⚠️ **Совмещённый коллектор ВК+ОВ** — допустим только при нехватке места, требует согласования с ОВ и ВК (габариты задают они), глубина ниши увеличивается. **Нежелательное решение** — сложность монтажа/разводки труб.\n\n**Поквартирные стояки (внутри ячейки):** своя ниша на каждую квартиру, ширина **400 мм**, глубина **200 мм**.\n\n---\n\n## 2. ШПК (шкаф пожарного крана) — общедомовой и внутри ячейки\n\n| Параметр | Значение |\n|---|---|\n| Когда обязателен | Этажность жилого здания **>12 этажей** |\n| Расположение | Межквартирные коридоры, вестибюль |\n| Габариты шахты | Не менее 900(Ш)×300(Г) мм |\n| Радиус действия | 18 м от ШПК до центра самого удалённого помещения (с учётом огибания стен рукавом) |\n| Высота установки | Не менее 1500 мм от пола до верхней грани шкафа |\n\n**Практические нюансы:**\n- В каждом помещении общественного назначения (коммерция) — свой ШПК от обособленного набора труб, который дальше не поднимается\n- ШПК в нише (металлический шкаф закрыт перегородками, напр. ГКЛ) либо в собственном коробе — отдельностоящий ШПК **не должен заужать ширину пути эвакуации**\n- Можно разместить ШПК перед шахтой ОВ при нехватке места (согласование с ОВ, воздухозабор — выше шкафа)\n- Если в одном пожарном отсеке — разновысотные секции, и в одной нужен ШПК → **ШПК нужен в обеих секциях этого отсека**\n- Отверстия — только под стояки по краям от ШПК\n- ШПК можно перекинуть на нежилой этаж (трубы пройдут в запотолочном пространстве)\n\n---\n\n## 3. ЭОМ / СС — ниши слаботочки и электрики\n\n**4 сегмента:**\n\n| Сегмент | Назначение | Правило размещения |\n|---|---|---|\n| **ППУ** | Вентоборудование, клапаны питания, аварийное освещение | 1 ниша на межквартирный коридор; при этажности >9 — 2 ниши |\n| **СС.ППУ** | Пожарная сигнализация, оповещение, автоматика (запуск ОВ/ВК) | Так же, как ППУ |\n| **ЭОМ** | Рабочее освещение, кабели питания квартир/щитов | 1 ниша на коридор + доп. на каждые 6 квартир |\n| **СС** | Телефония, интернет, домофония | Так же, как ЭОМ |\n\n**Правила размещения:**\n1. Ниши — в геометрическом центре нагрузок (секции/коридора)\n2. К одному щиту ЭОМ/СС — не более **6 квартир** (10 квартир в коридоре → 2 ниши по 5)\n3. В разных коридорах — разные щиты\n4. Магистральные трассы — предпочтительно в пределах лестнично-лифтового узла\n5. Доступ к шкафу — круглосуточный для персонала/аварийных работ\n6. **Не** размещать в одной нише со шкафом ЭОМ/СС другие ниши без выгородок\n7. Можно разделять шкаф на части — но ЭОМ+СС вместе, ППУ+СС.ППУ вместе (3 варианта состава ниши: полный/ЭОМ+СС отдельно/ППУ+СС.ППУ отдельно)\n\nШкаф крепится через боковые стенки — нужны перегородки за шкафом и по бокам. Чаще монтируется заподлицо с наружной стенкой.\n\n---\n\n## 4. Отопление и вентиляция (ОВ)\n\n### Две категории систем\n- **Общеобменные** — вентиляция (естественная/механическая)\n- **Противодымные** — дымоудаление и подпор воздуха, для защиты путей эвакуации (межквартирный коридор, тамбур-шлюзы) от задымления\n\nСоотношение сторон любого воздуховода — **не более 1:4**.\n\n### Противодымные системы — три компонента\n\n- **ДУ (дымоудаление)** — вытяжная система, забор воздуха под потолком (не ниже верхнего уровня дверных проёмов выходов)\n- **КДУ (компенсация дымоудаления)** — подача свежего воздуха в нижней части помещения, откуда удаляется дым\n- **ПД (подпор воздуха)** — создание избыточного давления в защищаемом помещении\n\n**Логика комбинаций (п.7.1 СП7.13130):** приточные системы применяются **только** в сочетании с вытяжными — обособленное применение притока без вытяжки не допускается. Системы должны быть **автономными для каждого пожарного отсека**, кроме систем, защищающих ЛК/лифтовые шахты, сообщающиеся с разными отсеками.\n\n**Документы:** [[СП 1.13130.2020]] (эвакуация — что защищаем) · **СП7.13130.2013** с Изм.№1 (приказ МЧС №119 от 27.02.2020) и Изм.№2 (№152 от 12.03.2020) — детально сверено дословно, теперь в базе.\n\n> [!warning] Исправление собственной ошибки\n> Раньше здесь было написано «ДУ/КДУ нужны, если путь от двери квартиры до ЛК >12 м» — эта цифра **не подтвердилась** при сверке с дословным текстом п.7.2 СП7.13130. Там нет такого правила для жилых зданий вообще — только высота >28м и подвал/цоколь (см. ниже). Возможно, «12 м» — это спутанное с каким-то другим нормативом значение; убрано до отдельной проверки первоисточника.\n\n### Когда нужны ДУ/КДУ — дословный чек-лист (п.7.2 СП7.13130)\n\nУдаление продуктов горения обязательно:\n\n**а)** из коридоров и холлов жилых/общественных/административно-бытовых/многофункциональных зданий **высотой более 28 м**\n**б)** из коридоров/тоннелей подвальных и цокольных этажей (жилых и др.) **при выходах в них из помещений с постоянным пребыванием людей**\n**в)** из коридоров без естественного проветривания **длиной более 15 м** — но только в производственных/складских (категории А,Б,В), общественных, административно-бытовых, многофункциональных зданиях (жилые в этом подпункте не указаны явно)\n**г)** из общих коридоров и холлов зданий с незадымляемыми ЛК\n**д)** из атриумов и пассажей\n**е)** из производственных/складских помещений с постоянными рабочими местами определённых категорий пожароопасности\n**ж)** из отдельных помещений с высокой плотностью людей, торговых залов, офисов, гардеробных ≥200м² и т.п.\n**з)** из помещений автостоянок закрытого типа и их изолированных рамп\n\n**Исключения (п.7.3) — когда ДУ НЕ требуется несмотря на п.7.2:**\n- Помещения ≤200м² с автоматическим водяным/пенным пожаротушением (кроме категорий А/Б, кроме сообщающихся с Н2/Н3, кроме закрытых автостоянок с водителем)\n- Помещения с автоматическим газовым/аэрозольным/порошковым пожаротушением\n- Коридоры/холлы, если из ВСЕХ сообщающихся с ними помещений уже есть прямое удаление дыма\n- Помещения ≤50м² внутри основного помещения, откуда уже идёт удаление\n- Коридоры без постоянных рабочих мест в сообщающихся помещениях + противопожарные двери в дымогазонепроницаемом исполнении на выходах\n- **Встроенные ПОН на первом этаже жилого дома** — если конструктивно изолированы от жилой части, путь эвакуации ≤25м, площадь каждого помещения ≤800м² (прямое дополнение к разделу «Встроенные функции» блока 1!)\n\n**Тупиковые коридоры** — нельзя разделять перегородками с дверями на участки **<15 м** без устройства в каждом участке своих ДУ/КДУ.\n\n### Методика расчёта расхода (п.7.4, 7.8, 7.9)\n\n- Расчёт — **не по фиксированным табличным значениям температуры**, а по факторам: мощность очага, теплопотери, температура удаляемых газов, параметры наружного воздуха, положение дверей/окон, геометрия\n- Для коридоров — расчёт **на каждые ≤60 м** длины\n- Для помещений — расчёт **на каждую дымовую зону ≤3000 м²**\n- Дымоприёмное устройство на коридор: **≤45 м** (прямой коридор) / **≤30 м** (угловой) / **≤20 м** (кольцевой/замкнутый) на одно устройство\n- В помещениях >3000м² — деление на зоны ≤3000м² каждая, **≤1000м² на одно дымоприёмное устройство**\n- Положительный дисбаланс не допускается; при совместном действии притока/вытяжки — отрицательный дисбаланс ≤30%, перепад давления на закрытых дверях выходов ≤150 Па\n\n### Классы огнестойкости воздуховодов и клапанов (п.7.11)\n\n| Элемент | Класс |\n|---|---|\n| Транзитные воздуховоды/шахты за пределами отсека | EI 150 |\n| Воздуховоды/шахты в пределах отсека — закрытые автостоянки | EI 60 |\n| Вертикальные воздуховоды/шахты — удаление из помещений напрямую | EI 45 |\n| Прочие случаи в пределах отсека | EI 30 |\n| Нормально закрытый клапан — закрытые автостоянки | EI 60 |\n| Нормально закрытый клапан — из обслуживаемых помещений напрямую | EI 45 |\n| Дымовой клапан на ответвлении от шахты (коридоры/холлы) | EI 30 |\n| Дымовой клапан непосредственно в проёме шахты (коридоры/холлы) | E 30 |\n\n### Подпор воздуха — полный список случаев (п.7.14, а–р)\n\nПомимо тамбур-шлюзов при Н2/Н3, подпор нужен также: в шахты лифтов без тамбур-шлюзов у выходов (в зданиях с незадымляемыми ЛК); в шахты лифтов с режимом «перевозка пожарных подразделений» (независимо ни от чего); в незадымляемые ЛК типа Н2 напрямую; в тамбур-шлюзы при выходах из лифтов в подземную автостоянку (парно-последовательно, если ≥2 остановки выше земли — см. п.8.7); в тамбур-шлюзы при внутренних лестницах из цокольного/подвального этажа; на входах в атриумы/пассажи с подземных уровней; в нижние части защищаемых вытяжкой помещений (компенсация); в тамбур-шлюзы, отделяющие автостоянку от помещений другого назначения; в тамбур-шлюзы при выходе из Н2 в вестибюль (здания >28м многофункциональные/>75м жилые/>50м общественные); в помещения безопасных зон (ПБЗ) на этаже с очагом пожара.\n\n**Избыточное давление (п.7.15–7.16):** не менее 20 Па (расчётный минимум), в Н2/тамбур-шлюзах — не более 150 Па, в шахтах лифтов — не более 70 Па. Скорость истечения через открытый проём тамбур-шлюза — не менее 1,3 м/с; в помещения безопасных зон — не менее 1,5 м/с.\n\n---\n\n## Раздел 8 СП7.13130 — объёмно-планировочные требования (новое, ранее не было в базе)\n\n- **Н2 vs Н3** (п.8.4) — нормативно **равнозначны**, нельзя нормировать обязательное предпочтение одного перед другим — выбор делается в технологической части проекта, не архитектором произвольно\n- **Выход из Н2 в вестибюль** в зданиях **>28м** — обязательно через тамбур-шлюз с подпором воздуха (уточнение к тому, что мы знали про Н2 раньше)\n- **Окна в Н2** (п.8.9) — **неоткрывающиеся** ✅ (подтверждает то, что уже есть в [[Лестничные клетки — типы Л1 Л2 Н1 Н2 Н3]])\n- **Двери лифтовых шахт** (п.8.6) — нельзя фиксировать в открытом положении, если помещения не защищены противодымной вентиляцией\n- **Лифты в подземную автостоянку** (п.8.7) — если лифт имеет ≥2 остановки на надземных этажах, на этаже автостоянки нужны **два последовательных тамбур-шлюза** (не один), с отдельными системами подпора для каждого\n- **Естественное проветривание коридоров при пожаре** (п.8.5) — открываемые проёмы: верхняя кромка не ниже 2,5м, нижняя — не выше 1,5м от пола, ширина ≥1,6м на каждые 30м длины коридора; для помещений — ширина ≥0,24м на 1м длины наружного ограждения, максимальное расстояние от внутренних ограждений — 20м (40м при ограждениях на противоположных фасадах)\n- **Переходы через воздушную зону Н1** (п.8.3) — должны соответствовать типовым решениям приложения Г самого СП7.13130 (чертежи, в базе пока не разбирались отдельно)\n\n---\n\n### Вентиляция внутри квартиры\n\n**Приточная:**\n1. Приточные клапаны (в наружной стене) + клапаны микропроветривания (на окнах) — в жилые помещения\n2. Принудительный забор+подача — забор с улицы (чаще с 1-го этажа)\n3. Противопожарные клапаны — устройство циркуляции+перекрытия при пожаре, устанавливается на подземном этаже, воздух подаётся в общий коридор и циркулирует через клапаны\n\n**Вытяжная** — обслуживает кухню/санузел/ванную/постирочную:\n- **Воздуховод** — вертикальная конструкция большего сечения на весь стояк квартир\n- **Спутник** — горизонтальное ответвление для конкретной квартиры (в запотолочном пространстве)\n\n**Естественная** вентиляция — шахта в каждом обслуживаемом помещении. **Механическая** — одна шахта может обслуживать несколько соседних помещений (спутник тянется к ним в запотолочном пространстве — **влияет на тип и высоту потолка**, учитывать заранее).\n\nСечение воздуховода внутри квартиры и в МОП — разное (в МОП допустимая скорость выше, сечение может быть меньше).\n\n### Отопление — коллектор vs поквартирные стояки\n\n**Коллектор (общедомовой, основная схема):** стояки (подающий+обратный) с гребёнками на квартиру, разводка **в полу**. Толщина пола — **100 мм**.\n\n**Число ниш:**\n- ≤12 квартир на этаже — 1 ниша\n- ≥13 квартир — 2 ниши\n\n**Ширина ниши по этажности:**\n\n| Этажность | Стояков | Отверстие в плите (Ш×Г) | Мин. ширина (2 кв.) | Макс. ширина (12 кв., +100мм/кв.) |\n|---|---|---|---|---|\n| ≤17 этажей | 1 подающий + 1 обратный | 200×300 мм | 900 мм | 1900 мм |\n| ≥18 этажей, зона 1 (нижняя) | 2 подающих + 2 обратных | 400×300 мм | 1100 мм | 2100 мм |\n| ≥18 этажей, зона 2 (верхняя) | 1 подающий + 1 обратный | 200×300 мм | 900 мм | 1900 мм |\n\n**Границы зон по высоте здания:**\n- Здание ≤24 этажей: зона 1 — до 12-го этажа включительно, зона 2 — выше\n- Здание ≤32 этажей: зона 1 — до 16-го этажа включительно, зона 2 — выше\n\nГлубина ниши — **300 мм**. Совмещённый коллектор ВК+ОВ — та же оговорка, что выше (нежелательно, только по согласованию).\n\n**Поквартирные стояки (редко):** разводка отопления в стояках вдоль наружной стены каждой квартиры. Отверстия в плите — **100×200 мм**. Стояки могут не зашиваться (эстетическое решение). Радиаторы подключаются к стоякам.\n\n⚠️ Стояки отопления **не должны попадать** в электрощитовые/СС. Если не размещать под стояками — допускается: перекидка стояка в запотолочном пространстве МОП/ПОН, либо вырезание из габарита помещения места опуска (минимальная ширина ниши доступа — **600 мм**).\n\n---\n\n## Связанные заметки\n[[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]] · [[Пожарные отсеки и противопожарные преграды]] · [[Лестничные клетки — типы Л1 Л2 Н1 Н2 Н3]] · [[Категории помещений по пожарной опасности]] · [[Нормативная база — карта]]\n", "diagrams": []}]}};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pluralRu(n, one, few, many) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 14) return many;
  if (mod10 === 1) return one;
  if (mod10 >= 2 && mod10 <= 4) return few;
  return many;
}

function calloutIcon(type) {
  const icons = {important:'❗', warning:'⚠️', note:'📝', success:'✅', question:'❓'};
  return icons[(type||'').toLowerCase()] || '💡';
}
function calloutLabel(type) {
  const labels = {important:'Важно', warning:'Внимание', note:'Заметка', success:'Ответ / открыть', question:'Вопрос'};
  return labels[(type||'').toLowerCase()] || type;
}

function mdInline(text) {
  text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, (m, target, display) => {
    const key = target.trim();
    const found = !!NOTE_INDEX[key];
    const cls = found ? 'wikilink wikilink-active' : 'wikilink';
    return `<span class="${cls}" data-link="${key.replace(/"/g,'&quot;')}">${display}</span>`;
  });
  text = text.replace(/\[\[([^\]]+)\]\]/g, (m, target) => {
    const key = target.trim();
    const found = !!NOTE_INDEX[key];
    const cls = found ? 'wikilink wikilink-active' : 'wikilink';
    return `<span class="${cls}" data-link="${key.replace(/"/g,'&quot;')}">${key}</span>`;
  });
  text = text.replace(/`([^`]+)`/g, '<code class="md-inline-code">$1</code>');
  return text;
}

function mdToHtml(md, diagrams) {
  diagrams = diagrams || [];
  let diagramIdx = 0;
  const lines = md.split('\n');
  let html = '';
  let inTable = false, tableRows = [];
  let inList = false, listType = null;
  let inCallout = false, calloutType = '', calloutLines = [];
  let inCode = false, codeLang = '', codeLines = [];

  function flushTable() {
    if (!inTable || tableRows.length === 0) { inTable = false; tableRows = []; return; }
    let out = '<div class="md-table-wrap"><table class="md-table">';
    tableRows.forEach((row, idx) => {
      if (idx === 1 && row.every(c => /^[-:\s]+$/.test(c))) return;
      const tag = idx === 0 ? 'th' : 'td';
      out += '<tr>' + row.map(c => `<${tag}>${mdInline(c.trim())}</${tag}>`).join('') + '</tr>';
    });
    out += '</table></div>';
    html += out;
    tableRows = []; inTable = false;
  }
  function flushList() {
    if (!inList) return;
    html += `</${listType}>`;
    inList = false;
  }
  function flushCallout() {
    if (!inCallout) return;
    const cls = calloutType.toLowerCase();
    html += `<div class="md-callout md-callout-${cls}"><div class="md-callout-title">${calloutIcon(calloutType)} ${calloutLabel(calloutType)}</div>${calloutLines.map(l => l.trim() ? `<p>${mdInline(l)}</p>` : '').join('')}</div>`;
    calloutLines = []; inCallout = false;
  }

  for (let line of lines) {
    const codeMatch = line.match(/^```(\w*)/);
    if (codeMatch && !inCode) {
      flushTable(); flushList(); flushCallout();
      inCode = true; codeLang = codeMatch[1]; codeLines = [];
      continue;
    }
    if (inCode && line.trim() === '```') {
      inCode = false;
      if (codeLang === 'mermaid') {
        const svg = diagrams[diagramIdx++];
        if (svg) {
          html += `<div class="diagram-wrap">${svg}</div>`;
        } else {
          html += '<div class="md-diagram-placeholder">📊 Здесь была схема-диаграмма — полная версия в Obsidian (эта конкретная схема слишком сложная для надёжной автоматической отрисовки — таблица в тексте заметки содержит ту же информацию)</div>';
        }
      } else {
        html += `<pre class="md-code">${codeLines.join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre>`;
      }
      continue;
    }
    if (inCode) { codeLines.push(line); continue; }

    const calloutMatch = line.match(/^>\s*\[!(\w+)\]-?\s*(.*)/);
    if (calloutMatch) {
      flushTable(); flushList();
      if (inCallout) flushCallout();
      inCallout = true; calloutType = calloutMatch[1];
      if (calloutMatch[2]) calloutLines.push(calloutMatch[2]);
      continue;
    }
    if (inCallout && line.startsWith('>')) { calloutLines.push(line.replace(/^>\s?/, '')); continue; }
    if (inCallout && line.trim() === '') { flushCallout(); continue; }
    if (inCallout) { flushCallout(); }

    if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
      flushList();
      const cells = line.trim().slice(1, -1).split('|');
      tableRows.push(cells);
      inTable = true;
      continue;
    } else if (inTable) { flushTable(); }

    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) {
      flushTable(); flushList(); flushCallout();
      const level = Math.min(h[1].length + 1, 6);
      html += `<h${level} class="md-h${level}">${mdInline(h[2])}</h${level}>`;
      continue;
    }

    if (/^-{3,}$/.test(line.trim())) {
      flushTable(); flushList(); flushCallout();
      html += '<hr class="md-hr">';
      continue;
    }

    const listMatch = line.match(/^\s*[-*]\s+(.*)/);
    const numMatch = line.match(/^\s*\d+\.\s+(.*)/);
    if (listMatch || numMatch) {
      flushTable();
      const isNum = !!numMatch;
      const content = (listMatch || numMatch)[1];
      if (!inList) { listType = isNum ? 'ol' : 'ul'; html += `<${listType} class="md-list">`; inList = true; }
      html += `<li>${mdInline(content)}</li>`;
      continue;
    } else if (inList) { flushList(); }

    if (line.trim() === '') { continue; }
    if (/^#\S/.test(line.trim())) { continue; } // пропускаем строки-теги вида #нормативка #блок

    flushTable(); flushList();
    html += `<p class="md-p">${mdInline(line)}</p>`;
  }
  flushTable(); flushList(); flushCallout();
  return html;
}

function blockAccuracy(blockNum) {
  const qs = QUESTIONS.filter(q => q.block === blockNum);
  let shown = 0, correct = 0;
  qs.forEach(q => {
    const s = PROGRESS.stats[q.id];
    if (s) { shown += s.shown; correct += s.correct; }
  });
  return { shown, correct, total: qs.length, pct: shown ? Math.round(100 * correct / shown) : null };
}

function overallStats() {
  let totalShown = 0, totalCorrect = 0, sessionsCount = PROGRESS.sessions.length;
  Object.values(PROGRESS.stats).forEach(s => { totalShown += s.shown; totalCorrect += s.correct; });
  return { totalShown, totalCorrect, sessionsCount, pct: totalShown ? Math.round(100 * totalCorrect / totalShown) : 0 };
}

function getMistakeQuestions() {
  return QUESTIONS.filter(q => PROGRESS.stats[q.id] && PROGRESS.stats[q.id].lastWrong);
}

function getFavoriteQuestions() {
  const favs = PROGRESS.favorites || [];
  return QUESTIONS.filter(q => favs.includes(q.id));
}

function getTickets() {
  const tickets = [];
  for (let i = 0; i < QUESTIONS.length; i += TICKET_SIZE) {
    tickets.push(QUESTIONS.slice(i, i + TICKET_SIZE));
  }
  return tickets;
}

function ringSvg(pct) {
  const p = pct === null ? 0 : pct;
  const r = 18, c = 2 * Math.PI * r;
  const offset = c - (p / 100) * c;
  const color = pct === null ? '#D8E0E8' : (pct >= 70 ? 'var(--good)' : pct >= 40 ? '#C98E2E' : 'var(--bad)');
  return `<svg width="46" height="46" viewBox="0 0 46 46">
    <circle cx="23" cy="23" r="${r}" fill="none" stroke="#E4ECF4" stroke-width="4"/>
    <circle cx="23" cy="23" r="${r}" fill="none" stroke="${color}" stroke-width="4"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

let _noteSaveTimer = null;
let _speakingNoteKey = null;
let _cachedVoices = [];

function refreshVoicesCache() {
  if (!window.speechSynthesis) return;
  const v = window.speechSynthesis.getVoices();
  if (v && v.length) _cachedVoices = v;
}

function initVoicesListener() {
  if (!window.speechSynthesis) return;
  refreshVoicesCache();
  window.speechSynthesis.onvoiceschanged = refreshVoicesCache;
}

function populateVoiceSelect(selectEl) {
  if (!window.speechSynthesis) return;
  refreshVoicesCache();
  if (_cachedVoices.length === 0) {
    // голоса иногда подгружаются с задержкой — пробуем ещё раз чуть позже
    setTimeout(() => populateVoiceSelect(selectEl), 300);
    return;
  }
  const ruVoices = _cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
  const otherVoices = _cachedVoices.filter(v => !(v.lang && v.lang.toLowerCase().startsWith('ru')));
  const ordered = [...ruVoices, ...otherVoices];

  const savedURI = PROGRESS.voicePref;
  let optionsHtml = '<option value="">По умолчанию</option>';
  optionsHtml += ordered.map(v => `<option value="${v.voiceURI.replace(/"/g,'&quot;')}">${v.name} (${v.lang})</option>`).join('');
  selectEl.innerHTML = optionsHtml;
  if (savedURI && ordered.some(v => v.voiceURI === savedURI)) {
    selectEl.value = savedURI;
  }
}

function getSelectedVoice() {
  const uri = PROGRESS.voicePref;
  if (!uri) return null;
  return _cachedVoices.find(v => v.voiceURI === uri) || null;
}

function updateSpeakButton(btn) {
  const speaking = window.speechSynthesis && window.speechSynthesis.speaking;
  btn.textContent = speaking ? '⏹ Стоп' : '🔊 Слушать';
}

function toggleSpeak(btn) {
  if (!window.speechSynthesis) {
    alert('Озвучка не поддерживается в этом браузере');
    return;
  }
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    _speakingNoteKey = null;
    updateSpeakButton(btn);
    return;
  }
  const contentEl = document.querySelector('.theory-content');
  if (!contentEl) return;
  const text = contentEl.textContent.replace(/\s+/g, ' ').trim();
  if (!text) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const chosenVoice = getSelectedVoice();
  if (chosenVoice) {
    utter.voice = chosenVoice;
    utter.lang = chosenVoice.lang;
  } else {
    utter.lang = 'ru-RU';
  }
  utter.rate = 0.95;
  utter.onend = () => { _speakingNoteKey = null; updateSpeakButton(btn); };
  utter.onerror = () => { _speakingNoteKey = null; updateSpeakButton(btn); };
  const t = THEORY[THEORY_BLOCK];
  _speakingNoteKey = t.notes[THEORY_NOTE_INDEX].file;
  window.speechSynthesis.speak(utter);
  updateSpeakButton(btn);
}

function attachTheoryContentHandlers() {
  document.getElementById('backToTheoryNotes').addEventListener('click', () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); VIEW = 'theory-notes'; render(); });
  const prevBtn = document.getElementById('prevNote');
  const nextBtn = document.getElementById('nextNote');
  if (prevBtn) prevBtn.addEventListener('click', () => { if (THEORY_NOTE_INDEX > 0) { if (window.speechSynthesis) window.speechSynthesis.cancel(); THEORY_NOTE_INDEX--; render(); window.scrollTo(0,0); } });
  if (nextBtn) nextBtn.addEventListener('click', () => { const t = THEORY[THEORY_BLOCK]; if (THEORY_NOTE_INDEX < t.notes.length - 1) { if (window.speechSynthesis) window.speechSynthesis.cancel(); THEORY_NOTE_INDEX++; render(); window.scrollTo(0,0); } });
  document.querySelectorAll('.theory-content .wikilink-active').forEach(el => {
    el.addEventListener('click', () => navigateToNote(el.dataset.link));
  });

  const speakBtn = document.getElementById('speakBtn');
  if (speakBtn) {
    updateSpeakButton(speakBtn);
    speakBtn.addEventListener('click', () => toggleSpeak(speakBtn));
  }

  const voiceSelect = document.getElementById('voiceSelect');
  if (voiceSelect) {
    populateVoiceSelect(voiceSelect);
    voiceSelect.addEventListener('change', () => {
      PROGRESS.voicePref = voiceSelect.value || null;
      saveProgress(PROGRESS);
      if (window.speechSynthesis && window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        updateSpeakButton(speakBtn);
      }
    });
  }

  const ta = document.getElementById('noteAnnotation');
  if (ta) {
    const t = THEORY[THEORY_BLOCK];
    const note = t.notes[THEORY_NOTE_INDEX];
    const statusEl = document.getElementById('noteAnnotationStatus');
    ta.addEventListener('input', () => {
      if (statusEl) statusEl.textContent = 'сохраняю…';
      clearTimeout(_noteSaveTimer);
      _noteSaveTimer = setTimeout(() => {
        if (!PROGRESS.notes) PROGRESS.notes = {};
        PROGRESS.notes[note.file] = ta.value;
        saveProgress(PROGRESS);
        if (statusEl) statusEl.textContent = 'сохранено ✓';
        setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 1500);
      }, 500);
    });
  }
}

function renderQuiz() {
  const q = CURRENT_QUESTIONS[CURRENT_INDEX];
  const total = CURRENT_QUESTIONS.length;
  const recorded = CURRENT_ANSWERS.find(a => a.question.id === q.id);
  const selected = recorded ? recorded.selected : null;
  const answered = selected !== null;
  const optionsHtml = q.options.map((opt, i) => {
    let cls = 'option';
    if (answered) {
      cls += ' locked';
      if (i === q.correct) cls += ' correct';
      else if (i === selected) cls += ' incorrect';
    } else if (i === selected) {
      cls += ' selected';
    }
    return `<div class="${cls}" data-idx="${i}">${opt}</div>`;
  }).join('');

  let explainHtml = '';
  if (answered) {
    const isCorrect = selected === q.correct;
    explainHtml = `<div class="explain-box ${isCorrect ? 'good' : 'bad'}">
      <b>${isCorrect ? 'Верно.' : 'Неверно.'}</b>
      <span class="body-text">${q.explain}</span>
    </div>`;
  }

  const imgHtml = q.img ? `<div class="qimg">${q.img}</div>` : '';
  const isFav = (PROGRESS.favorites || []).includes(q.id);
  const starHtml = `<span class="fav-star ${isFav ? 'active' : ''}" id="favToggle" title="В избранное">${isFav ? '★' : '☆'}</span>`;
  const prevDisabled = CURRENT_INDEX === 0 ? 'disabled' : '';

  return `
    <div class="top-nav">
      <div class="back-link" id="exitQuiz">← назад</div>
    </div>
    <div class="quiz-progress">${CURRENT_LABEL} · вопрос ${CURRENT_INDEX + 1} из ${total}</div>
    <div class="quiz-progress-bar"><div style="width:${100 * (CURRENT_INDEX) / total}%"></div></div>
    <div class="question-card">
      <div class="qtext-row">
        <div class="qtext">${q.q}</div>
        ${starHtml}
      </div>
      ${imgHtml}
      ${optionsHtml}
      ${explainHtml}
    </div>
    <div class="quiz-actions">
      <button class="btn ghost" id="prevBtn" ${prevDisabled}>← Предыдущий</button>
      <button class="btn" id="nextBtn" ${answered ? '' : 'disabled'}>${CURRENT_INDEX + 1 < total ? 'Далее' : 'Завершить'}</button>
    </div>
  `;
}

function renderResults() {
  const total = CURRENT_ANSWERS.length;
  const correctCount = CURRENT_ANSWERS.filter(a => a.selected === a.question.correct).length;
  const pct = Math.round(100 * correctCount / total);
  const wrong = CURRENT_ANSWERS.filter(a => a.selected !== a.question.correct);

  const wrongHtml = wrong.length === 0
    ? '<div class="empty-hint">Все ответы верные — отлично.</div>'
    : wrong.map(a => `
      <div class="wrong-item">
        <div class="q">${a.question.q}</div>
        <div class="a">Правильно: ${a.question.options[a.question.correct]}</div>
      </div>`).join('');

  return `
    <div class="results-hero">
      <div class="score">${correctCount}/${total}</div>
      <div class="score-lbl">${pct}% верных ответов · ${CURRENT_LABEL}</div>
    </div>
    ${wrong.length > 0 ? '<div style="font-size:13px;color:var(--ink-mute);margin-bottom:8px;">Разобрать ошибки:</div>' : ''}
    ${wrongHtml}
    <div class="action-row">
      <button class="btn ghost" id="retryBtn">Пройти ещё раз</button>
      <button class="btn" id="homeBtn">Назад</button>
    </div>
  `;
}

// ---------------------------------------------------------------------------
// Экспорт / импорт прогресса — на случай, если хранилище не переживёт
// обновление файла (после каждой правки приложение технически новое)
// ---------------------------------------------------------------------------
function renderExportImport() {
  const exportText = JSON.stringify(PROGRESS);
  return `
    <div class="top-nav"><div class="back-link" id="backFromExport">← назад</div></div>
    <div class="titleblock"><h1>⚙️ Экспорт / импорт прогресса</h1></div>
    <div class="export-warning">
      Каждый раз, когда я присылаю обновлённую версию файла после правок — это технически новая копия, и сохранённый прогресс может не перенестись автоматически. Чтобы не терять его: скопируй код ниже <b>перед тем</b>, как я пришлю новую версию, а после открытия новой версии — вставь его обратно через «Импорт».
    </div>

    <div class="export-section-label">📤 Экспорт (скопируй и сохрани куда-нибудь — заметку, файл)</div>
    <textarea id="exportArea" class="export-textarea" readonly>${exportText.replace(/</g,'&lt;')}</textarea>
    <button class="btn" id="copyExportBtn" style="width:100%; margin-bottom:20px;">📋 Скопировать</button>
    <div class="export-status" id="exportStatus"></div>

    <div class="export-section-label">📥 Импорт (вставь ранее сохранённый код и нажми кнопку)</div>
    <textarea id="importArea" class="export-textarea" placeholder="Вставь сюда ранее скопированный код прогресса..."></textarea>
    <button class="btn" id="importBtn" style="width:100%; background: var(--good); border-color: var(--good);">Импортировать</button>
    <div class="export-status" id="importStatus"></div>
  `;
}

function attachExportImportHandlers() {
  document.getElementById('backFromExport').addEventListener('click', () => { VIEW = 'dashboard'; render(); });

  const copyBtn = document.getElementById('copyExportBtn');
  const exportStatus = document.getElementById('exportStatus');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const text = document.getElementById('exportArea').value;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.getElementById('exportArea');
          ta.select();
          document.execCommand('copy');
        }
        exportStatus.textContent = '✓ Скопировано в буфер обмена';
      } catch (e) {
        exportStatus.textContent = 'Не удалось скопировать автоматически — выдели текст вручную и скопируй (Ctrl+C / удержание пальцем).';
      }
    });
  }

  const importBtn = document.getElementById('importBtn');
  const importStatus = document.getElementById('importStatus');
  if (importBtn) {
    importBtn.addEventListener('click', async () => {
      const raw = document.getElementById('importArea').value.trim();
      if (!raw) { importStatus.textContent = 'Сначала вставь код прогресса.'; return; }
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed !== 'object' || parsed === null) throw new Error('bad shape');
        PROGRESS = {
          stats: parsed.stats || {},
          sessions: parsed.sessions || [],
          favorites: parsed.favorites || [],
          activeQuiz: parsed.activeQuiz || null,
          notes: parsed.notes || {},
          streak: parsed.streak || { count: 0, lastDate: null },
          voicePref: parsed.voicePref || null,
        };
        await saveProgress(PROGRESS);
        importStatus.textContent = '✓ Прогресс восстановлен! Возвращаюсь на главный экран…';
        setTimeout(() => { VIEW = 'dashboard'; render(); }, 1200);
      } catch (e) {
        importStatus.textContent = 'Не получилось разобрать код — проверь, что скопировано полностью, без пропусков.';
      }
    });
  }
}

// ---------------------------------------------------------------------------
// Мои пометки — свод всех личных заметок в одном месте
// ---------------------------------------------------------------------------
function renderMyNotes() {
  const notes = PROGRESS.notes || {};
  const entries = Object.keys(notes).filter(k => notes[k] && notes[k].trim().length > 0);

  const body = entries.length === 0
    ? '<div class="empty-hint">Пока пусто — открой любую заметку в разделе «Теория» и оставь пометку внизу, она появится здесь.</div>'
    : entries.map(fileKey => {
        const loc = NOTE_INDEX[fileKey];
        const title = loc ? THEORY[loc.block].notes[loc.idx].title : fileKey;
        const blockNum = loc ? loc.block : '?';
        const text = notes[fileKey];
        const preview = text.length > 160 ? text.slice(0, 160) + '…' : text;
        return `
          <div class="block-card" data-note-file="${fileKey.replace(/"/g, '&quot;')}">
            <div class="info">
              <span class="num-tag">БЛОК ${blockNum}</span>
              <div class="name">${title}</div>
              <div class="count">${preview.replace(/</g,'&lt;')}</div>
            </div>
          </div>`;
      }).join('');

  return `
    <div class="titleblock"><h1>📋 Мои пометки</h1><div class="sub">Всё, что записала внутри заметок теории</div></div>
    ${renderTabs('mynotes')}
    ${body}
  `;
}

function attachMyNotesHandlers() {
  document.querySelectorAll('.block-card[data-note-file]').forEach(card => {
    card.addEventListener('click', () => navigateToNote(card.dataset.noteFile));
  });
}

// ---------------------------------------------------------------------------
// Поиск — по всей теории и по всем вопросам сразу
// ---------------------------------------------------------------------------
function stripMd(text) {
  return text.replace(/[#*`>|_\[\]]/g, '').replace(/\n+/g, ' ').trim();
}

function searchAll(query) {
  const q = query.trim().toLowerCase();
  if (q.length < 2) return { theoryResults: [], questionResults: [] };

  const theoryResults = [];
  Object.keys(THEORY).forEach(blockNum => {
    THEORY[blockNum].notes.forEach((note, idx) => {
      const mdLower = note.md.toLowerCase();
      const pos = mdLower.indexOf(q);
      if (pos >= 0 || note.title.toLowerCase().includes(q)) {
        let snippet = '';
        if (pos >= 0) {
          const start = Math.max(0, pos - 50);
          const end = Math.min(note.md.length, pos + q.length + 70);
          snippet = (start > 0 ? '…' : '') + stripMd(note.md.slice(start, end)) + (end < note.md.length ? '…' : '');
        }
        theoryResults.push({ block: Number(blockNum), idx, title: note.title, blockName: THEORY[blockNum].name, snippet, file: note.file });
      }
    });
  });

  const questionResults = QUESTIONS.filter(qq =>
    qq.q.toLowerCase().includes(q) ||
    qq.options.some(o => o.toLowerCase().includes(q)) ||
    qq.explain.toLowerCase().includes(q)
  ).slice(0, 40);

  return { theoryResults, questionResults };
}

function renderSearch() {
  return `
    <div class="titleblock"><h1>🔍 Поиск</h1><div class="sub">По всей теории и по всем вопросам сразу</div></div>
    ${renderTabs('search')}
    <input type="text" id="searchInput" class="search-input" placeholder="Например: тамбур-шлюз, 550 м², Н1..." autocomplete="off">
    <div id="searchResults"></div>
  `;
}

function renderSearchResults(query) {
  const { theoryResults, questionResults } = searchAll(query);
  if (query.trim().length < 2) {
    return '<div class="empty-hint">Начни вводить запрос (минимум 2 символа)</div>';
  }
  if (theoryResults.length === 0 && questionResults.length === 0) {
    return '<div class="empty-hint">Ничего не нашлось</div>';
  }
  let html = '';
  if (theoryResults.length > 0) {
    html += `<div class="search-section-label">📖 В теории (${theoryResults.length})</div>`;
    html += theoryResults.slice(0, 20).map(r => `
      <div class="block-card" data-search-note="${r.file.replace(/"/g,'&quot;')}">
        <div class="info">
          <span class="num-tag">БЛОК ${r.block}</span>
          <div class="name">${r.title}</div>
          <div class="count">${r.snippet}</div>
        </div>
      </div>`).join('');
  }
  if (questionResults.length > 0) {
    html += `<div class="search-section-label">❓ В вопросах (${questionResults.length})</div>`;
    html += questionResults.slice(0, 20).map(qq => `
      <div class="block-card" data-search-question="${qq.id}">
        <div class="info">
          <span class="num-tag">БЛОК ${qq.block}</span>
          <div class="name">${qq.q}</div>
        </div>
      </div>`).join('');
  }
  return html;
}

function attachSearchHandlers() {
  const input = document.getElementById('searchInput');
  const resultsEl = document.getElementById('searchResults');
  function runSearch() {
    resultsEl.innerHTML = renderSearchResults(input.value);
    resultsEl.querySelectorAll('.block-card[data-search-note]').forEach(card => {
      card.addEventListener('click', () => navigateToNote(card.dataset.searchNote));
    });
    resultsEl.querySelectorAll('.block-card[data-search-question]').forEach(card => {
      card.addEventListener('click', () => {
        const qq = QUESTIONS.find(x => x.id === card.dataset.searchQuestion);
        if (qq) startQuizFromPool([qq], 'search-q', 'Найденный вопрос', 1, 'search');
      });
    });
  }
  if (input) {
    input.addEventListener('input', runSearch);
    input.focus();
  }
}

function attachQuizHandlers() {
  const q = CURRENT_QUESTIONS[CURRENT_INDEX];
  const alreadyAnswered = CURRENT_ANSWERS.some(a => a.question.id === q.id);
  if (!alreadyAnswered) {
    document.querySelectorAll('.option').forEach(el => {
      el.addEventListener('click', () => selectOption(Number(el.dataset.idx)));
    });
  }
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  const prevBtn = document.getElementById('prevBtn');
  if (prevBtn) prevBtn.addEventListener('click', prevQuestion);
  document.getElementById('exitQuiz').addEventListener('click', () => { VIEW = ORIGIN_VIEW; render(); });
  const favBtn = document.getElementById('favToggle');
  if (favBtn) favBtn.addEventListener('click', toggleFavorite);
}

function attachResultsHandlers() {
  document.getElementById('retryBtn').addEventListener('click', () => {
    if (LAST_QUIZ_ARGS) startQuizFromPool(...LAST_QUIZ_ARGS);
  });
  document.getElementById('homeBtn').addEventListener('click', () => { VIEW = ORIGIN_VIEW; render(); });
}

function startQuizFromPool(pool, key, label, count, originView) {
  if (!pool || pool.length === 0) return;
  LAST_QUIZ_ARGS = [pool, key, label, count, originView || ORIGIN_VIEW];
  ORIGIN_VIEW = originView || ORIGIN_VIEW;
  CURRENT_KEY = key;
  CURRENT_LABEL = label;
  CURRENT_QUESTIONS = shuffle(pool).slice(0, Math.min(count || pool.length, pool.length));
  CURRENT_INDEX = 0;
  CURRENT_ANSWERS = [];
  VIEW = 'quiz';
  saveActiveQuizState();
  render();
}

function toggleFavorite() {
  const q = CURRENT_QUESTIONS[CURRENT_INDEX];
  if (!PROGRESS.favorites) PROGRESS.favorites = [];
  const idx = PROGRESS.favorites.indexOf(q.id);
  if (idx === -1) PROGRESS.favorites.push(q.id); else PROGRESS.favorites.splice(idx, 1);
  saveProgress(PROGRESS);
  render();
}

function updateStreak() {
  const today = new Date().toISOString().slice(0, 10);
  if (!PROGRESS.streak) PROGRESS.streak = { count: 0, lastDate: null };
  const s = PROGRESS.streak;
  if (s.lastDate === today) return;
  if (s.lastDate) {
    const diffDays = Math.round((new Date(today) - new Date(s.lastDate)) / 86400000);
    s.count = diffDays === 1 ? s.count + 1 : 1;
  } else {
    s.count = 1;
  }
  s.lastDate = today;
}

function selectOption(idx) {
  const q = CURRENT_QUESTIONS[CURRENT_INDEX];
  if (CURRENT_ANSWERS.some(a => a.question.id === q.id)) return; // уже отвечен, заблокирован
  const isCorrect = idx === q.correct;

  if (!PROGRESS.stats[q.id]) PROGRESS.stats[q.id] = { shown: 0, correct: 0, lastWrong: false };
  PROGRESS.stats[q.id].shown += 1;
  if (isCorrect) PROGRESS.stats[q.id].correct += 1;
  PROGRESS.stats[q.id].lastWrong = !isCorrect;

  updateStreak();
  CURRENT_ANSWERS.push({ question: q, selected: idx });
  saveProgress(PROGRESS);
  saveActiveQuizState();
  render();
}

function prevQuestion() {
  if (CURRENT_INDEX > 0) {
    CURRENT_INDEX -= 1;
    saveActiveQuizState();
    render();
    window.scrollTo(0, 0);
  }
}

function nextQuestion() {
  if (CURRENT_INDEX + 1 < CURRENT_QUESTIONS.length) {
    CURRENT_INDEX += 1;
    saveActiveQuizState();
    render();
    window.scrollTo(0, 0);
  } else {
    PROGRESS.sessions.push({ block: CURRENT_KEY, date: new Date().toISOString(), score: CURRENT_ANSWERS.filter(a => a.selected === a.question.correct).length, total: CURRENT_ANSWERS.length });
    PROGRESS.activeQuiz = null;
    saveProgress(PROGRESS);
    VIEW = 'results';
    render();
  }
}

function saveActiveQuizState() {
  PROGRESS.activeQuiz = {
    ids: CURRENT_QUESTIONS.map(q => q.id),
    key: CURRENT_KEY,
    label: CURRENT_LABEL,
    index: CURRENT_INDEX,
    answers: CURRENT_ANSWERS.map(a => ({ id: a.question.id, selected: a.selected })),
    originView: ORIGIN_VIEW
  };
  saveProgress(PROGRESS);
}

function resumeActiveQuiz() {
  const aq = PROGRESS.activeQuiz;
  if (!aq || !aq.ids || aq.ids.length === 0) return;
  const byId = {};
  QUESTIONS.forEach(q => { byId[q.id] = q; });
  CURRENT_QUESTIONS = aq.ids.map(id => byId[id]).filter(Boolean);
  if (CURRENT_QUESTIONS.length === 0) return;
  CURRENT_KEY = aq.key;
  CURRENT_LABEL = aq.label;
  CURRENT_INDEX = Math.min(aq.index, CURRENT_QUESTIONS.length - 1);
  CURRENT_ANSWERS = aq.answers.map(a => ({ question: byId[a.id], selected: a.selected })).filter(a => a.question);
  ORIGIN_VIEW = aq.originView || 'dashboard';
  LAST_QUIZ_ARGS = null;
  VIEW = 'quiz';
  render();
}

// ---------------------------------------------------------------------------
// Инициализация
// ---------------------------------------------------------------------------
(async function init() {
  render();
  initVoicesListener();
  PROGRESS = await loadProgress();
  VIEW = 'dashboard';
  render();
})();
</script>
