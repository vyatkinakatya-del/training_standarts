ем боковом освещении — в расчётной точке в центре помещения, на пересечении вертикальной плоскости характерного разреза и рабочей поверхности.\n\n**Расчётная точка различается по типу помещения:**\n- **Жилая комната** — 1 м от стены, наиболее удалённой от проёмов: в одной комнате для 1–3-комнатных квартир, в двух — для 4-комнатных и более\n- **Кухня** — в **центре** помещения (не от стены!)\n- **Учебное помещение** — 1,2 м от дальней стены (не 1 м, как в жилой комнате)\n\n**Рабочие помещения (кабинет, класс) — не жилые:** на рабочей поверхности, на заданной высоте, в характерной зоне работы людей — это и есть **условная рабочая поверхность (УРП) = 0,8 м от пола**.\n\n---\n\n## Последовательность расчёта КЕО — пошагово (на примере Барнаул, корп.2)\n\n1. **Определить нормируемое eН** по типу помещения — прил.Л, табл.Л.1 СП52.13330 → для жилой комнаты **eН = 0,5%**\n2. **Привести к региону**: eN = eН·m, где m — коэффициент светового климата по табл.5.1 (зависит от региона и ориентации проёма) → 0,5 × 0,9 = 0,45 ≈ **eN = 0,5%**\n3. **Определить расчётную точку** по типу помещения (см. таблицу выше) → для жилой комнаты: 1 м от дальней стены\n4. **Собрать геометрию**: глубина помещения dп = 4 м, высота верхней грани проёма h01 = 1,5 м → dп/h01 = 2,7; предварительная относительная площадь проёма Ас.о/Ап = 13,5%\n5. **Определить ρср** — средневзвешенный коэффициент отражения поверхностей (минимум 0,55 для жилых/общественных — п.5.10 СП52)\n6. **Наложить графики Данилюка** — график I на разрез, график II на план; подсчитать число лучей: n1=6, n2=7 (от неба); n′1=6, n′2=17 (от противостоящего здания)\n7. **Вычислить геометрические составляющие**: εб = 0,01·n1·n2, εзд = 0,01·n′1·n′2\n8. **Определить средневзвешенный ρср** — не единой цифрой «минимум 0,55», а **через реальные площади поверхностей** помещения (потолок/стены/пол) с их коэффициентами отражения:\n   > ρср = (0,7·Sпотолок + 0,5·Sстены + 0,3·Sпол) / (Sпотолок+Sстены+Sпол)\n9. **Вычислить вспомогательные Z1 и Z2** (зависят от геометрии помещения и расстояния до расчётной точки lт, толщины наружной стены Δст):\n   > Z1 = (dп×(lт+Δст)) / ((B+lт+Δст)×h1); Z2 = (dп×(lт+Δст)) / ((B+lт+Δст)×h2) — где B — ширина помещения, h1/h2 — высоты границ проёма\n10. **Определить КЗДi** — коэффициент, учитывающий отношение расстояний до противостоящего здания:\n    > КЗДi = 1 + (bзд/bp − 1)·(εзд/(εб+εзд))\n11. **Вычислить расчётное значение**:\n    > eр = (εб·q + εзд·bф·КЗД)·r0·τo / Кз\n12. **Сравнить**: eр ≥ eN\n\n⚠️ Формулы шагов 7–11 (обозначения Б.1, Б.6, Б.9, Б.10 СП23-102-2003) — подтверждены дословно из реального расчёта (см. пример квартиры №6 ниже), но сам первоисточник СП23-102-2003 целиком не читался — только фрагменты, встречающиеся в практике.\n\n---\n\n### Дословный пример — квартира №6, БС-1 (Катунский промузел, с. Майма)\n\n| Параметр | Обозначение | Значение |\n|---|---|---|\n| Глубина помещения | dп | 3,6 м |\n| Высота верхней грани проёма над раб. поверхностью | h01 | 1,5 м |\n| Площадь пола | Ап | 14,87 м² |\n| Площадь светового проёма | Ас.о. | 5,4 м² |\n| Высота подоконника | hПД | 0,5 м |\n| Расстояние до расчётной точки | lт | 2,6 м |\n| Толщина наружной стены | Δст | 0,49 м |\n| ρср | — | 0,5 |\n| n1/n2 (от неба) | — | 4,6 / 26,5 |\n| n′1/n′2 (от здания) | — | 3,6 / 24 |\n\n**Формулы дословно:**\n> КЕОeN = eн·mN — eн=0,5% (норма), mN=0,9 (окно ориентировано на северо-восток — **mN проверяется по факту ориентации каждой конкретной квартиры, не берётся одним числом на весь дом**). КЕОeN = 0,5×0,9 = 0,45 ≈ 0,5%\n\n> εбj = 0,01×(4,6×26,5) = **1,22**\n\n> εЗДj = 0,01×(3,6×24) = **0,86**\n\n> Z1 = (27,12×(2,6+0,49)) / ((46,67+2,6+0,49)×3,38) = **0,5**\n> Z2 = (24,68×(2,6+0,49)) / ((46,67+2,6+0,49)×(1,8+0,5)) = **0,67**\n\n> ρср = (0,7×14,87 + 0,5×41,74 + 0,3×14,87) / (14,87+41,74+14,87) = **0,5**\n\n> КЗДi = 1 + (1,56−1)×(0,86/(1,22+0,86)) = **1,23**\n\n> εбh = (1,22×0,88 + 0,86×0,3×1,23) × 2,81×0,72 / 1,2 = **2,35%**\n\n**Итог:** «Нормируемое значение КЕО eN=0,5%, расчётное εбh=2,35%... обеспечивает требование по СанПиН 1.2.3685-21, табл.5.52» — прошло с запасом почти в 5 раз.\n\n---\n\n- **Отношение глубины помещения к высоте верхней грани светового проёма над полом** — для жилых помещений **не должно превышать 2,5**\n- **Коэффициент Кзд2** (затенение противостоящими зданиями для 1–2 этажа):\n\n| Глубина помещения, м | Кзд2 |\n|---|---|\n| 2–3 | 1,00 |\n| 3–4 | 0,75 |\n| 4–5 | 0,60 |\n| 5–6 | 0,50 |\n\n- **5 групп административных районов** по ресурсам светового климата (приложение Е СП52.13330) — определяют коэффициент светового климата CN, который входит в формулу расчёта КЕО\n- **Естественное освещение обязательно** для помещений с постоянным пребыванием людей. Допускается не предусматривать — для помещений временного пребывания, помещений по регламенту иных СП, и помещений, разрешённых в подвальных этажах\n\n---\n\n## Частичный расчёт площади помещения (только общественные здания!)\n\n**СП52, п.5.36:** допускается для помещений общественных зданий (кроме категорий из п.5.3 в–е) деление на зоны с достаточным и недостаточным естественным освещением. Глубина зоны с достаточным освещением определяется как **двойное расстояние от внутренней поверхности наружной стены** до расчётной точки (формула не проверена дословно полностью).\n\n⚠️ Это правило — **только для общественных зданий**, не для жилых.\n\n---\n\n## Открытые вопросы (не проверено дословно)\n- Полная формула глубины зоны достаточного освещения (п.5.36 СП52) — есть только часть\n- Полная таблица зон светового климата и соответствующих часов инсоляции по регионам (есть два конкретных примера — Краснодар/СПб — не вся таблица)\n- Первоисточник СП23-102-2003 целиком — формулы Z1/Z2/εб/εзд/КЗД подтверждены дословно из реальных расчётов (см. пример квартиры №6 выше), но сам документ целиком не читался\n\n---\n\n## Реальные примеры расчётов (из практики)\n\n### КЕО — три расчёта\n\n**Пример 1 — Барнаул, ул. Чернышевского 189, корп.1 (офис в жилом доме):**\neN=1,0% по прил.Л табл.Л.1, расчётная точка в центре помещения (п.5.3«ж»), dп/h01=2,32, Ао/Ап=30%. По графику Данилюка: n1=1,5, n2=40 → eб=1,26%.\n\n> [!warning] Найдено внутреннее противоречие в собственном расчёте\n> В начале указано eN=1,0%, а в итоговой строке — «eN=1,3%, eр=1,26%», и вывод сформулирован для «учебного помещения школы», хотя объект расчёта — офис в жилом доме. Похоже, документ собран из шаблона другого проекта (школы) без полной замены текста. **Хороший пример на защите** — как типичная ошибка при копировании старых расчётов, и что нужно перепроверять шаблон целиком, а не только цифры.\n\n**Пример 2 — Барнаул, ул. Чернышевского 189, корп.2 (жилая комната, 2 этаж):**\neN=eН·m=0,5·0,9=0,45≈0,5%, расчётная точка 1м от дальней стены, dп/h01=2,7, Ас.о/Ап=13,5%. По Данилюку: εб=0,42 (n1=6,n2=7), εзд=1,02 (n′1=6,n′2=17). Итог eр=1,46% при норме 0,5% — запас более чем трёхкратный.\n\n**Пример 3 — Новосибирск, ул. Тульская 74 (жилая комната, 2 этаж):**\neN=0,5% (0,5·0,9), dп/h01=1,7, Ас.о/Апола=22%. По Данилюку: n1=12,n2=26→εб=3,12; qi=0,91; r0=2,08; Кз=1,5; τo=0,72. Итог eр=(3,12·0,91)·2,08·0,72/1,5=2,8% при норме 0,5%.\n\n**Что показывают три расчёта вместе:**\n- Во всех — расчётная точка для жилых комнат берётся от дальней стены (не в центре) — п.5.3 в чистом виде\n- Итоговое eN для жилой комнаты стабильно ≈0,5% (0,5·0,9) в Алтайском крае/Сибири — удобное «типовое» значение для памяти, но требует пересчёта m при смене региона\n- Кз в примерах принимался по-разному (1,2 и 1,5) — стоит уметь объяснить разницу (тип остекления/условия эксплуатации), если спросят\n- Запас над нормой в жилых примерах значительный (3–5×) — типично для нового остекления; полезно объяснить, что это не «переизбыточное проектирование», а следствие геометрии + требований инсоляции/ЭЭ, которые часто определяют размер окна раньше, чем КЕО\n\n### Инсоляция — расчёт Томска, ул. Енисейская\n\nЖилой дом, секции 1–4, расчёт по инсоляционной линейке для Томска (апрель 2023), критичный 2 этаж. Вывод: нормативная продолжительность обеспечена на весь период 22.04–22.08 (центральная зона, табл.5.58 СанПиН 1.2.3685-21).\n\n| Квартира | Секция | Время инсоляции | Продолжительность |\n|---|---|---|---|\n| 1.2.1 | 1 | 7:58–11:26 | 3ч28мин |\n| 1.2.8 | 1 | 6:49–8:00; 9:28–10:48 | 2ч31мин (мин. запас) |\n| 4.2.6 | 4 | 8:20–10:20 | **2ч00мин — ровно на границе нормы** |\n\n⚠️ Квартира 4.2.6 — продолжительность ровно 2 часа, впритык к норме. Хороший практический пример: при плотной застройке норма часто выполняется не с запасом, а впритык — такие квартиры первыми попадают под риск при малейшем изменении окружающей застройки.\n\n**Объекты, где применялась личная методика расчёта инсоляции** (готовый ответ на «расскажите о вашем опыте»): Томск, квартал «Парапарк»; Барнаул, ул. Ленина 94а; ЖК «Павлов» (Барнаул); Катунский промышленный узел; Новосибирск, Каинская Заимка.\n\n**Про инструмент:** инсоляционная линейка для Алтайского края — разработана специализированным расчётно-аналитическим центром ООО «Инсоляция» (Москва) по заказу СРО А «СПАЗС». Это подтверждает: линейка — не абстрактный инструмент «для широты вообще», а конкретное калиброванное изделие под регион, получаемое от заказчика/СРО, а не вычерчиваемое самостоятельно.\n\n---\n\n## Связанные заметки\n[[СП 52.13330.2016]] · [[СП 367.1325800.2017]] · [[Пути эвакуации — жилые здания (Ф1.3)]] · [[Нормативная база — карта]]\n", "diagrams": []}]}, "6": {"name": "Звукоизоляция", "notes": [{"title": "Конспект-залп Звук", "file": "КОНСПЕКТ-ЗАЛП — Звук (Блок 6)", "md": "#нормативка #конспект #звукоизоляция #акустика\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — ЭЭ и теплозащита (Блок 7)]]\n\n# КОНСПЕКТ-ЗАЛП · Блок 6: звукоизоляция (СП51.13330.2011 / СП275.1325800.2016)\n\n**Документы:** [[СП 51.13330.2011]] (базовые нормы, допустимые уровни шума) · [[СП 275.1325800.2016]] (методика расчёта звукоизоляции конструкций)\n\n---\n\n## Область применения СП51.13330\n\nРаспространяется на **жилые, общественные и производственные здания, а также прилегающие территории** — то есть не только «внутри стен», но и генплан/шум на территории застройки.\n\n---\n\n## Базовые определения\n\n- **Воздушный шум** — шум, распространяющийся через воздух (речь, музыка, телевизор, а также работа инженерного оборудования и насосов) и вызывающий колебания ограждающей конструкции, которая переизлучает звук уже на другой стороне — именно для него нормируется индекс Rw\n- **Ударный шум** — отдельная категория, конкретно от ходьбы/ударов по перекрытию (передаётся через удар/контакт с конструкцией, а не по воздуху) — нормируется отдельным индексом Lnw\n\n⚠️ В нормируемой системе (СП51/СП275) всего **две** категории — воздушный и ударный шум. Термин «структурный шум» встречается в общей акустике как более широкое понятие (любые вибрации через конструкции), но отдельно не нормируется и не стоит вводить его как третью категорию — на защите это может звучать как путаница в терминах, а не как более глубокое знание.\n\n**«Плавающий пол»** — конструкция пола на упругом звукоизоляционном слое, без жёстких связей («звуковых мостиков») с несущей плитой и стенами — основной приём повышения индекса Lnw перекрытия (п.10.3.1 СП275.1325800.2016).\n\n**Звуковой мостик** — любая жёсткая связь между конструкциями по разные стороны звукоизолируемого узла (дюбель через упругую прокладку, необрезанная стяжка до стены без деформационного шва, необрезанный кабель-канал) — сводит на нет эффект дорогой многослойной/плавающей конструкции почти полностью. **Самая частая практическая ошибка** — не сама несущая плита, а именно такие мостики.\n\n---\n\n## Где нормируется звукоизоляция (полный список из аттестации)\n\n- Между жилыми комнатами и лестничными клетками\n- Между помещениями разного функционального назначения, если одно из них шумное\n- Между квартирами, а также между жилыми и общественными помещениями\n- Между помещениями, где уровень шума существенно различается по назначению\n\n**Вентиляционное оборудование рядом с помещениями постоянного пребывания людей** — обязательно шумоглушение и виброизоляция.\n\n---\n\n## Что учитывать при выборе ограждающей конструкции (все верны)\n\n- Массу и плотность материала конструкции\n- Требуемую звукоизоляцию по назначению помещений и типу шума\n- Конструкцию примыканий, слоистость, наличие звукопоглощающих материалов в полости\n\n**Общий принцип (закон массы):** чем тяжелее и плотнее однослойная конструкция — тем выше индекс изоляции воздушного шума Rw. Точная формула сложная (через эквивалентную поверхностную плотность и частотную характеристику) — для практики достаточно понимать направление зависимости, точный расчёт — по таблицам СП275.\n\n---\n\n## Расчёт поверхностной плотности — разобранный пример\n\nСтолбчатый график по слоям показан в чате.\n\n**Условие:** однослойная монолитная стена 200 мм (2500 кг/м³) + штукатурка с двух сторон по 20 мм (950 кг/м³).\n\n**Формула:** Σ (толщина слоя, м × плотность слоя, кг/м³) по всем слоям\n\n> 0,02×950 + 0,2×2500 + 0,02×950 = 19 + 500 + 19 = **538 кг/м²**\n\nЭто входной параметр для дальнейшего определения Rw по таблицам/графикам СП275 (через эквивалентную поверхностную плотность и частотную характеристику).\n\n---\n\n## Последовательность расчёта звукоизоляции — как считают в реальности (не по учебнику)\n\n> [!important] Главная поправка к «учебному» порядку\n> В «учебном» изложении метод оценочной кривой (раздел 6 СП275 — построение полной частотной характеристики R(f) по третьоктавным полосам, сдвиг эталонной кривой) выглядит как основной способ определения Rw. **На практике для типовых сплошных однослойных конструкций (плита, кирпичная/газобетонная стена) весь этот раздел пропускают целиком** и используют приближённую эмпирическую формулу (п.9.13 СП275, со ссылкой на более старую нумерацию СП23-103-2003 — «ориентировочные ускоренные методы»). Раздел 6 нужен только для сложных многослойных/составных конструкций, где эмпирической формулы нет.\n\n**Реальный порядок для воздушного шума (стена/перекрытие):**\n1. Определить нормируемый Rw по табл.2 СП51.13330 (или табл.1 СП275 — см. расхождение выше) — по паре помещений\n2. Определить коэффициент **K** — зависит от материала (не от толщины): K=1,00 для тяжёлого бетона, K=1,60 для газобетона\n3. Вычислить поверхностную плотность **mп = ρ×h**\n4. Получить эквивалентную плотность **mэ = mп×K** — этот шаг часто не прописан отдельной строкой, эквивалентная плотность просто подставляется в формулу готовой (легко упустить при сверке шаг в шаг)\n5. Подставить в эмпирическую формулу: **Rw = 37·lg(mэ) + 55·lg(K) − 43**\n6. Сравнить с нормой. **Если Rw ≥ Rw норм — «далее расчёт не производим»** — как только приближённая формула прошла с запасом, детальный расчёт по разделу 6 не делают вообще. Это явное практическое решение, не пропуск/недоработка\n\n**Реальный порядок для ударного шума перекрытия (отдельная, непохожая методика):**\n1. Поверхностная плотность голой плиты (без пирога пола)\n2. По табл.18 СП23-103-2003 — базовый **Lnw0** для голой плиты по её плотности\n3. Норма Lnw — по табл.3 СП51.13330\n4. Рассчитать **требуемое улучшение**: ΔLnw норм = Lnw0 − Lnw норм (сколько ещё нужно «выиграть» пирогом пола)\n5. Подобрать конкретный пирог пола (стяжка + звукоизоляционная плита) и взять его реальное ΔLnw **не расчётом, а по паспортным данным производителя** («определяется по результатам натурных испытаний») — эффективность конкретного утеплителя не выводится формулами, берётся готовой из документации на материал\n6. **Lnw факт = Lnw0 − ΔLnw**, сравнить с нормой\n\n⚠️ Разница между воздушным и ударным шумом принципиальная: для воздушного — расчёт по эмпирической формуле от плотности; для ударного — расчёт голой плиты + табличное улучшение от пирога пола из паспорта производителя, а не из формулы.\n\n---\n\n## Реальный пример (проект «Шумакова», перекрытие + 2 варианта стены)\n\n| Конструкция | h | Материал | ρ, кг/м³ | K | mп, кг/м² | mэ, кг/м² | Rw факт | Rw норм | Итог |\n|---|---|---|---|---|---|---|---|---|---|\n| Перекрытие (возд. шум) | 0,2 м | Тяжёлый бетон | 2400 | 1,00 | 480 | 480 | **56 дБ** | 52 дБ | ✅ Rw факт > Rw норм |\n| Стена 300 мм | 0,3 м | Газобетон | 700 | 1,60 | 210 | 336 | **62 дБ** | 52 дБ | ✅ с запасом |\n| Стена 400 мм | 0,4 м | Газобетон | 700 | 1,60 | 280 | 448 | **66 дБ** | 52 дБ | ✅ с ещё большим запасом |\n\n**Формула дословно, как в файле:** «Rw = 37 × lg(mэ) + 55 × lg(K) − 43»\nПроверка для перекрытия: 37×lg(480,00) + 55×lg(1,00) − 43 = **56 дБ**. Пример стены 300мм: mп=210,00 → mэ=336,00 (210×1,6) → 37×lg(336,00)+55×lg(1,60)−43 = **62 дБ**.\n\n**Ударный шум того же перекрытия:** Lnw0 = 75 дБ (по плотности голой плиты 480 кг/м²) → Lnw норм = 60 дБ → требуемое ΔLnw норм = 15 дБ → выбран пирог (финишная отделка 20мм + стяжка 55мм + плита ФЛОР БАТТС Rockwool 25мм) с паспортным ΔLnw = 37 дБ → Lnw факт = 75−37 = **38 дБ** — прошло с большим запасом (38 < 60).\n\n---\n\n## Если звукоизоляция стены не прошла расчёт — что делать\n\n- Увеличить массу стены и/или сделать конструкцию многослойной\n- Увеличить толщину стены\n- Найти сертификат на конструкцию, подтверждающий соответствие нормативным требованиям (альтернатива расчёту)\n\n---\n\n## ⚠️ Обнаружено расхождение между двумя основными документами\n\nПри сверке таблиц норм СП51.13330.2011 (табл.2, с Изм.№1,2,4) и СП275.1325800.2016 (табл.1, с Изм.№1 от 2022г.) найдено несовпадение по ряду позиций. Оба документа в разделе «Область применения» СП275 указывают, что нормируемые значения задаёт именно СП51 («методы оценки соответствия... строительным нормам, приведённым в СП51.13330.2011») — поэтому при конфликте разумно ориентироваться на действующую редакцию СП51, но **однозначного решения без сверки актуального статуса обоих документов дать нельзя**.\n\n| Позиция | СП51.13330.2011, Rw/Lnw | СП275.1325800.2016, Rw/Lnw |\n|---|---|---|\n| Перекрытия между кв. и перекрытия к холлам/лестницам | 52 / 60 | 52 / 60 (совпадает) |\n| Перекрытия между кв. и магазинами под ними | 57 / 60 | 55 / 60 |\n| Перекрытия между кв. и рестор./кафе/спортзалами под ними | 60 / 58 | 57 / 63 |\n| Перекрытия между кв. и офисами/адм. помещениями под ними | 52 / 63 | 52 / 63 (совпадает) |\n| Стены между квартирами / кв.–офис / кв.–лестница | 52 / — | 52 / — (совпадает) |\n| Стены между помещениями квартир и магазинами | 57 / — | 55 / — |\n| Перегородки без дверей между комнатами, кухня–комната | 41 / — | 43 / — |\n| Перегородки между санузлом и комнатой одной квартиры | 43 / — | 47 / — |\n\n> [!warning] Если спросят на защите: «вы нашли расхождение — как поступите?»\n> Честный ответ — сверить актуальный статус обеих редакций (какая свежее на дату проекта) и при сомнении закладывать **более строгое** из двух значений — это не ошибка, а разумный запас прочности перед экспертизой.\n\n---\n\n## Поправка на натурные условия (СП51, табл.5)\n\nРасчётный/лабораторный индекс изоляции воздушного шума в реальных условиях **всегда ниже** из-за косвенной передачи звука (через примыкания, монтажные дефекты):\n\n| Индекс в лабораторных условиях, дБ | Уменьшающая поправка, дБ |\n|---|---|\n| ≤45 | 0 |\n| 46–50 | 1 |\n| 51–55 | 2 |\n| 56–61 | 3 |\n| ≥62 | 4 |\n\nПри расчёте (не измерении) — среднестатистическая поправка **2 дБ**, если точная величина непредсказуема.\n\n---\n\n## Ключевые термины (для точности формулировок)\n\n- **Изоляция воздушного шума, R** — величина в дБ = 10·lg отношения падающей на конструкцию звуковой энергии к прошедшей через неё; это **сырая величина**, зависящая от частоты (не одно число)\n- **Индекс изоляции воздушного шума Rw** — оценка звукоизолирующей способности **одним числом**, через сопоставление частотной характеристики R(f) с оценочной кривой. Это то, что нормируется и указывается в проекте — не путать R и Rw\n- **Индекс приведённого уровня ударного шума Lnw** — то же самое, но для оценки ударного шума через перекрытие\n- **Частотная характеристика** — значения изоляции в третьоктавных полосах (100–3150 Гц) или октавных (125–4000 Гц)\n\n**Наружные ограждения (окна) со стороны транспортного шума** — отдельно определяется индекс **Rтр,А** по формуле с эталонным спектром транспортного потока (раздел 7 СП275.1325800.2016), сравнивается с требуемым значением, определяемым расчётом по эквивалентному/максимальному уровню внешнего шума (раздел 8). Это отдельный от жилой звукоизоляции расчёт — учитывает шум снаружи, а не между соседями.\n\n---\n\n## Методика расчёта по типу конструкции (раздел 9 СП275.1325800.2016)\n\n| Тип конструкции | Пункт |\n|---|---|\n| Однослойное тяжёлое (бетон, кирпич) | 9.1 |\n| Однослойное тонкое (металл, стекло, ГКЛ) | 9.2 |\n| Двухслойное с воздушным промежутком | 9.3–9.4 |\n| С заполнением промежутка пористым материалом | 9.5 |\n| С гибкой облицовкой на относе | 9.6 |\n| Тип «сэндвич» | 9.8 |\n| Составные (стена с окном/дверью) | 9.9 |\n| Перекрытие «плавающий пол» | 9.11 |\n| Ударный шум под перекрытием с упругим слоем | 9.12 |\n\n**Определение индекса из готовой частотной характеристики** (раздел 6): метод сопоставления с оценочной кривой — сдвигать эталонную кривую, пока сумма неблагоприятных отклонений не станет максимально близкой к 32 дБ, не превышая его; значение индекса — ордината смещённой кривой на частоте 500 Гц.\n\n**Узлы примыканий инженерных систем** (п.10.5.1) — стояки отопления/водоснабжения через перекрытия и стены должны идти в эластичных гильзах, не жёстко, иначе труба сама становится звуковым мостиком.\n\n**Шумные помещения под жильём** (рестораны, спортзалы) — п.10.3.3 допускает либо усиленную конструктивную изоляцию, либо буферный (технический) этаж между ними и жильём.\n\n⚠️ Старый предшественник СП275 — **СП23-103-2003** (упоминается в материалах, но актуальной методикой считаться не может — полезно знать генеалогию документа, если спросят «а что было раньше»).\n\n---\n\n## Реальные примеры\n\nПроект «Шумакова» (шифр Д31-23) — 4 расчёта подряд в одном приложении: перекрытие (возд.+ударный шум), стена 300мм и 400мм газобетон. Полные цифры — в разделе выше. Все четыре конструкции прошли с запасом, детальный расчёт по разделу 6 не понадобился ни разу — везде хватило приближённой формулы.\n\n---\n\n## Открытые вопросы (не проверено дословно)\n- Полная формула метода оценочной кривой (раздел 6) — на практике почти не применяется для типовых конструкций (см. выше), но для сложных составных случаев всё ещё может понадобиться, а дословный алгоритм сдвига кривой не проверен по первоисточнику\n- Точные формулировки примечаний к позициям 2/5/8/11 в таблицах СП51 vs СП275 (условия применения — например, про громкую музыку — немного отличаются в двух документах)\n- Формула Rтр,А для окон от транспортного шума (раздел 7 СП275) — не проверена дословно, только упомянут факт её существования\n\n---\n\n## Связанные заметки\n[[СП 51.13330.2011]] · [[СП 275.1325800.2016]] · [[КОНСПЕКТ-ЗАЛП — ЭЭ и теплозащита (Блок 7)]] · [[Нормативная база — карта]]\n", "diagrams": []}]}, "7": {"name": "Энергоэффективность", "notes": [{"title": "Конспект-залп ЭЭ и теплозащита", "file": "КОНСПЕКТ-ЗАЛП — ЭЭ и теплозащита (Блок 7)", "md": "#нормативка #конспект #энергоэффективность #теплозащита\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[КОНСПЕКТ-ЗАЛП — КЕО и инсоляция (Блок 5)]]\n\n# КОНСПЕКТ-ЗАЛП · Блок 7: энергоэффективность и теплозащита (СП50.13330.2024)\n\n**Документ:** [[СП 50.13330.2024]] (введён 16.06.2024) — самый расчётный из всех блоков, требует последовательной цепочки формул (см. диаграмму выше). Документ-спутник — **СП345.1325800.2017** «Здания жилые и общественные. Правила проектирования тепловой защиты» — детализация методики СП50 для конкретных узлов и условий эксплуатации А/Б, на который СП50 многократно ссылается (п.5.2, 8.5.3, 10.2).\n\n---\n\n## Полная последовательность расчёта — от климата до энергопаспорта\n\n```mermaid\nflowchart TD\n    A[\"Климатические данные<br/>tот, zот по СП131.13330\"] --> B[\"ГСОП<br/>(tв − tот) × zот\"]\n    B --> C[\"Требуемое сопротивление Rтр<br/>Rтр = a·ГСОП + b (табл.3)\"]\n    C --> D[\"Сопротивление утеплителя<br/>R утепл = Rтр − R прочих слоёв\"]\n    D --> E[\"Толщина слоя<br/>δ = R утепл × λ утепл\"]\n    E --> F[\"Минимальная толщина<br/>округление в большую сторону\"]\n```\n\n**Шаги 1–5 (поэлементная подготовка, показаны на диаграмме):**\n1. **Климатические данные** — на практике **не вычисляются вручную, а копируются целой строкой** из табл.3.1 СП131.13330.2020 (в реальном файле расчёта буквально комментарий «скопировать из СП и вставить соответствующую строку»)\n2. **ГСОП** = (tв − tот) × zот → пример Екатеринбург: (20−(−5,5))×220 = **5610 °C·сут/год**\n3. **Требуемое сопротивление теплопередаче Rтр** = a·ГСОП + b (табл. 3 СП50) → для стены: 0,00035×5610+1,4 = **3,36 (м²·°С)/Вт**\n4. **Сопротивление утеплителя** = Rтр минус сопротивление остальных слоёв конструкции (считать по наихудшему/определяющему слою) → пример: 3,2−0,13 = **3,07 (м²·°С)/Вт**\n5. **Толщина** = R утеплителя × λ утеплителя, округление **в большую сторону** → 3,07×0,038 = 0,116м → **120 мм**\n\n**Шаги 6–9 (проверка здания в целом — идут дальше, после подбора толщины утеплителя каждой конструкции):**\n6. **Поэлементная проверка** — для КАЖДОЙ ограждающей конструкции (стена, окно, покрытие) отдельно: фактическое R0 (с учётом мостиков холода, прил.Г) ≥ нормируемого Rnorm0 = Rreq0·mр\n7. **Комплексная проверка** — рассчитать qот(р) = kоб + kвент − βКПИ·(kбыт+kрад) (формула Б.1, прил.Б) и сравнить с нормируемым qтр от по табл.14/15; для ГСОП≥8000 норматив снижается на 5%\n8. **Санитарно-гигиеническая проверка** — температура внутренней поверхности конструкций (особенно в узлах — прил.И), точка росы должна быть в наружном слое/утеплителе\n9. **Оформить энергетический паспорт** (прил.В) — все показатели + класс энергоэффективности (шкала классов — отдельный акт, не в СП50)\n\n⚠️ Все три проверки (поэлементная, комплексная, санитарно-гигиеническая) — **обязательная связка**, не альтернативы на выбор (п.5.1 СП50).\n\n---\n\n## Термины (формальные определения)\n\n- **Тепловая защита здания** (п.3.19) — совокупность теплофизических/теплоэнергетических характеристик элементов здания, обеспечивающих безопасную эксплуатацию по тепловому режиму и экономное расходование энергоресурсов\n- **Приведённое сопротивление теплопередаче R0** — способность конструкции сопротивляться прохождению тепла, **с учётом теплопроводных включений** (мостиков холода) — не путать с сопротивлением однородного материала без мостиков\n- **Энергетическая эффективность материала слоя теплоизоляции, ε** (п.10.2, формула 10.2) — отношение полезного эффекта от материала (в т.ч. в деньгах) к затратам на его использование за срок эксплуатации. Применяется **только для сравнения материалов внутри одной конструкции**, не как абсолютный показатель\n\n### Условия эксплуатации А и Б — важная практическая деталь\n\nДва расчётных режима влажности/теплопроводности материалов (табл.1–2 СП50), определяемые по **влажностному режиму помещения** и **зоне влажности района строительства**. От выбора режима зависит, какое значение теплопроводности материала брать в расчёт — **λА или λБ** (у одного и того же материала они разные — влажный материал хуже держит тепло). Ошибка в выборе режима А/Б — частая практическая проблема, дающая заниженную/завышенную требуемую толщину утеплителя.\n\n### Карта разделов СП50.13330.2024 (что где искать)\n\n| Раздел/приложение | Содержание |\n|---|---|\n| Разд.6 | Теплоустойчивость ограждающих конструкций |\n| Разд.7 | Воздухопроницаемость ограждающих конструкций |\n| Разд.8 | Защита от переувлажнения |\n| Разд.9 | Теплоусвоение поверхности полов |\n| Прил.А | Карта зон влажности территории России |\n| Прил.Г | Расчёт приведённого сопротивления теплопередаче фрагмента (мостики холода) |\n| Прил.И | Пример расчёта температурных полей узла фасада |\n| Прил.М | Расчётные теплотехнические показатели материалов |\n\n---\n\n## 1. ГСОП (градусо-сутки отопительного периода)\n\n**Формула (СП50, п.5.2):**\n> ГСОП = (tв − tот) · zот\n\nГде:\n- **tв** — расчётная температура внутреннего воздуха (для жилых/гостиниц — минимальные значения оптимальной температуры по ГОСТ 30494, обычно **20°C**)\n- **tот** — средняя температура наружного воздуха за отопительный период (по СП131.13330)\n- **zот** — продолжительность отопительного периода, сут/год (период со среднесуточной температурой ≤8°C, для ДОО/школ/медицины/интернатов — ≤10°C)\n\n### tв — не одна цифра на всё здание, а разная по типу помещений\n\n> [!important] Частая практическая ошибка — считать tв=20°C для всего дома\n> На практике расчётная температура внутреннего воздуха берётся **отдельно по каждому типу помещений**, не одним числом:\n\n| Тип помещения | tв, °C | Источник |\n|---|---|---|\n| Жилая комната | 21 | ГОСТ 30494-2011, табл.1 |\n| Межквартирный коридор | 18 | — |\n| Вестибюль/лестничная клетка | 16 | — |\n| Помещения 2 категории (офисы/ритейл) | 19 | ГОСТ 30494, табл.3 |\n| Техническое пространство чердака | 15 | СП345.1325800.2017, п.11.1.1 |\n| Тамбур/паркинг/кладовые | 5 | принимается проектом |\n\nРеальный ГСОП здания считается по tв жилых помещений (21°C, не «стандартные» 20°C из учебного примера) — небольшая, но заметная разница, которая меняет итоговое значение ГСОП.\n\n### Разобранный пример — Екатеринбург\n\nПо данным СП131.13330 (табл. 3.1): средняя температура отопительного периода **tот = −5,5°C**, продолжительность **zот = 220 суток**.\n\nПри tв = 20°C (жилое здание):\n> ГСОП = (20 − (−5,5)) × 220 = 25,5 × 220 = **5610 °C·сут/год**\n\n⚠️ Климатические данные по Екатеринбургу взяты из внешнего источника, цитирующего таблицу СП131.13330 — сам документ не в нашей базе, при подготовке к защите стоит свериться напрямую.\n\n**Справочно (для калибровки ощущения величин):** все 15 городов-миллионников РФ лежат в диапазоне ГСОП примерно от 3337 (Ростов-на-Дону) до 6454 (Красноярск) °С·сут.\n\n---\n\n## Реальный пример целиком — ЖК «ДКЖ», корпус К21 (Пермь)\n\nМногоквартирный жилой дом 7–10 этажей, 4 секции, 266 квартир. Энергетический паспорт + файл расчёта, 2025 год.\n\n**Ключевые входные параметры:**\n\n| Параметр | Обозначение | Значение |\n|---|---|---|\n| Расч. температура наружного воздуха | tн | −35 °C |\n| Средняя темп. наружного воздуха за отоп. период | tот | −5,4 °C |\n| Продолжительность отопительного периода | zот | 225 сут/год |\n| ГСОП (при tв=21°C жилых) | — | **5940 °С·сут/год** |\n| Отапливаемая площадь | Aот | 19 392,66 м² |\n| Отапливаемый объём | Vот | 57 305,30 м³ |\n| Коэффициент остеклённости фасада | f | 0,36 |\n| Показатель компактности здания | Kкомп | 0,31 |\n\n### Дополнительный шаг, которого нет в базовой последовательности — помесячная таблица солнечной радиации\n\nkрад берут не одной цифрой на всё здание, а **отдельной таблицей теплопоступлений от солнечной радиации по каждому месяцу отопительного периода и по каждой ориентации фасада** (СЗ/СВ/ЮВ/ЮЗ) — СП131.13330.2020, табл.9.1.\n\n### Формулы дословно (лист «РАСЧЁТ» реального файла, со ссылками на пункты СП50 прямо в файле)\n\n**ГСОП (формула 5.2):** ГСОП=(tв–tот)·zот\n\n**Требуемое R для стен (формула 5.3):**\n> Rтр = (0,00035·ГСОП + 1,4) · mр\n\n**Для покрытий/перекрытий над проездами:**\n> Rтр = (0,0005·ГСОП + 2,2) · mр\n\n**Для чердачных перекрытий/над подвалами:**\n> Rтр = (0,00045·ГСОП + 1,9) · mр\n\n**Для наружных входных дверей (формула 5.4, не менее 0,6 от Rнорм стен):**\n> Rтр,дверь = Rтр,стена · 0,6 · (tв−tн) / (8,7×4)\n\n**Для окон — интерполяцией между табличными точками (X0=4000, Y0=0,63; X1=6000, Y1=0,73):**\n> Rтр,окно = Y0 + ((Y1−Y0)×(ГСОП−X0)) / (X1−X0)\n\n**Приведённое сопротивление с учётом типа фасада:**\n> Rпр = R0усл × r — где r — коэффициент по СТО 00044807-001-200, табл.8 (для вентфасада на кронштейнах **r=0,8**)\n\n**Нормируемая удельная теплозащитная характеристика (формула 5.5):**\n> kоб,норм = (0,16 + 10/√Vот) / (0,00013·ГСОП + 0,61)\n\n**Альтернативная формула (5.6):**\n> kоб,норм = 8,5/√ГСОП\n\n### Итоговый результат (энергетический паспорт)\n\n| Показатель | Норм. значение | Расчётное значение |\n|---|---|---|\n| Удельная теплозащитная характеристика kоб | 0,146 | **0,132** |\n| Удельная характеристика расхода тепловой энергии qот р | — | **0,140** |\n| Нормируемая qот тр | — | **0,241** |\n| Класс энергосбережения | — | **А (Очень высокий)** |\n\nЗапас по qот — почти в 1,7 раза (0,140 против допустимых 0,241).\n\n### Откуда берётся класс энергоэффективности — источник найден\n\n**Документ:** Приказ Минстроя России от 06.06.2016 №399/пр «Об утверждении Правил определения класса энергетической эффективности многоквартирных домов» (зарегистрирован в Минюсте 08.08.2016 №43169) — заменил более старый приказ Минрегиона №161 от 2011 года.\n\n**Структура шкалы:** классы обозначаются латинскими буквами **от «G» (самый низкий) до «A++» (самый высокий)**, всего 9 классов. Определяется по величине **отклонения** фактического/расчётного удельного годового расхода энергоресурсов от базового показателя (не от значений СП50 напрямую — это отдельный, специфичный для приказа расчёт).\n\n**Подтверждение класса после ввода в эксплуатацию:**\n- Обычные классы — подтверждаются не позднее чем за 3 месяца до истечения **5 лет** со дня ввода дома в эксплуатацию\n- Наивысшие классы (**B, A, A+, A++**) — дополнительно подтверждаются не позднее чем за 3 месяца до истечения **10 лет**\n\n⚠️ Точная таблица «% отклонения → конкретная буква» — не найдена дословно при проверке, только подтверждена структура (диапазон G→A++, 9 классов, привязка к отклонению от базового показателя). Если понадобятся точные пороговые проценты — сверить по тексту самого приказа №399/пр, таблица №2.\n\n---\n\n### ⚠️ Реальная история изменения решения — состав стены менялся по факту расчёта\n\nСтена Тип 8 (внешняя монолитная стена типового этажа, вентфасад, самая массовая по площади — 1442,88 м²): облицовка (кирпич/металлокассеты 85мм) + воздушный зазор 30мм + минераловатный утеплитель ТЕХНОВЕНТ СТАНДАРТ (ρ=80 кг/м³, λ=0,038) + монолитная ж/б стена 200мм.\n\n**В более раннем документе (апрель 2025) та же стена числилась с утеплителем 150 мм**, а в финальном файле расчёта (сентябрь 2025) — уже **200 мм**. Толщину утеплителя увеличили по факту теплотехнического расчёта, уже после того, как архитектурное решение было изначально заложено. **Хороший практический пример для собеседования** — энергорасчёт не просто подтверждает состав стены, а может задним числом его корректировать, и архитектору нужно закладывать в АР финальную (после расчёта) толщину, а не первоначальную.\n\n---\n\n## 2. Требуемое сопротивление теплопередаче — табл. 3 СП50\n\nДля категории **1.1 (жилые, гостиницы, общежития)**:\n\n| ГСОП | Стены | Покрытия/перекрытия над проездами | Чердачные/над подвалами | Окна | Фонари |\n|---|---|---|---|---|---|\n| 2000 | 2,1 | 3,2 | 2,8 | 0,49 | 0,3 |\n| 4000 | 2,8 | 4,2 | 3,7 | 0,63 | 0,35 |\n| 6000 | 3,5 | 5,2 | 4,6 | 0,73 | 0,4 |\n| 8000 | 4,2 | 6,2 | 5,5 | 0,75 | 0,45 |\n| **a** | 0,00035 | 0,0005 | 0,00045 | — | 0,000025 |\n| **b** | 1,4 | 2,2 | 1,9 | — | 0,25 |\n\n**Формула интерполяции для ГСОП, не совпадающего с табличным:**\n> Rтр = a · ГСОП + b\n\nДля нашего примера (ГСОП=5610, стены жилого дома):\n> Rтр = 0,00035 × 5610 + 1,4 = 1,9635 + 1,4 = **3,36 (м²·°С)/Вт**\n\n---\n\n## 3. Разобранный пример расчёта толщины утеплителя (из аттестации)\n\n**Условие:** конструкция — керамический блок (λ=0,18 Вт/(м·°C)) или монолит (λ=1,92 Вт/(м·°C)), утеплитель λ=0,038 Вт/(м·°C), требуемое R=3,2 (м²·°С)/Вт.\n\n**Решение (считаем по наихудшему варианту — монолит, так как он хуже держит тепло):**\n1. R конструкции = 0,25 / 1,92 = 0,13 (м²·°С)/Вт\n2. R утеплителя = 3,2 − 0,13 = 3,07 (м²·°С)/Вт\n3. Толщина = 3,07 × 0,038 = 0,116 м\n4. **Толщина минимальная = 120 мм** (округление в большую сторону)\n\n⚠️ Ключевой методический момент — считать **по наихудшему из вариантов** конструкции (там, где несущий элемент хуже держит тепло), а не по среднему.\n\n---\n\n## 4. Точка росы\n\nДолжна располагаться **в наружном слое конструкции, желательно в утеплителе, ближе к улице** — если точка росы окажется внутри несущей части или на границе слоёв не в утеплителе, конструкция может накапливать влагу и разрушаться (циклы замерзания/оттаивания конденсата).\n\n---\n\n## 5. Теплозащитная оболочка здания — требования\n\nДолжна соответствовать **элементным, комплексным и санитарно-гигиеническим** требованиям одновременно:\n- **Элементные** — каждый отдельный элемент (стена, окно, покрытие) не хуже нормируемого R\n- **Комплексные** — здание в целом (удельная теплозащитная характеристика, показатель компактности)\n- **Санитарно-гигиенические** — температура внутренней поверхности, влажностный режим, отсутствие конденсации\n\n---\n\n## 6. Показатель компактности здания\n\nВлияющие параметры (все три отмечены как верные в реальном вопросе аттестации):\n- Площадь наружных ограждающих конструкций\n- Отапливаемый объём здания\n- Конфигурация плана здания\n\n**Определение (СП50):** отношение общей площади внутренней поверхности наружных ограждающих конструкций к заключённому в них отапливаемому объёму. Чем компактнее форма (меньше отношение площади к объёму) — тем меньше теплопотерь при прочих равных.\n\n---\n\n## 6а. Комплексное требование — удельная характеристика расхода тепловой энергии qот\n\nЭто **главный итоговый показатель энергоэффективности здания в целом** (не отдельной конструкции), формула (Б.1, приложение Б СП50) — дословно, «Расчётную удельную характеристику расхода тепловой энергии на отопление и вентиляцию здания qот р, Вт/(м³·°C), следует определять по формуле»:\n\n> qот р = kоб + kвент − βКПИ(kбыт + kрад)\n\nГде:\n- **kоб** — удельная теплозащитная характеристика здания (через все R0 конструкций, приложение Д)\n- **kвент** — удельная вентиляционная характеристика здания\n- **kбыт** — удельная характеристика внутренних теплопоступлений здания\n- **kрад** — удельная характеристика теплопоступлений в здание от солнечной радиации\n- **βКПИ** — коэффициент полезного использования теплопоступлений (формула Б.2)\n\n### βКПИ дословно (формула Б.2)\n\n> βКПИ = Kрег/(1 + 0,5·nв)\n\nГде **Kрег** — коэффициент эффективности регулирования подачи теплоты в системах отопления, рекомендуемые значения (табл. в самом СП50):\n\n| Система отопления | Kрег |\n|---|---|\n| С местными терморегуляторами + пофасадное авторегулирование на вводе | 0,95 |\n| С местными терморегуляторами + центральное авторегулирование на вводе | 0,9 |\n| Без местных терморегуляторов + пофасадное авторегулирование | 0,85 |\n| С местными терморегуляторами, без авторегулирования на вводе | 0,8 |\n| Без местных терморегуляторов + центральное авторегулирование на вводе | 0,7 |\n| Без местных терморегуляторов и без авторегулирования на вводе | 0,6 |\n\n**nв** — средняя кратность воздухообмена здания за отопительный период, ч⁻¹.\n\n### kвент дословно (формула Б.3, Б.4)\n\n> kвент = 0,28·c·(Lвент·ρввент·nвент·(1−kэф) + Gинф·nинф) / (168·Vот)\n\nГде **c** — удельная теплоёмкость воздуха (1 кДж/(кг·°C)), **ρввент** — средняя плотность приточного воздуха за отопительный период (формула Б.4):\n\n> ρввент = 353 / [273 + tот]\n\n⚠️ Формулы Б.1–Б.4 теперь подтверждены дословно (текст самого приложения Б СП50.13330.2024). Остальные переменные внутри (Lвент, kэф, Gинф, nинф) — их точные определения по-прежнему не проверены отдельно.\n\n**Критерий соответствия (формула 10.1):** qот(р) ≤ qтр от (нормируемое значение по табл.14 — малоэтажные одноквартирные, или табл.15 — многоквартирные/общественные, по типу и этажности).\n\n⚠️ **Для регионов с ГСОП ≥ 8000 нормируемое значение снижается на 5%.**\n\n**Коэффициент региональных особенностей mр** (формула 5.1: Rnorm0 = Rreq0·mр) — по умолчанию 1, но может быть снижен **до 0,63 для стен / 0,80 для прочих конструкций / 1,00 для светопрозрачных**, при условии, что комплексное требование по qот всё равно выполняется. Это даёт гибкость — можно чуть ослабить требование к стене, если в целом здание всё равно проходит по балансу.\n\n**Прямая связка с КЕО/инсоляцией:** увеличение площади остекления улучшает освещённость, но ухудшает qот — этот компромисс явно упомянут в самой формуле через mр (для окон mр всегда 1,0, то есть остекление нельзя «облегчить» так же, как стену).\n\n---\n\n## 6б. Энергетический паспорт\n\nДокумент с энергетическими/теплотехническими/геометрическими характеристиками здания, подтверждающий соответствие нормам — обязательная часть раздела «Энергоэффективность» (приложение В СП50, форма из п.В.1–В.6).\n\n⚠️ **Важная оговорка про класс энергоэффективности:** класс (буквенная маркировка А++/А/В и т.д.) — обязательная строка паспорта (строка 27), но **сама шкала классов (какой процент отклонения соответствует какому классу) в СП50.13330.2024 не приведена** — задаётся отдельным нормативным актом (приказы Минстроя/Минэнерго), которого нет в базе. **Не называть номера классов по памяти на собеседовании без проверки актуальной редакции этого акта** — состав и пороги менялись со временем.\n\n---\n\n## 7. Класс энергетической эффективности — что входит в расчёт\n\n- Расчётная удельная характеристика расхода тепловой энергии на отопление и вентиляцию\n- Отклонение расчётного значения от нормативного\n- Отапливаемый объём здания\n\n## 8. Нормируемые показатели температуры помещений\n\nСмотреть в **ГОСТ 30494-2011** «Здания жилые и общественные. Параметры микроклимата» (не в СП50 напрямую).\n\n---\n\n## Открытые вопросы (не проверено дословно)\n- Полная таблица 3 СП50 для остальных категорий зданий (только жилые разобраны подробно)\n- Точная таблица «% отклонения → буква класса» из приказа №399/пр (таблица №2) — сам документ и структура шкалы (G→A++, 9 классов) подтверждены, но конкретные процентные пороги не проверены\n- Точные определения переменных Lвент, kэф, Gинф, nинф внутри формулы Б.3 — сама формула подтверждена дословно, но не все входящие в неё величины\n- Климатические данные СП131.13330 для городов, кроме Перми и Екатеринбурга — брать из первоисточника при необходимости\n\n---\n\n## Связанные заметки\n[[СП 50.13330.2024]] · [[КОНСПЕКТ-ЗАЛП — КЕО и инсоляция (Блок 5)]] · [[Нормативная база — карта]]\n", "diagrams": ["<svg viewBox=\"0 0 480 500\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans, sans-serif\">\n<defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4A6178\"/></marker></defs>\n<rect x=\"0\" y=\"0\" width=\"480\" height=\"500\" fill=\"#FAFBFC\"/>\n<rect x=\"20\" y=\"15\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"43.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Климатические данные (tот, zот) по СП131.13330</tspan></text><rect x=\"20\" y=\"99\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"127.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">ГСОП = (tв − tот) × zот</tspan></text><rect x=\"20\" y=\"183\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"211.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Требуемое сопротивление Rтр = a·ГСОП + b (табл.3)</tspan></text><rect x=\"20\" y=\"267\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"295.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Сопротивление утеплителя = Rтр − R прочих слоёв</tspan></text><rect x=\"20\" y=\"351\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"379.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Толщина слоя = R утепл × λ утепл</tspan></text><rect x=\"20\" y=\"435\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"463.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Минимальная толщина (округление вверх)</tspan></text><line x1=\"240.0\" y1=\"65\" x2=\"240.0\" y2=\"91\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"149\" x2=\"240.0\" y2=\"175\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"233\" x2=\"240.0\" y2=\"259\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"317\" x2=\"240.0\" y2=\"343\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"401\" x2=\"240.0\" y2=\"427\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/>\n</svg>"]}]}, "8": {"name": "Паркинг (СП113)", "notes": [{"title": "Конспект-залп Паркинг", "file": "КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)", "md": "#нормативка #конспект #паркинг\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]] · [[КОНСПЕКТ-ЗАЛП — Общественные здания (Блок 4)]]\n\n# КОНСПЕКТ-ЗАЛП · Блок 8: Паркинг (СП113.13330.2023)\n\n**Документ:** [[СП 113.13330.2023]] (введён 06.11.2023, с изм. №1 от 19.10.2024, №2 от 28.02.2025) — распространяется на стоянки автомобилей, микроавтобусов, мототранспорта и СИМ; **не распространяется** на гаражи с ТО/ремонтом, стоянки авто массой >3,5т, авто на водороде/сжиженном газе.\n\n---\n\n## Расчёт длины рампы — логика\n\n**Термины, которые легко упустить:**\n- **Перепад высот между этажами** — это разница отметок **УЧП** (уровень чистого пола) соседних этажей, то есть обычная высота этажа в чистоте (от пола до пола следующего этажа), а не какая-то отдельная «высота рампы». Например, 3,96 м — это просто высота этажа паркинга.\n- **Клиренс** — дорожный просвет автомобиля (расстояние от земли до нижней точки кузова). Переходный участок в начале/конце рампы нужен именно из-за него: если рампа сразу «переламывается» из горизонтали в уклон 18% без плавного перехода, днище машины на этом переломе может задеть покрытие (особенно у машин с низким клиренсом — спорткары, некоторые седаны). Переходный участок сглаживает этот излом, поэтому он не считается частью «наклонного участка», а добавляется отдельно.\n\n```mermaid\nflowchart TD\n    A[\"Перепад высот между этажами<br/>например, 3,96 м\"] --> B[\"Делим на макс. уклон 18%<br/>3,96 / 0,18 = 22 м\"]\n    B --> C[\"Переходные участки клиренса<br/>+2 м с каждой стороны\"]\n    C --> D[\"Итоговая длина рампы<br/>22 + 2 + 2 = 26 м\"]\n```\n\nПерепад высот между этажами ÷ максимальный уклон (18%) = базовая длина наклонного участка. Плюс переходные участки клиренса (~2 м с каждой стороны, где рампа плавно сопрягается с горизонталью, чтобы днище машины не задевало покрытие).\n\n**Пример из практики:** перепад 3,96 м → 3,96/0,18 = 22 м → +2 +2 = **26 м итоговая длина рампы**.\n\n---\n\n## 1. Классификация автомобилей — габариты для машино-мест (Прил. А, табл. А.1)\n\n| Класс | Длина, мм | Ширина, мм | Высота, мм | Радиус разворота, мм |\n|---|---|---|---|---|\n| Малый | 3700 | 1600 | 1700 | 5500 |\n| Средний | 4300 | 1700 | 1800 | 6000 |\n| Большой | 5160 | 1995 | 1970 | 6200 |\n| Микроавтобус | 5500 | 2380 | 2300 | 6900 |\n| Мототранспорт/СИМ | 2700 | 1000 | 1500 | 2700 |\n\n**Минимальный размер машино-места для легкового авто — 5,3×2,5 м** (типовой, покрывает большинство случаев).\n**Место для инвалида на кресле-коляске — 6,0×3,6 м.**\n\n### Зазоры безопасности при расстановке (не менее)\n- 0,8 м — между продольной стороной авто и стеной; между продольными сторонами авто (параллельно стене)\n- 0,5 м — между авто и колонной/пилястрой; между мотоциклами\n- 0,7 м — между торцом авто (передним/задним) и стеной/воротами\n- 0,6 м — между авто, стоящими друг за другом\n- Боксовое хранение: ширина = B+1600мм, длина = L+1400мм\n\n---\n\n## 2. Классификация стоянок (разд. 4)\n\nПо размещению: наземные (открытые/закрытые), подземные (пол ниже планировочной отметки земли **более чем на половину высоты помещений**), обвалованные (>50% ограждений засыпаны грунтом выше уровня земли).\n\nПо типу движения: боксового или манежного типа (в т.ч. многорядная — выезд второй машины только после выезда первой), механизированные (без водителя), полумеханизированные (водитель + механизм).\n\n**Наземная открытого типа** — не менее 50% площади внешней поверхности ограждений на каждом ярусе составляют проёмы.\n\n---\n\n## 3. Параметры рамп и проездов\n\n| Параметр | Значение |\n|---|---|\n| Максимальный продольный уклон прямолинейной рампы | **18%** |\n| Минимальная ширина проезжей части прямолинейной рампы | **3,5 м** |\n| Высота в чистоте (пол — низ конструкций) в зоне проезда подземной стоянки легковых | **~2,2–2,3 м** (с учётом авто + инженерка + запас) |\n| Сопряжение рампы с горизонтальными участками | плавное, клиренс автомобиля <0,1 м |\n| Высота помещений стоянки | на 0,2 м больше самого высокого авто, но **не менее 2 м** |\n\n**Изолированная рампа** — рампа, отделённая от улицы и помещений стоянки (отдельное понятие, не путать с обычной).\n\n---\n\n## 4. Расстояния до эвакуационных выходов (подземная стоянка)\n\n**40 м** — при размещении места хранения между эвакуационными выходами\n**20 м** — в тупиковой части помещения\n\n(Совпадает с общей таблицей СП1.13130 для подземных стоянок, которую разбирали в блоке 1.)\n\n---\n\n## 5. Общие рампы между этажами (закрытого типа) — табл. 6.1\n\nРампы, общие для двух и более этажей, должны отделяться на каждом этаже от помещений хранения/ТО противопожарными преградами, воротами/дверями и **тамбур-шлюзами с подачей воздуха при пожаре**.\n\n## 6. Сообщение стоянки с жилой/общественной частью через общие ЛК и лифты\n\nВыход из лифтов в помещения хранения — одним из способов:\n- через тамбур-шлюзы 1-го типа с раздельной подачей наружного воздуха\n- (либо иной вариант, требующий сверки полного перечня по СП4.13130/СП7 — см. [[КОНСПЕКТ-ЗАЛП — Блок 1]])\n\n## 7. Сервисное обслуживание (ТО и ТР)\n\nПомещения ТО/ТР (кроме мойки) отделяются от стоянки противопожарными **стенами 2-го типа (перегородками 1-го типа)** и **перекрытиями 3-го типа**. Размещение в подземных/цокольных этажах **не допускается** (кроме помещений только мойки), также как и категорий А/Б по пожарной опасности.\n\n**Шкафы для хранения шин на машино-местах:** допустимы на расстоянии ≥8 м от эвакуационных выходов, из НГ-материалов, глубина ≤1 м, не должны нарушать минимальный размер машино-места (5,3×2,5 м), оборудуются пожаротушением.\n\n## 8. Дымовые зоны (большие подземные паркинги)\n\nДля одноэтажного подземного паркинга площадью пожарного отсека **>3000 м²** можно предусмотреть дымовые зоны — зоны, свободные от пожарной нагрузки, шириной **не менее 8 м**, вместо деления на полноценные отдельные отсеки.\n\n## 9. МГН на паркинге\n\n- Места для МГН — рекомендуется размещать на первых наземных этажах, либо в подземных — **не ниже первого подземного уровня**\n- Габарит места МГН — 6,0×3,6 м (см. выше)\n\n---\n\n## Открытые вопросы (не проверено дословно)\n- Полный перечень вариантов сообщения лифтов со стоянкой (упоминался СП7 в предыдущем разборе — не в базе)\n- Точные условия применения дымовых зон вместо полноценных отсеков (найдена только часть формулировки)\n\n---\n\n## Связанные заметки\n[[СП 113.13330.2023]] · [[СП 42.13330.2016]] · [[СП 4.13130.2013]] · [[СП 59.13330.2020]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]] · [[Нормативная база — карта]]\n", "diagrams": ["<svg viewBox=\"0 0 480 332\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans, sans-serif\">\n<defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4A6178\"/></marker></defs>\n<rect x=\"0\" y=\"0\" width=\"480\" height=\"332\" fill=\"#FAFBFC\"/>\n<rect x=\"20\" y=\"15\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"43.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Перепад высот между этажами (например, 3,96 м)</tspan></text><rect x=\"20\" y=\"99\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"127.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Делим на макс. уклон 18%: 3,96 / 0,18 = 22 м</tspan></text><rect x=\"20\" y=\"183\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"211.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Переходные участки клиренса: +2 м с каждой стороны</tspan></text><rect x=\"20\" y=\"267\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"295.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Итоговая длина рампы: 22 + 2 + 2 = 26 м</tspan></text><line x1=\"240.0\" y1=\"65\" x2=\"240.0\" y2=\"91\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"149\" x2=\"240.0\" y2=\"175\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"233\" x2=\"240.0\" y2=\"259\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/>\n</svg>"]}]}, "9": {"name": "Градостроительство (СП42)", "notes": [{"title": "Конспект-залп Градостроительство", "file": "КОНСПЕКТ-ЗАЛП — Градостроительство (Блок 9)", "md": "#нормативка #конспект #градостроительство #генплан\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — Общественные здания (Блок 4)]] · [[КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)]]\n\n# КОНСПЕКТ-ЗАЛП · Блок 9: градостроительство и генплан (СП42.13330.2016)\n\n**Документы:** ⚠️ **[[СП 42.13330.2016]] заменён на СП42.13330.2026** (действует с 12.07.2026, утверждён приказом Минстроя №368/пр от 11.06.2026) — вся база ниже собиралась по редакции 2016 года, актуальность конкретных пунктов по новой редакции не проверена построчно, кроме отдельно отмеченного ниже раздела про площадки. · [[СП 4.13130.2013]] (противопожарные расстояния — табл.1)\n\n---\n\n## Бытовые разрывы между жилыми зданиями (СП42, разд.7)\n\nРасстояния между жилыми зданиями определяются **по совокупности**: расчёт инсоляции/освещённости + противопожарные требования — не одно число, а пересечение нескольких условий.\n\n| Случай | Минимальное расстояние |\n|---|---|\n| Между длинными сторонами, здания 2–3 этажа | ≥15 м |\n| Между длинными сторонами, здания 4 этажа | ≥20 м |\n| Между длинными сторонами и торцами с окнами жилых комнат | ≥10 м |\n\nВ реконструкции/стеснённых условиях расстояния можно сократить **при условии** соблюдения норм инсоляции/освещённости/пожарной безопасности **и** непросматриваемости жилых помещений (комнат и кухонь) из окна в окно.\n\n---\n\n## Противопожарные расстояния между зданиями — логика расчёта\n\n```mermaid\nflowchart TD\n    A[\"Базовое расстояние (табл.1 СП4.13130)<br/>по степени огнестойкости и классу\"] --> B[\"Модификаторы<br/>−50% автопожаротушение, +20% сейсмика 9+\"]\n    B --> C[\"Особые случаи<br/>стена 1-го типа → не нормируется\"]\n    C --> D[\"Итоговое расстояние<br/>наименьшее в свету между стенами\"]\n```\n\n### Базовая таблица 1 (СП4.13130) — жилые и общественные здания между собой\n\n| Степень/класс здания 1 → | I,II,III/С0 | II,III/С1 | IV/С0,С1 | IV,V/С2,С3 |\n|---|---|---|---|---|\n| **I,II,III / С0** | 6 м | 8 м | 8 м | 10 м |\n| **II,III / С1** | 8 м | 10 м | 10 м | 12 м |\n| **IV / С0,С1** | 8 м | 10 м | 10 м | 12 м |\n| **IV,V / С2,С3** | 10 м | 12 м | 12 м | 15 м |\n\nДо производственных/складских зданий — расстояния больше (10–18 м в зависимости от комбинации).\n\n**Измеряется** как наименьшее расстояние в свету между наружными стенами (либо от выступающих элементов из горючих материалов >1 м).\n\n### Модификаторы (применяются к базовой таблице)\n\n| Условие | Изменение |\n|---|---|\n| Глухие стены I–IV/С0,С1 с отделкой не ниже Г1 | **−20%** |\n| Оба здания I,II степени/С0 с автоматическим пожаротушением | **−50%** |\n| Сейсмичность ≥9 баллов, здания IV/С2,С3 или V степени | **+20%** |\n| Особые климатические подрайоны (IБ, IГ, IIА, IIБ, побережья/острова ДВ) для IV/С2,С3 или V | **+25%** |\n| Климат. подрайоны IА,IБ,IГ,IД,IIА, здания IV/С2,С3 или V | **+50%** |\n| Двухэтажные каркасно-щитовые здания V степени | **+20%** |\n\n### Особый случай — расстояние не нормируется вообще\n\nЕсли более высокая/широкая стена (или специально возведённая отдельная стена), обращённая к соседнему объекту, — **противопожарная стена 1-го типа** (по СП2.13130) — расстояние можно не соблюдать.\n\n### Общественные здания — разрыв можно не делать вовсе\n\nЕсли суммарная площадь застройки двух общественных зданий (включая незастроенный промежуток) **не превышает** допустимой площади этажа в пределах пожарного отсека (по СП2.13130, для наихудшей комбинации степени/класса из двух зданий) — разрыв можно не предусматривать, при условии проездов/подъездов для пожарной техники. **Исключение:** классы Ф1.1 и Ф4.1, а также объекты торговли горючими газами/ЛВЖ/ГЖ.\n\n---\n\n## Частный сектор / садоводство (справочно)\n\n- От окон жилых комнат/кухонь/веранд до стен домов и хозпостроек на соседних участках — **≥6 м**\n- От границы участка: до стены жилого дома **≥3 м**, до хозпостроек **≥1 м**\n- Туалет без централизованной канализации: до дома **≥12 м**, до колодца **≥25 м**\n- Хозпостройки для скота/птицы от окон жилых помещений: одиночные/двойные **≥10 м**, до 8 блоков **≥25 м**, 8–30 блоков **≥50 м**\n- Группа хозпостроек — не более **30 блоков**; площадь застройки сблокированных ≤**800 м²**\n- До шахтных колодцев от построек для скота — **≥20 м**\n- Между домами/хозпостройками **в пределах одного участка** — не нормируется\n\n---\n\n## Санитарно-защитные зоны\n\nРазмер СЗЗ производственных объектов в общественно-деловых зонах — по **СанПиН 2.2.1/2.1.1.1200** или расчётом с учётом **СанПиН 1.2.3685** и **СанПиН 2.1.3684**.\n\n---\n\n## Соотношение территорий — малоэтажная застройка (Прил.А)\n\n| Показатель | В границах микрорайона | В границах жилого района |\n|---|---|---|\n| Участки жилой застройки | не более 75% | не более 85% |\n| Участки общественной застройки | 3,0–8,0% | 3,0–5,0% |\n| Зелёные насаждения | не менее 3,0% | не менее 3,0% |\n| Улицы, проезды, стоянки | 14,0–16,0% | 5,0–7,0% |\n\n**Производственно-жилой район** в составе многофункциональной общественно-деловой зоны: площадь территории не менее **10 га** (город) / **3 га** (село).\n\n---\n\n## Расстояния от площадок до окон жилого дома (СП42.13330.2026, п.6.4.39, табл.6.5)\n\n⚠️ **Актуализация:** ниже — данные уже по **новой редакции 2026 года** (действует с 12.07.2026), которая заменила СП42.13330.2016. Раздел закрывает прежний открытый вопрос о точных расстояниях до детских/спортивных площадок.\n\n**Придомовые площадки** (п.6.4.39): детские игровые, места отдыха взрослых, для гигиенического выгула собак, контейнерные площадки ТКО, проезды, разворотные площадки, приобъектные стоянки, зелёные насаждения.\n\n**Минимальный отступ от окон (табл.6.5):**\n\n| Площадка | Минимальный отступ от окон |\n|---|---|\n| Детская игровая | **10 м** |\n| Для отдыха взрослых | **8 м** |\n| Для физкультуры взрослых и спортивных игр | **10–40 м** |\n| Для гигиенического выгула собак | **20–40 м** |\n\n⚠️ **Диапазон для спорта — не произвольный выбор:** при расстоянии **10–30 м** нужны шумозащитные мероприятия; при **30–40 м** — площадка допускается без них (примечание 6 к табл.6.5). Примечание также разрешает устанавливать отступы для площадок отдыха/физкультуры **в составе МНГП** — то есть местный норматив по-прежнему проверяется параллельно с федеральным СП, старое предупреждение «сначала МНГП, СП — запасной вариант» остаётся в силе.\n\n**Озеленение — по периметру, не по площади (важное разграничение):** не менее **50% периметра** спортивных, детских игровых площадок и площадок отдыха взрослых — с посадкой деревьев/кустарников. Требование именно к длине озеленённой части периметра, а не к площади самой площадки — подмена показателя даст неверный результат в балансе территории. На генплане должны читаться одновременно: граница площадки, длина озеленённой части периметра, размещение посадок.\n\n**Хозяйственные площадки (мусоросборники)** — расстояние от площадки до окон **не менее 20 м**; расстояние от площадки до наиболее удалённого входа в жилое здание — не более **100 м** (для домов с мусоропроводами) / **50 м** (для домов без мусоропроводов). *(эти цифры относятся ещё к редакции 2016 года — не проверено, изменились ли в 2026-й)*\n\n**Инженерные сети под площадками (новое, п.7.43):** колодцы и камеры новых/реконструируемых коммуникаций под плоскостными объектами размещаются **за границами** этих объектов (исключение — автостоянки). Новые тепловые и газовые сети должны проходить **вне** детских/спортивных площадок, площадок отдыха взрослых, площадок для выгула собак. Если трасса пересекает площадку по проекту — нужно менять планировочное решение или трассировку сети, а не просто условное обозначение на чертеже.\n\n### Реальный пример расчёта площадок по МНГП (Белово, Кемеровская область)\n\nРасчётное количество жителей: 8315,6 м² / 25 м² на чел. = **333 чел.** (норматив 25 м²/чел общей площади на человека — «комфорт»-класс, по МНГП Кемеровской обл.).\n\n**Формула расчёта каждого типа площадки — норматив МНГП × число жителей:**\n\n| Тип площадки | Норматив (м²/чел) | Расчёт | Площадь |\n|---|---|---|---|\n| Для игр детей дошкольного/младшего школьного возраста | 0,7 | 333×0,7 | 233,1 м² |\n| Для отдыха взрослого населения | 0,1 | 333×0,1 | 33,3 м² |\n| Для занятий физкультурой | 2 (÷2) | 333×2/2 | 333 м² |\n| Для хозяйственных целей | 0,3 | 333×0,3 | 99,9 м² |\n| Для дворового озеленения | 2 | 333×2 | 666 м² |\n\n**Машино-места** считаются отдельно, тоже по МНГП: 333×0,3=100 (постоянное хранение) + 100×0,2=20 (временное, 20% от постоянных) = **120 машино-мест**, из них 10% для МГН (12 м/м, включая места под транспорт МГН 3,6×6м).\n\nЭто подтверждает практику: **все нормативы площадок и машиномест в этом примере — прямо из МНГП** (Постановление Коллегии администрации Кемеровской области №595 от 24.12.2022, таблица 25), СП42 в самом расчёте не цитируется вообще — ровно то предупреждение, которое сделано выше.\n\n---\n\n## Открытые вопросы (не проверено дословно)\n- Полная таблица Б.1 (плотность застройки функциональных зон) — упомянута, не законспектирована целиком, актуальность по редакции 2026 не проверена\n- Раздел 14 СП42 (расчёт инсоляции/освещённости на генплане) — не проверялся отдельно, скорее всего дублирует логику СанПиН 1.2.3685 и СП52 (см. [[КОНСПЕКТ-ЗАЛП — КЕО и инсоляция (Блок 5)]])\n- Расстояния до площадок (п.6.4.39, табл.6.5) — взяты из вторичного источника (обзорная статья), не из первоисточника СП42.13330.2026 напрямую — стоит свериться с оригиналом при возможности\n- Все остальные разделы этой заметки (бытовые разрывы, СЗЗ, соотношение территорий) — собраны по СП42.13330.**2016**, актуальность конкретных цифр по редакции 2026 не проверена ни по одному пункту, кроме площадок выше\n\n---\n\n## Связанные заметки\n[[СП 42.13330.2016]] · [[СП 4.13130.2013]] · [[СП 2.13130.2020]] · [[КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)]] · [[КОНСПЕКТ-ЗАЛП — КЕО и инсоляция (Блок 5)]] · [[Нормативная база — карта]]\n", "diagrams": ["<svg viewBox=\"0 0 480 332\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans, sans-serif\">\n<defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4A6178\"/></marker></defs>\n<rect x=\"0\" y=\"0\" width=\"480\" height=\"332\" fill=\"#FAFBFC\"/>\n<rect x=\"20\" y=\"15\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"36.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Базовое расстояние (табл.1 СП4.13130) по степени огнестойкости</tspan><tspan x=\"240.0\" dy=\"15\">и классу</tspan></text><rect x=\"20\" y=\"99\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"127.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Модификаторы: −50% автопожаротушение, +20% сейсмика 9+</tspan></text><rect x=\"20\" y=\"183\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"211.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Особые случаи: стена 1-го типа → не нормируется</tspan></text><rect x=\"20\" y=\"267\" width=\"440\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"295.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Итоговое расстояние — наименьшее в свету между стенами</tspan></text><line x1=\"240.0\" y1=\"65\" x2=\"240.0\" y2=\"91\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"149\" x2=\"240.0\" y2=\"175\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"233\" x2=\"240.0\" y2=\"259\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/>\n</svg>"]}]}, "10": {"name": "Интеграция и комплексные кейсы", "notes": [{"title": "Блок 10 — кейсы", "file": "Блок 10 — Интеграция и комплексные кейсы", "md": "#нормативка #конспект #кейсы #интеграция\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]]\n\n# Блок 10: интеграция — комплексные кейсы\n\nПоследний блок программы. Здесь нет новых нормативных фактов — только практика соединения уже пройденного (блоки 1–9) в единое решение, как это реально бывает на защите проекта.\n\n---\n\n## Алгоритм разбора любого комплексного кейса\n\n```mermaid\nflowchart TD\n    A[\"Определить класс Ф и типологию\"] --> B[\"Определить степень огнестойкости +<br/>класс конструктивной опасности\"]\n    B --> C[\"Пройти цепочку ПБ:<br/>ЛК → преграды → СОУЭ → выходы\"]\n    C --> D[\"Наложить МГН:<br/>нужна ли ПБЗ, доступность\"]\n    D --> E[\"Наложить смежные темы:<br/>инсоляция/КЕО, шум, ЭЭ\"]\n    E --> F[\"Проверить встроенные функции:<br/>паркинг, коммерция — тамбур-шлюзы\"]\n    F --> G[\"Проверить генплан:<br/>расстояния, СЗЗ\"]\n    G --> H[\"Сформулировать обоснование<br/>для раздела ПД\"]\n```\n\nПорядок важен: каждый следующий шаг **накладывается** на уже принятое решение, а не проверяется независимо. Инсоляцию бессмысленно считать раньше, чем известна высота/форма здания (шаг 1–2); тамбур-шлюзы паркинга бессмысленно проектировать раньше, чем определён тип ЛК (шаг 3).\n\n---\n\n## Кейс 1 — жилой комплекс с встроенным паркингом и коммерцией\n\n**Вводные:** секционный жилой дом, Ф1.3, высота 52 м, площадь квартир на этаже секции — 900 м². В цоколе — паркинг на 60 машиномест с отдельным входом в жилую часть через лифты. На 1-м этаже — встроенные помещения торговли (400 м²).\n\n**Вопросы для самостоятельного разбора:**\n1. Степень огнестойкости и класс конструктивной опасности?\n2. Сколько эвакуационных выходов с этажа и какого типа ЛК?\n3. Нужны ли тамбур-шлюзы, и если да — где именно (паркинг, коммерция)?\n4. Что не так с площадью торговли 400 м² в контексте встраивания в жилой дом? (подсказка — есть числовой лимит)\n5. Нужна ли пожаробезопасная зона для МГН, и если да — какого типа?\n\n→ Разбор опирается на [[Пожарные отсеки и противопожарные преграды]], [[Пути эвакуации — жилые здания (Ф1.3)]], [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]], [[КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)]].\n\n> [!success]- Разбор (открыть после попытки)\n> 1. Высота 52 м → диапазон 28–75 м. Табл.6.8 СП2.13130: при 52 м подходит только II/С0 (лимит 50м не подходит! нужно проверить I/С0, лимит 75м — подходит). **I степень, С0.**\n> 2. Площадь 900 м² > 500 м² → 2 выхода. Высота в диапазоне 28–75м → один Н1 (адресная сигнализация), второй — Н2 без окон с тамбур-шлюзом.\n> 3. Тамбур-шлюзы нужны: (а) на выходе из паркинга в жилую часть — 1-го типа с подпором; (б) на выходах из лифтов паркинга в помещения хранения — парно-последовательные; (в) между вестибюлем жилой части и торговыми помещениями — с подпором, т.к. высота >28 м.\n> 4. Лимит по СП118 Прил.В.4.2 — торговля до 3500 м² в стилобатной части ИЛИ по СП54 (встраивание в МКД) — торговые помещения площадью до 3500 м² тоже допустимы для одной организации, но если это несколько отделов — проверить суммарно. При 400 м² лимит не нарушен — это скорее проверка на внимательность, а не реальная проблема.\n> 5. Да, нужна: высота >28м + доступ М4 без альтернативного пути эвакуации → минимум 1 ПБЗ на этаж, тип 1 (отдельное помещение) или тип 4 (сама ЛК, если не Н2).\n\n---\n\n## Кейс 2 — общественное здание, многофункциональный центр\n\n**Вводные:** отдельно стоящее общественное здание, 6 этажей, зрительный зал на 350 мест на 2-м этаже, офисные помещения на 3–6 этажах, подземный паркинг на 2 уровнях.\n\n**Вопросы:**\n1. К какому классу(-ам) Ф относится здание — единому или нескольким?\n2. Чем отличается расчёт ограждения лестниц здесь от жилого дома?\n3. Как считается время эвакуации из зрительного зала?\n4. Нужен ли лифт для пожарных подразделений?\n5. Сколько эвакуационных выходов нужно с этажа подземного паркинга?\n\n→ Опирается на [[КОНСПЕКТ-ЗАЛП — Общественные здания (Блок 4)]], [[Лестницы — ширина марша и высота ограждения]], [[КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)]].\n\n> [!success]- Разбор\n> 1. Многофункциональное — зал (Ф2.1), офисы (Ф4.3). Каждая часть анализируется по своему классу, здание не получает единого «среднего» класса.\n> 2. Порог замены 0,9→1,2м в общественном здании — при просвете между маршами **>0,3 м** (не 0,12 м, как в жилье).\n> 3. По табл.9 СП1.13130, для класса С0 — базовое время; корректировка −30% для С1, −50% для С2/С3; при объёме зала >60000 м³ — отдельная формула.\n> 4. Здание общественное, не Ф1.3 — порог для лифта пожарных >28 м. Высота 6 этажей вероятно >28м — тогда да, нужен (если высота ≤28м — не требуется по этому основанию, но требуется из-за подземного паркинга >2 этажей).\n> 5. Подземный паркинг >2 этажей уже сам по себе требует лифт для пожарных; выходов — минимум 2 рассредоточенных с этажа отсека (СП113), расстояние между ними — по табл.19 СП1.13130 (40м/20м тупик для подземных).\n\n---\n\n## Кейс 3 — защита решения перед экспертизой\n\nФормат «протокол вопросов эксперта» — отвечай так, как если бы объясняла вживую, не просто называя цифры, а обосновывая логику.\n\n**Ситуация:** в жилом доме высотой 34 м вы предусмотрели один эвакуационный выход с этажа при площади квартир на этаже секции 520 м².\n\n**Вопрос эксперта:** «Обоснуйте, почему один выход допустим при такой площади».\n\n> [!question] Попробуй сформулировать ответ сама, прежде чем открывать разбор\n> [!success]- Разбор\n> Правильный ход мысли: 520 м² попадает в переходную зону 500–550 м² (п.6.1.1 СП1.13130) — здесь один выход допустим, но **не автоматически**, а при выполнении условий. Высота 34 м — это диапазон >28м, значит нужна незадымляемая ЛК типа Н1, и **обязательное условие**: все помещения квартир (кроме санузлов/ванных/душевых) должны быть оборудованы адресной пожарной сигнализацией или автоматическим пожаротушением. Без этого условия один выход в этом диапазоне высот и площади недопустим.\n>\n> Хороший ответ эксперту не просто называет «500-550 — можно один выход», а сразу указывает **оба** условия (диапазон площади И оснащение сигнализацией/пожаротушением) — это показывает, что архитектор понимает логику, а не запомнил число.\n\n---\n\n## Как тренироваться дальше самостоятельно\n\nПридумывай собственные вводные (высота + площадь + встроенные функции) и проходи весь алгоритм сверху вниз — блоки 1–9 дают все нужные таблицы и цепочки. Если запутаешься на каком-то шаге — это и есть точное место, которое стоит повторить перед сном накануне собеседования.\n\n---\n\n## Связанные заметки\n[[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]] · [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]] · [[КОНСПЕКТ-ЗАЛП — Общественные здания (Блок 4)]] · [[КОНСПЕКТ-ЗАЛП — КЕО и инсоляция (Блок 5)]] · [[КОНСПЕКТ-ЗАЛП — Звук (Блок 6)]] · [[КОНСПЕКТ-ЗАЛП — ЭЭ и теплозащита (Блок 7)]] · [[КОНСПЕКТ-ЗАЛП — Паркинг (Блок 8)]] · [[КОНСПЕКТ-ЗАЛП — Градостроительство (Блок 9)]] · [[Нормативная база — карта]]\n", "diagrams": ["<svg viewBox=\"0 0 480 594\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans, sans-serif\">\n<defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4A6178\"/></marker></defs>\n<rect x=\"0\" y=\"0\" width=\"480\" height=\"594\" fill=\"#FAFBFC\"/>\n<rect x=\"20\" y=\"15\" width=\"440\" height=\"46\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"41.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Определить класс Ф и типологию</tspan></text><rect x=\"20\" y=\"89\" width=\"440\" height=\"46\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"108.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Определить степень огнестойкости + класс конструктивной</tspan><tspan x=\"240.0\" dy=\"15\">опасности</tspan></text><rect x=\"20\" y=\"163\" width=\"440\" height=\"46\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"189.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Пройти цепочку ПБ: ЛК → преграды → СОУЭ → выходы</tspan></text><rect x=\"20\" y=\"237\" width=\"440\" height=\"46\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"263.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Наложить МГН: нужна ли ПБЗ, доступность</tspan></text><rect x=\"20\" y=\"311\" width=\"440\" height=\"46\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"337.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Наложить смежные темы: инсоляция/КЕО, шум, ЭЭ</tspan></text><rect x=\"20\" y=\"385\" width=\"440\" height=\"46\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"404.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Проверить встроенные функции: паркинг, коммерция —</tspan><tspan x=\"240.0\" dy=\"15\">тамбур-шлюзы</tspan></text><rect x=\"20\" y=\"459\" width=\"440\" height=\"46\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"485.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Проверить генплан: расстояния, СЗЗ</tspan></text><rect x=\"20\" y=\"533\" width=\"440\" height=\"46\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"240.0\" y=\"559.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"240.0\" dy=\"0\">Сформулировать обоснование для раздела ПД</tspan></text><line x1=\"240.0\" y1=\"61\" x2=\"240.0\" y2=\"81\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"135\" x2=\"240.0\" y2=\"155\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"209\" x2=\"240.0\" y2=\"229\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"283\" x2=\"240.0\" y2=\"303\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"357\" x2=\"240.0\" y2=\"377\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"431\" x2=\"240.0\" y2=\"451\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><line x1=\"240.0\" y1=\"505\" x2=\"240.0\" y2=\"525\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/>\n</svg>"]}]}, "11": {"name": "Организация проектирования", "notes": [{"title": "Постановление №87 (состав ПД)", "file": "КОНСПЕКТ-ЗАЛП — Постановление №87 (состав ПД)", "md": "#нормативка #конспект #ПД #состав_документации\n\n← [[Нормативная база — карта]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]]\n\n# КОНСПЕКТ-ЗАЛП · Постановление Правительства РФ №87 от 16.02.2008\n\n**Статус:** действует до 01.09.2028, последняя редакция — от 21.10.2025 №1623. Издано в соответствии со ст.48 Градостроительного кодекса РФ.\n\n**Назначение:** устанавливает состав разделов проектной документации, подлежащей экспертизе (ст.49 ГрК РФ), и требования к содержанию этих разделов.\n\n---\n\n## Состав разделов ПД — для зданий/сооружений (не линейных объектов), п.3.1\n\nАктуальный список (после редакции 2022 г. №963 — структура заметно отличается от версии до 2022 г., если попадётся старая нумерация в памяти — не доверять, ориентироваться на этот список):\n\n| № | Название раздела | Обозначение | Где мы это уже разбирали |\n|---|---|---|---|\n| 1 | Пояснительная записка | ПЗ | — |\n| 2 | Схема планировочной организации земельного участка | ПЗУ | [[КОНСПЕКТ-ЗАЛП — Градостроительство (Блок 9)]] |\n| **3** | **Объёмно-планировочные и архитектурные решения** | **АР** | вся программа — это раздел 3 |\n| 4 | Конструктивные решения | КР | смежный раздел, не наш |\n| 5 | Сведения об инженерном оборудовании, сетях и системах инженерно-технического обеспечения | ИОС | смежники (см. [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]], п.7) |\n| 6 | Технологические решения | ТХ | только если требуется заданием (для непроизводственных зданий) |\n| 7 | Проект организации строительства (вкл. снос при необходимости) | ПОС | — |\n| 8 | Мероприятия по охране окружающей среды | ООС | — |\n| **9** | **Мероприятия по обеспечению пожарной безопасности** | **ПБ** | [[КОНСПЕКТ-ЗАЛП — Блок 1]] |\n| 10 | Требования к обеспечению безопасной эксплуатации объекта | — | частично [[КОНСПЕКТ-ЗАЛП — СП54 (Блок 2)]] |\n| **11** | **Мероприятия по обеспечению доступа инвалидов** | **ОДИ** | [[КОНСПЕКТ-ЗАЛП — МГН (Блок 3)]] |\n| 12 | Смета на строительство/реконструкцию/капремонт/снос | — | разрабатывается только при бюджетном финансировании |\n| 13 | Иная документация, предусмотренная законодательством | — | — |\n\n⚠️ **Раздела «энергоэффективность» как отдельного пункта в актуальной версии списка нет** — если где-то встретится упоминание «раздела 10.1 ЭЭ» (по старой нумерации до 2022 г.), это устаревшая структура. В текущей редакции требования энергоэффективности встроены в состав других разделов (в первую очередь в АР/ИОС), не выделены отдельным номером.\n\nДля линейных объектов (дороги, сети) состав другой — 10 разделов со своей нумерацией (раздел 2 там — «Проект полосы отвода», а не ПЗУ) — архитектору жилых/общественных зданий эта версия обычно не нужна.\n\n---\n\n## Раздел 9 «Мероприятия по обеспечению пожарной безопасности» — детально\n\nТекстовая часть содержит:\n- Описание системы обеспечения пожарной безопасности объекта\n- Обоснование противопожарных расстояний (см. [[КОНСПЕКТ-ЗАЛП — Градостроительство (
