 {"title": "Пожарные отсеки и противопожарные преграды", "file": "Пожарные отсеки и противопожарные преграды", "md": "#нормативка #пожарная_безопасность #справочник\n\n← назад: [[Блок 1 — Пожарная безопасность и эвакуация]] · [[Нормативная база — карта]]\n\n---\n\n# Пожарные отсеки и противопожарные преграды\n\nПрактический слой, где степень огнестойкости и класс конструктивной опасности используются **вместе**: как разделить здание на отсеки, как их подобрать под конкретный проект, и чем отсеки разделяются физически.\n\n**Документы:** [[123-ФЗ]] (ст. 88, приложение табл. 24, 25) · [[СП 2.13130.2020]] (раздел 6, табл. 6.8 и др.)\n**Смежные заметки:** [[Класс функциональной пожарной опасности]] · [[Огнестойкость]] · [[Класс конструктивной пожарной опасности]]\n\n---\n\n## 1. Как реально определить степень огнестойкости и класс конструктивной опасности\n\nТаблицы 21 ([[Огнестойкость]]) и 22 ([[Класс конструктивной пожарной опасности]]) показывают **что нужно обеспечить**, если комбинация уже выбрана. Сам выбор комбинации — отдельный механизм, он в **[[СП 2.13130.2020]]**, не в 123-ФЗ, и определяется он **парой** — степень и класс подбираются вместе, одной строкой таблицы.\n\n**Алгоритм (обратный подбор по таблице):**\n1. Знаете класс Ф ([[Класс функциональной пожарной опасности]], 123-ФЗ ст.32)\n2. Знаете/задаёте высоту здания и площадь этажа в пределах пожарного отсека (из ТЗ)\n3. Открываете в СП2.13130 таблицу именно для этого класса Ф (у каждого функционального класса — своя: Ф1.3 → табл. 6.8, школы Ф4.1/Ф1.1 → табл. 6.13, склады Ф5.2 → табл. 6.3 и т.д.)\n4. Ищете строку, где допустимая высота и площадь этажа **покрывают** ваши параметры — это и есть требуемая комбинация «степень огнестойкости + класс конструктивной опасности»\n5. Подставляете эту комбинацию в таблицы 21/22 123-ФЗ → получаете конкретные R/E/I и К для каждой конструкции\n\n### Таблица 6.8 СП2.13130 — для многоквартирных жилых зданий (Ф1.3)\n\n| Степень огнестойкости | Класс конструктивной опасности | Допустимая высота, м | Площадь этажа в пределах отсека, м² |\n|---|---|---|---|\n| I | С0 | 75 | 2500 |\n| II | С0 | 50 | 2500 |\n| II | С1 | 28 | 2200 |\n| III | С0 | 28 | 1800 |\n| III | С1 | 15 | 1800 |\n| IV | С0 | 5 / 3 | 1000 / 1400 |\n| IV | С1 | 5 / 3 | 800 / 1200 |\n| IV | С2 | 5 / 3 | 500 / 900 |\n| V | не норм. | 5 / 3 | 500 / 800 |\n\n> [!important] Определения, которые используются в этой таблице\n\n**Высота здания (пожарно-техническая)** — СП 1.13130.2020, п. 3.1:\n> Высота расположения верхнего этажа, не считая верхнего технического этажа, определяемая максимальной разностью отметок поверхности проезда для пожарных машин и нижней границы открывающегося проёма (окна) в наружной стене; при отсутствии открывающихся окон — полусуммой отметок пола и потолка этажа.\n\nЭто подтверждено и в самом СП2.13130 (п. 4.6): «Высота зданий... определяется согласно СП 1.13130» — то есть именно эта, пожарная версия высоты, а не архитектурно-техническая, используется в таблице 6.8.\n\n**Площадь этажа в пределах пожарного отсека** — СП 2.13130.2020, раздел 6:\n> Определяется максимальной площадью этажа, ограниченной наружными стенами здания и (или) противопожарными стенами 1-го типа, по внутреннему периметру наружных стен этажа, **без учёта площади лестничных клеток**, за исключением специально оговоренных случаев.\n\n> [!warning] Не перепутать с площадью этажа для ТЭП\n> Площадь этажа для расчёта ТЭП (СП54.13330.2022, Приложение А.1.3) считается между внутренними поверхностями наружных стен, но **включает** лестничные площадки, балконы, лоджии, галереи. Это другое число, чем «площадь этажа в пределах пожарного отсека» — для таблицы 6.8 нужна именно пожарная версия (без лестничных клеток), иначе результат подбора степени огнестойкости/класса будет неверным.\n\n> [!example] Пример подбора\n> Дом высотой 34 м, площадь этажа в отсеке 1500 м². Строка III/С0 (макс. 28 м) не подходит. Строка II/С0 (макс. 50 м, лимит площади 2500 м²) — подходит по обоим параметрам. **Требуемая комбинация: II степень огнестойкости, класс С0.**\n\n> [!note] Практика выбора\n> Обычно выбирают **наименее строгую** из подходящих комбинаций — она дешевле в реализации. Это экономическое решение архитектора/ГИПа, а не нормативное предписание \"выбрать лучшее\".\n\n> [!important] Площадь vs высота — деление на отсеки регулирует только площадь\n> Таблица даёт два параметра, но они разной природы: **высота** — характеристика здания целиком, её нельзя «обойти» делением на отсеки (если дом 34 м, нужна степень/класс, допускающие такую высоту, независимо от компоновки этажей). **Площадь этажа в пределах отсека** — это как раз то, что регулируется делением: если этаж превышает допустимую площадь, его делят противопожарными стенами 1-го типа на несколько отсеков меньшей площади каждый. Само определение из СП2.13130 подтверждает это: «Площадь пожарного отсека характеризуется максимальной величиной площади этажа, расположенного в пределах данного отсека».\n\n---\n\n## 2. Противопожарные преграды\n\n### 8 типов преград (123-ФЗ)\n1. Противопожарные стены\n2. Противопожарные перегородки\n3. Противопожарные перекрытия\n4. Противопожарные разрывы\n5. Противопожарные занавесы, шторы и экраны\n6. Противопожарные водяные завесы\n7. Противопожарные минерализованные полосы\n8. Зона, свободная от пожарной нагрузки\n\nДля жилья/общественных зданий практически всегда актуальны первые три плюс тамбур-шлюзы.\n\n### Деление по типам элементов\nКаждая преграда делится на типы (1-й/2-й — для стен и перегородок, 1–4-й — для перекрытий), тип определяется пределом огнестойкости ограждающей части (123-ФЗ ст. 88 — точные пороговые значения не проверялись, при необходимости свериться отдельно).\n\n### Таблица 24 123-ФЗ — пределы огнестойкости заполнения проёмов\n\n| Элемент | Тип | Предел огнестойкости |\n|---|---|---|\n| Двери, ворота, люки, клапаны, шторы, экраны | 1 / 2 / 3 | EI 60 / EI 30 / EI 15 |\n| Двери с остеклением >25% | 1 / 2 / 3 | EIW 60 / EIW 30 / EIW 15 |\n| Дымогазонепроницаемые двери | 1 / 2 / 3 | EIS 60 / EIS 30 / EIS 15 |\n| Двери шахт лифтов | 2 | EI 30 (в зданиях ≤28 м — E 30) |\n| Окна | 1 / 2 / 3 | E 60 / E 30 / E 15 |\n| Занавесы | 1 | EI 60 |\n\n### Ключевые практические правила (СП2.13130, п.5.3)\n- Огнестойкость преграды = совокупность ограждающей части + несущих конструкций + опор + узлов крепления — всё должно соответствовать пределу преграды, не только сама стена\n- Класс пожарной опасности преграды — обязательно К0 или К1, в зависимости от класса конструктивной опасности здания\n- **Площадь проёмов в преграде ≤ 25%** от её площади (кроме случаев, когда заполнение проёмов имеет предел огнестойкости не ниже самой преграды)\n- В местах примыкания к наружным стенам — простенки не менее 1,0 м (у стен 2-го типа) или 0,8 м (у перегородок 2-го типа)\n\n### Тамбур-шлюз\nНормируемая конструкция с подпором воздуха при пожаре (не просто «маленький тамбур»). Требуется, в частности:\n- При входе в помещения категорий А/Б из коридоров, ЛК, лифтовых холлов\n- При сообщении подвала с цокольным/первым этажом через отдельную лестницу (СП4.13130, п.4.18)\n- При выходе из встроенной автостоянки в жилую часть\n\nТамбур-шлюзы типизированы (1-й/2-й тип) — таблица 25 123-ФЗ задаёт требования к перегородкам, перекрытиям и заполнению проёмов внутри шлюза (полное содержание таблицы не проверено — свериться при необходимости).\n\n---\n\n## Непроверенные детали (свериться при необходимости)\n- Точные пороговые пределы огнестойкости, определяющие тип 1/2/3 у стен/перегородок (123-ФЗ ст. 88)\n- Полное содержание таблицы 25 (требования к элементам тамбур-шлюза) — найден только заголовок\n\n---\n\n## Связанные заметки\n[[123-ФЗ]] · [[СП 2.13130.2020]] · [[СП 1.13130.2020]] · [[СП 4.13130.2013]] · [[Класс функциональной пожарной опасности]] · [[Огнестойкость]] · [[Класс конструктивной пожарной опасности]] · [[Блок 1 — Пожарная безопасность и эвакуация]] · [[Нормативная база — карта]]\n", "diagrams": []}, {"title": "Лестницы — ширина марша и высота ограждения", "file": "Лестницы — ширина марша и высота ограждения", "md": "#нормативка #пожарная_безопасность #жилые_здания #справочник\n\n← назад: [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[Лестничные клетки — типы Л1 Л2 Н1 Н2 Н3]] · [[Нормативная база — карта]]\n\n---\n\n# Лестницы — геометрические параметры (ступени, уклон, марш, ограждение)\n\nЗакрывает полную цепочку: что нормируется → откуда брать требования → как считать → готовый пример расчёта.\n\n**Документы:** [[СП 1.13130.2020]] (базовый — габариты, уклон, число ступеней, ширина марша/площадки, высота пути эвакуации, высота ограждения) · [[СП 4.13130.2013]] (уклон/ширина марша лестниц выхода на кровлю) · СП 477.1325800 (уклон/ширина марша/площадки, >75м, не в базе) · СП 267.1325800 (высота ограждения, >75м, ранее была в базе) · [[СП 54.13330.2022]] · [[СП 118.13330.2022]] · [[СП 113.13330.2023]] · [[СП 59.13330.2020]]\n\n> [!important] Главный принцип\n> Требования к лестницам разбросаны по многим СП. Базовые — всегда в СП1.13130, дальше уточняются профильным разделом самого СП1 (по классу Ф) и профильным СП объекта (СП54 для жилья, СП113 для паркинга и т.д.). **Выбираются наиболее строгие требования**, предъявляемые к данной части здания — не среднее и не любое подходящее, а самое жёсткое из применимых.\n\n---\n\n## Что нормируется у лестницы — полный список\n\n- Габариты ступеней (проступь/подступенок)\n- Уклон лестницы\n- Количество ступеней\n- Ширина марша и глубина площадки\n- Высота пути эвакуации по лестнице\n- Высота ограждения\n- Зазор между маршами\n\n## Какой СП за что отвечает\n\n| Документ | Что регулирует |\n|---|---|\n| [[СП 1.13130.2020]] | Габариты, уклон, число ступеней, ширина марша/площадки, высота пути эвакуации, высота ограждения — базовый источник |\n| [[СП 4.13130.2013]] | Уклон, ширина марша/площадки лестницы **выхода на кровлю** |\n| СП 477.1325800 (не в базе) | Уклон, ширина марша/площадки — для зданий **>75 м** |\n| СП 267.1325800 (не в базе, ранее удалена) | Высота ограждения — для зданий **>75 м** |\n| [[СП 54.13330.2022]] | Уклон, число ступеней, ширина марша/площадки — жильё |\n| [[СП 118.13330.2022]] | Уклон, ширина марша/площадки — общественные здания |\n| [[СП 113.13330.2023]] | Уклон, габариты ступеней, число ступеней — паркинг |\n| [[СП 59.13330.2020]] | Требования к габаритам ступеней и их поверхности — МГН |\n\n---\n\n## Что запрещено на путях эвакуации (СП1, п.4.3.6)\n\nКак правило, **не допускается**:\n- Ступени с разными габаритами в пределах одной лестничной клетки\n- Криволинейные лестницы, лестницы с забежными ступенями и разной шириной проступи\n\n**Исключения** (там это допустимо): лестницы, ведущие на неэксплуатируемую кровлю, на технические этажи, в служебные помещения с числом сотрудников менее 5.\n\nДополнительно: выступающие элементы не должны располагаться на путях эвакуации. Двери, выходящие на ЛК, в максимально открытом положении не должны уменьшать требуемую ширину площадок и маршей (СП1, п.4.4.2).\n\n**Перепады пола на путях эвакуации** — недопустимы перепады высот **менее 450 мм** без надлежащего оформления: в местах перепада нужна лестница числом ступеней **не менее 3** (СП1, п.4.3.5). Смысл правила: нельзя оставлять «незаметный» перепад в 1–2 ступени — это скрытая ловушка на путях эвакуации, он должен либо отсутствовать, либо быть полноценной лестницей.\n\n---\n\n## Габариты ступеней (СП1, п.4.4.3; СП59, п.6.2.8)\n\n- Глубина проступи — как правило, **не менее 25 см**\n- Высота подступенка — **не более 22 см и не менее 5 см**\n\n**Допустимые уменьшения глубины проступи:**\n- До **22 см** — криволинейные парадные/служебные лестницы, в узкой части\n- До **12 см** — лестницы в технические этажи/чердаки/некспл. кровлю, а также к служебным помещениям (кроме Ф5 категорий А/Б) с числом рабочих мест ≤5\n\n> [!note] Как измеряется высота ступени\n> По чистовым поверхностям путей эвакуации (от отделки пола до отделки поверхности ступени) — то есть с учётом финишных покрытий, не по черновому основанию. **Все ступени должны быть одинаковыми и учитывать разную толщину отделки** — если облицовка пола и ступеней разной толщины, это нужно закладывать в конструктив заранее, иначе первая/последняя ступень получится другой высоты.\n\n---\n\n## Уклон лестницы\n\n**Определение:** отношение высоты подступенка к глубине проступи.\n\n### Алгоритм нахождения требуемого уклона\n1. Проверить общие требования — СП1, подраздел 4.4 «Эвакуация по лестницам и лестничным клеткам»\n2. Сверить с профильным пунктом СП1 по классу Ф (например, для жилья — раздел 6, табл. 4)\n3. Сверить с требованиями профильного СП объекта (например, для жилого здания <75 м — СП54)\n\n### Таблица уклонов по расположению и классу Ф\n\n| Уклон (не более) | Где применяется | Класс Ф | Источник |\n|---|---|---|---|\n| Не нормируется | Аварийный выход через приямок | Любой | СП1, п.4.2.4 |\n| 1:1 | ИЖД, в т.ч. блокированные | Ф1.4 | СП1, п.6.2.2 |\n| 1:1 | Наружные открытые лестницы эвакуации из групповых ячеек | Ф1.1 (детсады) | СП1, п.5.2.1 |\n| Общее требование | — | Любой (см. профильный раздел) | СП1, п.4.4.3 |\n| 2:1 | Открытые лестницы к одиночным рабочим местам | — | — |\n| 1:1,5–1:1,75 | МКД и общежития квартирного типа | Ф1.3 | СП1, п.6.1.16 |\n| 1:2 | Паркинг | Ф5.2 | СП113, п.6.1.9 |\n| Общее требование | Общественные здания, надземные этажи (кроме проходов между рядами в залах) | Ф1.2, Ф2, Ф3, Ф4 | СП1, п.7.1.1 |\n| 1:1,5 | Подвальные/цокольные этажи, чердак, лестницы не для эвакуации; паркинг (подвал/чердак) | Ф5.2 | СП113, п.6.1.9 |\n| 60° (1:0,6) | Наружные открытые лестницы как 2-й/доп. выход | Кроме Ф4.1, Ф1.1 | СП1, п.7.1.2 |\n| 1:1,6 | Трибуны спортивных сооружений | Ф2.1 | СП1, п.7.3.9 |\n| 1:1,25 | Внутриквартирные лестницы (винтовые/забежные допустимы, проступь в середине ≥18 см) | Ф1.3 | СП1, п.6.1.16 |\n\n### Разобранный пример — подбор ступеней под требуемый уклон\n\n**Задача:** найти габариты ступени для лестницы, ведущей с подземного этажа жилого дома (без паркинга). Высота этажа (УЧП подземного этажа → УЧП первого этажа) — **3600 мм**.\n\n1. Делим высоту этажа на пробную высоту ступени → подбираем максимальную высоту ступени **200 мм** (3600/200 = 18 подъёмов — укладывается в лимит)\n2. По СП1 и СП54 максимальный уклон лестницы в подвальный этаж жилого здания — **1:1,25**\n3. Умножаем высоту ступени на требуемое отношение: 200 × 1,25 = **250 мм** — это минимальная глубина проступи (может быть больше, не может быть меньше)\n4. Проверяем по СП1 п.4.4.3: глубина проступи не может быть меньше 250 мм для этого случая — требование выполняется\n5. **Вывод:** ступени 200(h)×250(проступь) мм удовлетворяют требованиям и по уклону, и по габаритам\n\n---\n\n## Количество ступеней (СП1, п.4.4.4)\n\nЧисло подъёмов в одном марше между площадками — **не менее 3 и не более 16** (кроме криволинейных лестниц). В одномаршевых лестницах, а также в одном марше двух-/трёхмаршевых лестниц **в пределах первого этажа** — допускается до **18** подъёмов.\n\n---\n\n## Ширина марша и глубина площадки\n\n- Глубина площадки — не менее ширины марша (кроме промежуточной площадки в одномаршевой лестнице)\n- Ширина марша измеряется **в свету** — от чистовой поверхности стены до ограждения, либо между ограждениями\n- Ширина пути эвакуации по лестнице должна быть не менее требуемой ширины любого эвакуационного выхода на неё\n\n### Основные значения ширины марша (уточнять по конкретному СП для числа эвакуирующихся)\n\n| Тип здания/расположение | Ширина марша |\n|---|---|\n| Жилые секционные, высота <75 м | 1,05 м |\n| Жилые коридорные, высота <75 м | 1,20 м |\n| Жилые, высота >75 м | 1,20 м |\n| Подземные этажи жилых зданий | 0,9 м |\n| Паркинги | 1,0 м |\n\n> [!warning] Особенность паркингов — ширина марша может «вырасти»\n> При нахождении в помещении паркинга более 50 человек (примерно от 50 машино-мест) ширина эвакуационного выхода принимается равной **1,2 м** (СП1, п.4.2.19) — вслед за этим меняется и требуемая ширина марша лестницы: с базовых 1,0 м на 1,2 м. Это частая ошибка — взять базовое значение 1,0 м не проверив вместимость.\n\n---\n\n## Высота пути эвакуации по лестнице\n\nНе менее **2,2 м** (СП1, п.4.4.1), измеряется по вертикали от ступени.\n\n> [!warning] Учитывай балки при сборных маршах\n> Балки для опирания сборных маршей выступают вниз (высота балки — около **200 мм**) и могут «съедать» требуемые 2,2 м, особенно на первом этаже, где чаще всего возникают проблемы с этим просветом. У монолитных маршей дополнительных выступов не предусматривается — с ними проще.\n\n---\n\n## Высота ограждения\n\n**Норма (СП54, п.6.4.5 / СП118, п.6.12):**\n- Внутренние марши/площадки — не менее **0,9 м**\n- При зазоре между маршами/ограждениями **>0,12 м** (жильё) или **>0,3 м** (общественные, СП118) — не менее **1,2 м**\n- Наружные лестницы/балконы/лоджии/террасы/перепады пола ≥0,45 м — всегда не менее **1,2 м**\n\n> [!note] Внутренняя практика (рекомендация, не жёсткая норма)\n> Рекомендуемая высота ограждения внутренней лестницы — **1,2 м** даже там, где норма формально допускает 0,9 м. Применение пониженного варианта 0,9 м — **согласовывать с ГИПом** отдельно, а не использовать по умолчанию просто потому, что формально можно.\n\nДля зданий **>75 м** — высота ограждения по **СП267.1325800** (документ не в базе, ранее был удалён).\n\nДля зданий с детьми — см. отдельно СП118, п.6.13 (высота 1,2 м, для детей с нарушением развития — 1,8 м/1,5 м, поручни на двух уровнях 0,9 м и 0,5 м) — уже разобрано в предыдущей версии заметки, актуально по-прежнему.\n\n---\n\n## Зазор между маршами (межмаршевая ширина в свету)\n\n| Условие | Зазор |\n|---|---|\n| Пожарно-техническая высота < 75 м | **75 мм** (СП4, п.7.14) |\n| Пожарно-техническая высота > 75 м | **120 мм** (СП477, п.8.6 — не в базе) |\n\n**Допускается не предусматривать зазор:**\n- Лестницы двухэтажных зданий высотой не более 12 м до отметки пола 2-го этажа, а также лестницы в одноэтажный подвал (СП4, п.7.14)\n- В зданиях до 75 м — если в ЛК типа Л1/Л2 либо в лифтовом холле лифта для пожарных предусмотрен **сухотруб** (СП4, п.7.14)\n- В зданиях выше 75 м — если в объёме незадымляемой ЛК предусмотрен сухотруб (СП477, п.8.6)\n\n---\n\n## Ширина дверей на путях эвакуации\n\n- Ширина выходов из ЛК наружу или в вестибюль — не менее требуемой ширины эвакуационного пути по маршу (СП1, п.4.2.20)\n- Ширина входа на ЛК с типовых жилых этажей — не менее **0,8 м** в свету; при передвижении МГН — не менее **0,9 м**\n- При требуемой суммарной ширине выхода ≥1,2 м и наличии нескольких выходов из ЛК — суммарная ширина не менее требуемого значения, при этом каждый отдельный выход — не менее **0,9 м**\n\n---\n\n## Дополнительные детали\n\n- Перед наружной дверью (эвакуационным выходом) — горизонтальная площадка длиной и шириной не менее **1,5× ширины полотна двери** (СП1, п.4.2.21)\n- Выход на **неэксплуатируемую** кровлю **не считается** путём эвакуации — высота порога может быть больше 50 мм\n- На неэксплуатируемой кровле порог должен быть выше отметки кровли на **150 мм** (защита от осадков) — **СП17, п.9.14** (документ не в базе)\n- Ширина тамбуров/тамбур-шлюзов — шире дверного проёма не менее чем на 0,5 м; глубина — больше дверного полотна не менее чем на 0,5 м, но не менее 1,5 м (СП1, п.4.3.11 — совпадает с [[Эвакуационные и аварийные выходы — раздел 4.2 СП1.13130]])\n\n---\n\n## Выходы на кровлю (СП4, п.7.5–7.6)\n\n- **П.7.5:** на чердаках (кроме Ф1.4) — выходы на кровлю со стационарными лестницами, через двери/люки/окна не менее **0,6×0,8 м**\n- **П.7.6:** выходы с ЛК на кровлю/чердак — по лестничным маршам с площадками перед выходом через противопожарные двери 2-го типа не менее **0,75×1,5 м**. Марши/площадки — из негорючих материалов, уклон не более **2:1**, ширина не менее **0,9 м**. Пределы огнестойкости не требуются, кроме случаев, когда эти участки — пути эвакуации.\n- Допускается выход на кровлю из незадымляемой ЛК типа **Н2(Н3)**, в том числе со смещением стен в горизонтальной проекции, через противопожарный люк 2-го типа не менее **0,8×1,2 м** по закреплённой металлической лестнице.\n\n---\n\n## Особый нюанс — подземные лестницы через противопожарную рассечку\n\nВыходы из подземных этажей должны вести непосредственно наружу и быть **обособлены** от общих ЛК здания (СП1, п.4.2.2). Лестница, обособленная через противопожарную рассечку, считается **отдельной** лестницей — и может иметь **уклон ступеней, отличающийся** от надземной части. Это удобно практически: не нужно тянуть уклон подземной парковки/техпространства под требования жилых этажей, если рассечка есть.\n\n---\n\n## Открытые вопросы (не проверено дословно)\n- СП477.1325800 и СП267.1325800 (требования для зданий >75 м) — документы не в базе, есть только ссылки на конкретные пункты\n- СП17 (кровли, п.9.14) — документ не в базе\n\n---\n\n## Связанные заметки\n[[СП 1.13130.2020]] · [[СП 4.13130.2013]] · [[СП 54.13330.2022]] · [[СП 118.13330.2022]] · [[СП 113.13330.2023]] · [[СП 59.13330.2020]] · [[Лестничные клетки — типы Л1 Л2 Н1 Н2 Н3]] · [[Пути эвакуации — жилые здания (Ф1.3)]] · [[Эвакуационные и аварийные выходы — раздел 4.2 СП1.13130]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[Нормативная база — карта]]\n", "diagrams": []}, {"title": "Лестничные клетки — типы Л1 Л2 Н1 Н2 Н3", "file": "Лестничные клетки — типы Л1 Л2 Н1 Н2 Н3", "md": "#нормативка #пожарная_безопасность #эвакуация #справочник\n\n← [[Пути эвакуации — жилые здания (Ф1.3)]] · [[Эвакуационные и аварийные выходы — раздел 4.2 СП1.13130]] · [[Нормативная база — карта]]\n\n# Лестничные клетки — типы Л1/Л2/Н1/Н2/Н3 и требования к каждому\n\n**Документы:** [[123-ФЗ]] (ст.40 — определения) · [[СП 1.13130.2020]] (п.4.4.11–4.4.18 — конструктивные требования)\n\n---\n\n## Определения (123-ФЗ, ст.40)\n\n**Обычные лестничные клетки:**\n- **Л1** — с естественным освещением через остеклённые/открытые проёмы в наружных стенах на каждом этаже; либо без освещения, если предназначены для эвакуации только из подвального этажа\n- **Л2** — с естественным освещением через остеклённые/открытые проёмы **в покрытии**\n\n**Незадымляемые лестничные клетки** (различаются по способу защиты от задымления):\n- **Н1** — вход с этажа через незадымляемую **наружную воздушную зону** по открытым переходам\n- **Н2** — **подпор воздуха** на лестничную клетку при пожаре\n- **Н3** — вход на каждом этаже через **тамбур-шлюз**, в котором постоянно или при пожаре обеспечивается подпор воздуха\n\n---\n\n## Где какой тип разрешён (общие правила по высоте)\n\n```mermaid\nflowchart TD\n    A[\"Высота здания\"] -->|\"≤28 м\"| B[\"Л1 — можно в любом классе Ф\"]\n    A -->|\"≤9 м (до 12 при автооткрывании светопроёма)\"| C[\"Л2 — доп. условия ниже\"]\n    A -->|\">28 м\"| D[\"Незадымляемая, как правило Н1\"]\n    D --> E[\"До 50% ЛК (Ф1-Ф4) можно заменить<br/>на Н3 или Н2-с-тамбуром\"]\n```\n\n**Л1** (п.4.4.15) — в зданиях всех классов Ф высотой до 28 м, а также при надстройке здания одним этажом.\n\n**Л2** (п.4.4.16) — в зданиях I, II, III степени огнестойкости, классов С0/С1, функциональных классов Ф1–Ф4, высотой **как правило не более 9 м**. Можно увеличить до **12 м** — при автоматическом открывании верхнего светового проёма при пожаре (кроме лечебных учреждений со стационаром). Количество таких ЛК (**кроме Ф1.3 и Ф1.4** — то есть кроме жилья!) — не более **50%**, остальные ЛК должны иметь световые проёмы в наружных стенах на каждом этаже.\n\n**Незадымляемые, п.4.4.18** — здания всех классов Ф высотой **>28 м** (кроме Ф5 категорий В/Д без постоянного пребывания людей), а также Ф5 категорий А/Б **вне зависимости от высоты** → как правило **Н1**. Допускается в зданиях Ф1–Ф4 **до 50%** заменить на Н3 или Н2-с-тамбуром (конструктивно как тамбур-шлюз 1-го типа). В многофункциональных зданиях ЛК, соединяющие части разной функциональной опасности, — тоже незадымляемые, независимо от высоты здания в целом.\n\n---\n\n## Конструктивные требования — по каждому типу\n\n### Л1 — световые проёмы (п.4.4.12)\nПлощадь остекления **не менее 1,2 м²**, один из габаритных размеров остеклённой части — не менее **0,6 м**, в наружных стенах на каждом этаже.\n\nИсключения (можно без световых проёмов): ЛК типа Л2, ЛК цокольных этажей (заглубление >0,5 м)/подвалов/подземных этажей, колосниковые ЛК. Также допускается без световых проёмов не более **50%** эвакуационных ЛК в пожарном отсеке зданий классов **Ф2–Ф4** и **Ф5 категорий Г/Д**, а также Ф5 категории В высотой до 28 м — но тогда эти ЛК должны быть **Н3**, либо **Н2 с тамбуром** (конструктивно как тамбур-шлюз 1-го типа) для Ф2–Ф4; для Ф5 — только Н3.\n\n### Л2 — световые проёмы в покрытии\nПлощадь **не менее 4 м²**, просвет между маршами шириной **не менее 0,7 м**; **либо** световая шахта на всю высоту ЛК с площадью горизонтального сечения **не менее 2 м²**.\n\n### Н1 — воздушная зона (п.4.4.14)\n- Выход **только непосредственно наружу**, в том числе через тепловой тамбур\n- Переход через наружную воздушную зону — ширина **не менее 1,2 м**, высота ограждения **не менее 1,2 м**\n- Простенок в воздушной зоне между проёмами ЛК и проёмами коридора этажа — **не менее 1,2 м**\n\n**Для секционных домов высотой >28 м (п.6.1.7):** выход наружу из Н1 допускается устраивать через вестибюль — при отсутствии выходов в вестибюль из автостоянки (кроме выхода из лифта для пожарных), вестибюль отделён от коридоров/помещений противопожарными перегородками **1-го типа** с дверями **2-го типа**; сообщение ЛК с вестибюлем — через воздушную зону (на 1-м этаже проём зоны допустимо заполнить металлической решёткой).\n\n### Н2 — подпор воздуха (п.4.4.13)\nСтены Н2 **не должны иметь иных проёмов**, кроме:\n- неоткрывающихся оконных проёмов в наружных стенах\n- дверных проёмов — в помещения/поэтажные коридоры/холлы/вестибюли, защищённые вытяжной противодымной вентиляцией, или проёмов наружу\n- отверстий для подачи воздуха с целью создания избыточного давления\n\nПротиводымная защита — по **СП7.13130** (документ не в базе).\n\n### Н3 — тамбур-шлюз\nВход на каждом этаже через тамбур-шлюз с подпором воздуха — постоянным или срабатывающим при пожаре (в отличие от Н2, где подпор идёт непосредственно в объём самой ЛК).\n\n---\n\n## Частая путаница — на что обратить внимание\n\n> [!warning] Л1/Л2 vs Н1/Н2/Н3 — это не «более лёгкая» и «более тяжёлая» версия одного и того же\n> Л1/Л2 — обычные ЛК, защита от задымления вообще не предусмотрена конструктивно (только естественное проветривание через окна). Н1/Н2/Н3 — принципиально другой уровень: активная защита от задымления (воздушная зона, подпор, тамбур-шлюз). Нельзя «просто взять Л1 и утеплить» вместо Н1 — это разные конструктивные решения.\n\n> [!warning] Н1 vs Н2 vs Н3 — где именно происходит защита от дыма\n> - **Н1** — дым не пускают вообще внутрь здания на пути к ЛК: сначала выходишь на открытую воздушную зону снаружи, потом заходишь на ЛК\n> - **Н2** — дым не пускают конкретно в саму ЛК: подпор воздуха создаёт избыточное давление именно в объёме лестничной клетки\n> - **Н3** — дым не пускают через тамбур-шлюз перед входом на каждом этаже — защита на уровне входа, а не всей ЛК целиком\n\n---\n\n## Открытые вопросы (не проверено дословно)\n- Требования СП7.13130 к противодымной защите Н2 (документ не в базе)\n- Требования к тамбур-шлюзам Н3 (расход воздуха, конструктив) — общая логика тамбур-шлюзов есть в [[Пожарные отсеки и противопожарные преграды]], но специфика именно для Н3 не проверялась отдельно\n\n---\n\n## Связанные заметки\n[[123-ФЗ]] · [[СП 1.13130.2020]] · [[Пути эвакуации — жилые здания (Ф1.3)]] · [[Эвакуационные и аварийные выходы — раздел 4.2 СП1.13130]] · [[Пожарные отсеки и противопожарные преграды]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[Нормативная база — карта]]\n", "diagrams": ["<svg viewBox=\"0 0 620 350\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans, sans-serif\">\n<defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4A6178\"/></marker></defs>\n<rect x=\"0\" y=\"0\" width=\"620\" height=\"350\" fill=\"#FAFBFC\"/>\n<rect x=\"210\" y=\"15\" width=\"200\" height=\"45\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"310.0\" y=\"41.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"310.0\" dy=\"0\">Высота здания</tspan></text><line x1=\"230\" y1=\"60\" x2=\"105\" y2=\"134\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"74.4\" y=\"91.0\" width=\"186.2\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"167.5\" y=\"100.0\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">≤9м (до 12 при автооткрыв.)</text><rect x=\"10\" y=\"140\" width=\"190\" height=\"65\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"105.0\" y=\"176.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"105.0\" dy=\"0\">Л2 — доп. условия ниже</tspan></text><line x1=\"310\" y1=\"60\" x2=\"310\" y2=\"134\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"289.5\" y=\"91.0\" width=\"41.0\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"310.0\" y=\"100.0\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">≤28 м</text><rect x=\"215\" y=\"140\" width=\"190\" height=\"55\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"310.0\" y=\"171.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"310.0\" dy=\"0\">Л1 — можно в любом классе Ф</tspan></text><line x1=\"390\" y1=\"60\" x2=\"515\" y2=\"134\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"432.0\" y=\"91.0\" width=\"41.0\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"452.5\" y=\"100.0\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">>28 м</text><rect x=\"420\" y=\"140\" width=\"190\" height=\"55\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"515.0\" y=\"163.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"515.0\" dy=\"0\">Незадымляемая, как правило</tspan><tspan x=\"515.0\" dy=\"15\">Н1</tspan></text><line x1=\"515\" y1=\"195\" x2=\"515\" y2=\"262\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"390\" y=\"270\" width=\"220\" height=\"65\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"500.0\" y=\"291.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"500.0\" dy=\"0\">До 50% ЛК (Ф1-Ф4) можно</tspan><tspan x=\"500.0\" dy=\"15\">заменить на Н3 или</tspan><tspan x=\"500.0\" dy=\"15\">Н2-с-тамбуром</tspan></text>\n</svg>"]}, {"title": "Пути эвакуации — жилые здания (Ф1.3)", "file": "Пути эвакуации — жилые здания (Ф1.3)", "md": "#нормативка #пожарная_безопасность #эвакуация #жилые_здания #справочник\n\n← назад: [[Блок 1 — Пожарная безопасность и эвакуация]] · [[Класс функциональной пожарной опасности]] · [[Нормативная база — карта]]\n\n---\n\n# Пути эвакуации — жилые здания (Ф1.3)\n\nСводная заметка — сверена с текстом [[СП 1.13130.2020]] там, где было возможно. **Не весь материал независимо проверен по первоисточнику** — отмечено отдельно, где именно.\n\n**Документы:** [[СП 1.13130.2020]] (разделы 4, 6, 9) · [[123-ФЗ]] (ст. 40, 89) · [[СП 4.13130.2013]] · [[СП 113.13330.2023]] · [[СП 59.13330.2020]]\n\n---\n\n## 0. Последовательность определения — алгоритм\n\nПорядок, в котором каждый следующий шаг либо сужает набор вариантов, либо навешивает обязательства на уже сделанный выбор:\n\n```mermaid\nflowchart TD\n    A[\"Тип дома\"] -->|коридорный/галерейный| A2[\"СП1.13130, п.6.1.6 — отдельное правило\"]\n    A -->|секционный| B[\"Пожарно-техническая высота\"]\n\n    subgraph SEC[\"Секционные дома\"]\n    B -->|\"до 9(12) м\"| C1[\"Площадь квартир на этаже\"]\n    B -->|\"до 28 м\"| C2[\"Площадь квартир на этаже\"]\n    B -->|\"28-75 м\"| C3[\"Площадь квартир на этаже\"]\n    B -->|\"более 75 м\"| C4[\"Площадь квартир на этаже\"]\n\n    C1 -->|\"≤550 м²\"| D1a[\"1 выход, тип Л2\"]\n    C1 -->|\">550 м²\"| D1b[\"2 выхода, тип Л2 (оба)\"]\n\n    C2 -->|\"≤550 м²\"| D2a[\"1 выход, тип Л1<br/>500-550: + адресная сигнализация\"]\n    C2 -->|\">550 м²\"| D2b[\"2 выхода: Л1 + Н2/Н3 без окон\"]\n\n    C3 -->|\"≤500 м²\"| D3a[\"1 выход: Н1,<br/>либо замена на Н2 по п.6.1.3\"]\n    C3 -->|\"500-550 м²\"| D3b[\"1 выход, Н1 + сигнализация\"]\n    C3 -->|\">550 м²\"| D3c[\"2 выхода: Н1 + Н2 без окон\"]\n\n    C4 -->|\"≤550 м²\"| D4a[\"1 выход, Н2 + тамбур-шлюз\"]\n    C4 -->|\">550 м²\"| D4b[\"2 выхода: оба Н2 (один может быть Н3)\"]\n    end\n```\n\n**Ключевой момент, который раньше терялся:** площадь квартир на этаже — это всегда проверка **двух** переменных сразу: **числа выходов** (растёт с площадью почти везде) и **типа ЛК** (в большинстве диапазонов тоже меняется/усложняется с площадью, кроме самого нижнего — там до 9–12 м тип всегда Л2, меняется только количество выходов, 1 или 2).\n\n**Логика порядка:**\n1. **Тип дома** — развилка в начале, для коридорных домов работает отдельный пункт 6.1.6, а не общая матрица\n2. **Высота** — задаёт стартовый диапазон допустимых типов ЛК ещё до учёта площади\n3. **Площадь квартир на этаже секции** — внутри уже выбранного диапазона определяет число выходов и допустимые замены базового типа\n4. **Пакет условий под замену** — если выбрана облегчённая замена (Н2 вместо Н1 и т.п.), это не опция «просто взять», а обязательный набор мер (тамбур-шлюз, сигнализация, СОУЭ, лифт для пожарных)\n5. **Аварийные выходы** — независимая проверка, накладывается поверх уже выбранного типа ЛК\n6. **МГН на этажах** — пожаробезопасная зона 4-го типа прямо исключает Н2 (быстро выхолаживается), может «отменить» ранее выбранный вариант\n7. **Геометрия** — ширина марша/уклон (зависит от типа дома с шага 1) → зазор между маршами → высота ограждения\n\n---\n\n## ⚠️ Исправление: 500 и 550 — это не противоречие, а два разных пункта\n\n**Предыдущая версия этой заметки ошибочно утверждала, что порог «550 м²» — опечатка.** Это неверно — при дальнейшей проверке нашёлся **п. 6.1.1 СП1.13130**, который регулирует **количество** эвакуационных выходов (в отличие от п. 6.1.3, который регулирует **тип** ЛК при замене Н1 на Н2 — это другой вопрос):\n\n> «Не менее двух эвакуационных выходов, как правило, должны иметь этажи здания при общей площади квартир на этаже (на этаже секции) более 500 м². Допускается в жилых зданиях с общей площадью квартир на этаже (этаже секции) **от 500 до 550 м²** устройство одного эвакуационного выхода с этажа: при высоте расположения верхнего этажа не более 28 м — в обычную лестничную клетку при условии оборудования прихожих в квартирах датчиками адресной пожарной сигнализации; при высоте более 28 м — в одну незадымляемую ЛК типа Н1 при условии оборудования всех помещений квартир (кроме санузлов, ванных комнат, душевых) датчиками адресной пожарной сигнализации или автоматическим пожаротушением.»\n\nДиапазон «500–550 м²» — это реальная переходная зона **для числа выходов**, а не ошибка. Матрица в разделе 2 ниже остаётся верной, но её основание — **два разных пункта на разные вопросы**, не один и тот же порог, процитированный дважды.\n\n---\n\n## 1а. Что вообще определяет число эвакуационных выходов\n\nЭто два независимых слоя правил — общий (для любых зданий) и специфический для жилья.\n\n### Общие правила — СП1.13130, п. 4.2.7–4.2.17\nНе менее двух выходов должны иметь:\n- Помещение с одновременным пребыванием **≥50 человек**\n- Подвал/цоколь (заглубление >0,5 м) с пребыванием >6 человек (при 6–15 человек один из двух выходов допускается аварийным)\n- Помещение (кроме Ф5) с расстоянием по проходу до выхода >25 м, рассчитанное на <50 человек\n- Помещение, если суммарно с проходными смежными помещениями набирается ≥50 человек\n- Этажи классов Ф1.1, Ф1.2, Ф2.1, Ф2.2, Ф3, Ф4 — как правило (искл.: высота этажа ≤15 м + класс Ф1.2/Ф3/Ф4.3 + площадь ≤300 м² + ≤20 человек → допустим 1 выход, при условии противопожарных дверей 2-го типа на входе на ЛК)\n- Этажи с численностью **≥50 человек**\n- Подвальные/цокольные этажи (заглубление >0,5 м) площадью >300 м² или пребыванием >15 человек — дополнительно делятся на секции ≤700 м² противопожарными преградами\n\nДополнительно: число выходов из здания не может быть меньше числа выходов с любого этажа (п. 4.2.15); при необходимости 2+ выходов они должны быть **рассредоточены** — минимальное расстояние между ближайшими гранями выходов не менее половины максимальной диагонали помещения (для коридора: L ≥ 0,4·D, где D — длина коридора).\n\n### Специфика для жилых Ф1.3 — СП1.13130, п. 6.1.1\nЭто основа матрицы в разделе 2 ниже:\n- Площадь квартир на этаже (этаже секции) **>500 м²** → как правило 2 выхода\n- **500–550 м²** → допустим 1 выход при адресной пожарной сигнализации (условия зависят от высоты, см. цитату выше)\n- При одном выходе — каждая квартира выше 15 м должна иметь аварийный выход (п. 4.2.4)\n\n---\n\n## 1. Типы лестничных клеток — базовые определения\n\n→ Полные конструктивные требования к каждому типу (световые проёмы, воздушные зоны, подпор воздуха) — **[[Лестничные клетки — типы Л1 Л2 Н1 Н2 Н3]]**\n\n**Секционный дом (СП54.13330.2022, п. 3.1.10):** многоквартирное жилое здание, состоящее из одной или нескольких секций, отделённых друг от друга стенами без проёмов; **квартиры одной секции имеют выход на одну лестничную клетку непосредственно, через коридор или лифтовый холл**. Секция — компактный кластер квартир вокруг «своей» лестницы.\n\n**Коридорный/галерейный дом:** квартиры выходят не в небольшой холл при лестнице, а в общий протяжённый коридор (внутренний) или галерею (открытую), которые могут обслуживать значительно больше квартир и вести к меньшему числу лестниц на большем расстоянии.\n\n> [!important] Разные принципы нормирования, не просто разная геометрия\n> Для **секционных** домов работает матрица «высота × площадь квартир на секции» (см. раздел 2) — если квартир на этаже много, требуется **второй полноценный эвакуационный выход**. Для **коридорных/галерейных** — действует отдельный пункт **6.1.6 СП1.13130**:\n> > «В жилых зданиях коридорного (галерейного) типа при общей площади квартир на этаже до 500 м² допускается предусматривать выход на одну лестничную клетку типа Н1 при высоте здания более 28 м или типа Л1 при высоте здания менее 28 м при условии, что в конце тупиковых участков коридоров (галерей) предусмотрены выходы на наружные лестницы 3-го типа, ведущие до отметки пола второго этажа. Если сама лестничная клетка размещается в конце тупикового участка, допускается устройство одной лестницы 3-го типа в противоположном тупиковом участке».\n>\n> То есть вместо «второго полноценного выхода» коридорный дом получает **одну ЛК + запасной путь понизу** (наружная лестница 3-го типа в тупике коридора) — принципиально другое конструктивное решение той же задачи избыточности путей, а не более мягкий вариант того же требования.\n\nИз 123-ФЗ, ст. 40:\n\n**Обычные:**\n- **Л1** — с естественным освещением через остеклённые/открытые проёмы в наружных стенах на каждом этаже\n- **Л2** — с естественным освещением через проёмы в покрытии\n\n**Незадымляемые:**\n- **Н1** — вход с этажа через незадымляемую наружную воздушную зону по открытым переходам\n- **Н2** — с подпором воздуха на лестничную клетку при пожаре\n- **Н3** — вход на каждом этаже через тамбур-шлюз с постоянным или пожарным подпором воздуха\n\n**Условия применения (СП1.13130, разд. 4):**\n- Л1 — здания всех классов Ф высотой до 28 м\n- Л2 — здания I, II, III степеней огнестойкости, класса С0/С1, класса Ф1/Ф2/Ф3/Ф4, высотой обычно не более 9 м (до 12 м — при автоматическом открывании верхнего светового проёма); для классов кроме Ф1.3/Ф1.4 — не более 50% лестничных клеток без световых проёмов\n- Высота более 28 м (кроме Ф5 категорий В,Д без постоянного пребывания людей) — требуется незадымляемая, как правило **Н1**; допускается до 50% — Н3 или Н2-с-тамбуром (для Ф1–Ф4)\n\n---\n\n## 2. Матрица выбора ЛК для Ф1.3 — по высоте и площади квартир на этаже секции\n\n> [!important] Площадь квартир на этаже — не то же самое, что площадь этажа в пределах отсека\n> Для этой матрицы считается **площадь квартир** (сумма отапливаемых помещений, без лоджий/балконов/тамбуров — то же определение, что в [[Площади здания — термины ТЭП]]), а не «площадь этажа в пределах пожарного отсека», которая используется в таблице 6.8 СП2.13130 для подбора степени огнестойкости. Это два разных числа для одного и того же этажа.\n\n### Высота до 9 м (жилые I, II, III ст. огнестойкости)\n| Площадь квартир на этаже | Выходов | ЛК |\n|---|---|---|\n| до 500 м² | 1 | Л2 |\n| 500–550 м² | 1 | Л2 |\n| более 550 м² | 2 | Л2 |\n\n### Высота до 12 м (при автоматическом открывании верхнего светового проёма)\nТе же условия по площади/выходам, ЛК — Л2.\n\n### Высота до 28 м\n| Площадь квартир на этаже | Выходов | ЛК |\n|---|---|---|\n| до 500 м² | 1 | Л1 (при адресных извещателях в прихожих + СОУЭ 2-го типа) |\n| 500–550 м² | 1 | Л1 (те же условия) |\n| более 550 м² | 1 | Н2 или Н3 без естественного освещения (постоянное искусственное освещение по 1-й категории надёжности + фотолюминесцентные элементы по ГОСТ 34428-2018) |\n| более 550 м² | 2 | Один выход — Л1; альтернатива для обоих — Н2/Н3 без естественного освещения на тех же условиях |\n\n### Высота от 28 до 75 м — наш случай из кейса\n| Площадь квартир на этаже | Выходов | ЛК |\n|---|---|---|\n| до 500 м² | 1 | Н1 (при адресных извещателях, кроме санузлов/ванных); **либо** Н2 вместо Н1 при выполнении условий п.6.1.3 (тамбур-шлюз с подпором на каждом этаже, выход наружу, лифт для пожарных по ГОСТ Р 53296, адресные извещатели или автопожаротушение во всех помещениях квартир, СОУЭ 1-го типа) |\n| 500–550 м² | 1 | Н1 (адресные извещатели) |\n| более 550 м² (реально >500) | **2** | Один выход — **Н1** (адресные извещатели); **второй** — Н2 без естественного освещения, вход на каждом этаже через тамбур-шлюз 1-го типа с подпором воздуха |\n\n> [!example] Разбор нашего кейса (48 м, 1200 м² на секцию)\n> Высота 48 м → диапазон «28–75 м». Площадь 1200 м² → более 500 м². По таблице выше: **2 эвакуационных выхода, один — Н1 (с адресной пожарной сигнализацией во всех помещениях квартир кроме санузлов/ванных), второй — Н2 без естественного освещения, с тамбур-шлюзом 1-го типа с подпором воздуха на каждом этаже.** Это отличается от первоначального ответа (оба выхода Н2) — та формулировка относится к диапазону >75 м, не к 28–75 м.\n\n### Высота более 75 м\n| Площадь квартир на этаже | Выходов | ЛК |\n|---|---|---|\n| до 500 м² | 1 | Н2 с тамбур-шлюзом, подпор воздуха на каждом этаже |\n| 500–550 м² | 1 | Н2, то же самое |\n| более 550 м² | 2 | Н2 с тамбур-шлюзом на каждом этаже; при двух выходах — один из них допускается на ЛК типа Н2 или Н3 |\n\nДополнительно для этой высоты: лестничные клетки допускаются без световых проёмов на каждом этаже при условии аварийного и эвакуационного освещения по 1-й категории надёжности + фотолюминесцентные/фотоэмиссионные указатели по ГОСТ Р 12.2.143.\n\n---\n\n## 3. Аварийные выходы (не путать с эвакуационными)\n\nАварийный выход — не учитывается при расчёте эвакуации, но повышает безопасность. Виды (входит на балкон/лоджию с глухим простенком, на открытый переход в смежную секцию/отсек, через люк/окно с отметкой пола −4,5…+5,0 м, на кровлю зданий I–III ст.о. классов С0/С1).\n\n| Высота здания | Требование |\n|---|---|\n| до 28 м | ЛК типа Л1 → каждая квартира выше 15 м должна иметь аварийный выход |\n| более 9 м | ЛК типа Л2 → каждая квартира выше 4 м должна иметь аварийный выход |\n| 28–75 м | ЛК типа Н1/Н2 → каждая квартира выше 15 м должна иметь аварийный выход |\n| более 75 м | Аварийные выходы не требуются |\n\nДопускается не предусматривать аварийные выходы при спринклерном пожаротушении по всей площади квартир (или при выполнении условий п. 6.1.1 СП1.13130 — сам пункт не проверен дословно).\n\n---\n\n## 4. Параметры путей эвакуации — ширина, уклон, зазоры\n\n### Ширина и уклон марша (высота здания до 75 м)\n| Тип здания | Мин. ширина | Макс. уклон |\n|---|---|---|\n| Секционные двухэтажные | 1,05 м | 1:1,5 |\n| Секционные трёхэтажные и выше | 1,05 м | 1:1,75 |\n| Коридорного типа | 1,2 м | 1:1,75 |\n| В подвал/цоколь (>0,5 м заглубления), внутриквартирные | 0,9 м | 1:1,25 |\n\nЗазор между маршами — 75 мм (высота до 75 м).\n\n### Высота здания более 75 м\nШирина пути эвакуации по лестнице — мин. 1,2 м, макс. уклон 1:1,75, зазор между маршами — 120 мм.\n\nЭто совпадает с данными в [[Лестницы — ширина марша и высота ограждения]] — цифры согласованы между заметками.\n\n### Общие правила (не зависят от высоты)\n- Высота пути эвакуации по ЛК — не менее 2,2 м\n- Число подъёмов в марше — не менее 3, не более 16 (кроме криволинейных); в одномаршевых и в марше в пределах 1-го этажа двух-/трёхмаршевых — до 18\n- Двери на ЛК в открытом положении не должны уменьшать ширину площадок/маршей\n- ЛК должна иметь выход наружу непосредственно (в т.ч. через тепловой тамбур) или через вестибюль, отделённый перегородками с дверями; двери из ЛК в вестибюль — противопожарные 1-го типа\n- При единственной ЛК в здании, сообщающейся с вестибюлем, из неё дополнительно нужен выход прямо наружу\n- **В секционных домах высотой более 28 м** выход наружу из незадымляемых ЛК (тип Н1) допускается устраивать через вестибюль — при выполнении требований СП1.13130 (СП54.13330.2022, п.6.2.2.9)\n- Ширина выходов из ЛК наружу/в вестибюль — не менее ширины пути эвакуации по маршу\n- Перед наружной дверью — горизонтальная площадка длиной и шириной не менее 1,5 ширины полотна двери\n- В незадымляемых ЛК нельзя размещать лифты; в остальных — не более двух пассажирских, опускающихся не ниже 1-го этажа\n\n---\n\n## 5. Наибольшее расстояние от дверей квартир до ЛК/выхода наружу\n\n**Не проверено дословно по первоисточнику — рекомендую сверить при подготовке к защите.**\n\n### Высота здания до 75 м\n| Степень огнестойкости | Класс конструктивной опасности | Между ЛК/наружными входами | В тупиковый коридор/галерею |\n|---|---|---|---|\n| I, II | С0 | 40 м | 25 м |\n| II | С1 | 30 м | 20 м |\n| III | С0 | 30 м | 20 м |\n| III | С1 | 25 м | 15 м |\n| IV | С0 | 25 м | 15 м |\n| IV | С1, С2 | 20 м | 10 м |\n| V | не нормируется | 20 м | 10 м |\n\nСокращение до **12 м**, если в торце внеквартирного коридора нет окна площадью ≥1,2 м² и/или нет системы противодымной вентиляции.\n\n### Высота здания более 75 м\n| Степень огнестойкости | Класс | Между ЛК | Примечание |\n|---|---|---|---|\n| I, с повышенным пределом огнестойкости (табл. 6.1 **СП 477.1325800.2020** — этого документа нет в базе) | С0 | 25 м / 15 м (тупик) | 12 м для квартир на высоте более 75 м |\n\n⚠️ Для зданий выше 75 м расчёт напрямую зависит от **СП477.1325800.2020**, которого нет в текущей базе (ранее отмечен как категория C — нужен только вместе с СП267). Если проект когда-либо коснётся такой высоты — этот документ станет обязательным, не опциональным.\n\n### Ширина коридора (справочно, не проверено дословно)\n- не менее 1,4 м при длине коридора между лестницами (или торцом и лестницей) до 40 м\n- не менее 1,6 м при большей длине\n- Коридоры делятся на участки не более 30 м: в зданиях до 75 м — перегородками не ниже 2-го типа (EI 15) с дверями не ниже 3-го типа (EI 15); выше 75 м — перегородками не ниже EI 45 с дверями не ниже 2-го типа (EI 30)\n\n---\n\n## 6. Особые случаи — двухуровневые квартиры и антресоли\n\n### Двухуровневые (двухъярусные) квартиры\n- При высоте расположения верхнего уровня **более 18 м** — как правило, эвакуационный выход нужен с каждого уровня\n- Можно не предусматривать выход с каждого уровня, если на втором уровне нет выделенных перегородками помещений, или если квартира не выше 18 м и этаж без выхода на ЛК обеспечен аварийным выходом\n- Можно не предусматривать выход с верхнего уровня при одновременном: аварийный выход с верхнего уровня + адресная пожарная сигнализация и СОУЭ 1-го типа (или выше) во всех помещениях квартиры (кроме санузлов/ванных/душевых)\n- Внутриквартирная лестница (винтовая/с забежными ступенями) — ширина проступи в середине не менее 18 см, может быть деревянной\n\n### Квартиры с антресолью\n- Антресоль — площадка в объёме двусветного помещения площадью не более 40% площади пола, либо внутренняя площадка на этаже повышенной высоты (тот же лимит 40%)\n- Допускается в зданиях не ниже III степени огнестойкости\n- Предел огнестойкости несущих конструкций антресоли — не менее R 45, перекрытия — не менее REI 45\n- Эвакуация с антресоли вниз — по открытой (в т.ч. криволинейной) лестнице, огнестойкость и горючесть материалов такой лестницы не нормируются\n- Аварийный выход из квартир с антресолью — только на нижнем уровне\n\n---\n\n## 7. Пожаробезопасные зоны (для МГН)\n\nПомещение/часть здания, выделенное противопожарными преградами, для защиты МГН от опасных факторов пожара.\n\n**Расчёт количества людей:** МГН групп М2–М4 — не менее 1 человека на этаж (секцию) Ф1.3 (табл. 21 СП1.13130); группа М1 — не менее 35% для МКД (п. 9.1.4 СП1.13130).\n\n- **Зона 1-го типа** — отдельное помещение/лифтовой холл, выделенное конструкциями с нормируемым пределом огнестойкости (равным пределу внутренних стен ЛК соответствующей степени огнестойкости), с подпором воздуха или тамбур-шлюзом. Двери — не менее EI 60. Простенок между окном зоны и окнами смежных помещений — не менее 2 м. Под/над зоной нельзя размещать помещения иного назначения (кроме безнагрузочных — ЛК, лифтовые холлы, санузлы, категории В4/Д).\n- **Зона 2-го типа** — эксплуатируемая кровля, открытый балкон/лоджия/веранда/галерея; требуется незадымляемость, наружные стены в местах примыкания — без проёмов (кроме проёмов ЛК/эвакуационных выходов).\n- **Зона 4-го типа** — сама лестничная клетка (Н1, Н3, Л1, Л2 — **не Н2**, она быстро выхолаживается). Допустима только в Ф1.3, I–IV ст.о., с учётом размещения МГН на площадках ЛК.\n\nПлощадь зоны — по максимальному числу МГН с учётом манёвра (проекция человека на кресле-коляске — 0,96 м², 0,8×1,2 м, по Методике МЧС №1140 от 14.11.2022, табл. П2.5).\n\n---\n\n## 8. Встроенные функции — правила сообщения путей эвакуации\n\n### Внеквартирные хозяйственные кладовые\nРазмещение — в 1-м, цокольном, подвальном нежилых этажах МКД I–III ст.о., класс С0/С1 (СП4.13130, п.5.2.11). Каждая кладовая ≤10 м², блок кладовых ≤200 м², отделение противопожарными перегородками 1-го типа, проёмы 2-го типа.\n- Блок с 15+ кладовыми — не менее 2 выходов шириной ≥0,8 м, расчёт людей — 1 чел./кладовая\n- До 15 мест — аварийные выходы можно не предусматривать\n- Проходы между кладовыми — ≥0,9 м шириной, ≥2 м высотой\n\n### Встроенные помещения общественного назначения\n- Отделяются от жилой части перегородками не ниже 1-го типа, перекрытиями не ниже 3-го типа, без проёмов\n- Сообщение с общественной частью — только через вестибюль входной группы жилой части (1-й/цокольный этаж)\n- Разрешённые типы сообщающихся функций: уход за детьми (не образовательные услуги), приёмные пункты/прачечные до 75 кг/смену, продуктовые магазины до 150 м², тренажёрные/спортзалы, парикмахерские, помещения для собраний жильцов\n- Проход из вестибюля в общественные помещения: здания до 28 м — через тамбур типа тамбур-шлюза 1-го типа **без** подпора воздуха; выше 28 м — тамбур-шлюз **с** подпором воздуха. ЛК жилой части с выходом в этот вестибюль должны иметь ещё и выход прямо наружу; двери из ЛК в вестибюль — не ниже 3-го типа\n- Один эвакуационный выход допустим, если расстояние до него <25 м и одновременно ≤50 человек\n\n### Встроенные и встроенно-пристроенные стоянки автомобилей\n- Допустимы в подземных/цокольных/надземных этажах МКД, кроме Ф1.1, Ф4.1, Ф5 категорий А/Б\n- Степень огнестойкости стоянки — не ниже степени огнестойкости самого здания\n- Сообщение с вестибюлем/другими частями через **общие** ЛК и лифты допускается только при: шахты лифтов REI 120, двери шахт EI 60; выход из лифта в помещение хранения — через тамбур-шлюзы 1-го типа с раздельной подачей воздуха, или парно-последовательные тамбур-шлюзы; для общих ЛК — тамбур-шлюзы 1-го типа с подпором воздуха на каждом этаже стоянки + подпор в объём самой ЛК отдельной системой (при высоте здания ≤28 м — упрощённый вариант без подпора в ЛК)\n- Жилые этажи и этажи с ДОО/медицинскими организациями должны отделяться от стоянки техническим этажом или нежилым этажом\n- Не менее 2 рассредоточенных эвакуационных выходов с этажа отсека стоянки (наружу или на ЛК); при ≤5 машиномест — допустим 1 выход; один из двух выходов может вести на рампу (уклон ≤1:6, тротуар ≥0,8 м с одной стороны) или в смежный пожарный отсек стоянки\n- Общие ЛК, предусмотренные для функциональной связи стоянки с другими частями здания, **нельзя** использовать для эвакуации людей\n- Расстояние до ближайшего эвакуационного выхода (по табл. 19 СП1.13130): подземная стоянка — 40 м (между выходами) / 20 м (тупик); надземная — 60 м / 25 м\n- Двери эвакуационных выходов на ЛК автостоянок — противопожарные не ниже 1-го типа\n- Ширина маршей/площадок ЛК и лестниц 3-го типа в автостоянке — не менее 1 м\n\n---\n\n## 9. Лифты для пожарных подразделений и выходы на кровлю\n\n### Лифты для пожарных\nТребуются:\n- в каждом пожарном отсеке Ф1.1 высотой более 10 м\n- в каждом пожарном отсеке **Ф1.3 высотой более 50 м**\n- в отсеках прочих классов Ф выше 28 м\n- в подземных автостоянках более 2 этажей\n- при крышных котельных зданий выше 28 м\n- при отсутствии аварийных выходов из квартир (п.6.1.1)\n- при размещении пожаробезопасной зоны в лифтовом холле\n\nОсобенности: ниша/шкаф для переносной лестницы на посадочном этаже, маркировка пиктограммой, люк в крыше кабины, доступный подвесной потолок.\n\n### Выходы на кровлю\nТребуются в зданиях высотой ≥10 м (от отметки проезда пожарных машин до карниза/парапета) — с ЛК напрямую, через чердак, по лестницам 3-го типа или наружным пожарным лестницам.\n\nЧисло выходов — не менее 1 на каждые 100 м длины здания (чердачное покрытие) или на каждые 1000 м² кровли (бесчердачное) для Ф1–Ф4.\n\nМарши/площадки к выходу на кровлю — негорючие, уклон ≤2:1, ширина ≥0,9 м, двери 2-го типа не менее 0,75×1,5 м (или люки 2-го типа 0,6×0,8 м по стремянкам при высоте здания ≤15 м).\n\n---\n\n## Открытые вопросы (свериться отдельно при необходимости)\n- Точный текст п. 6.1.1 СП1.13130 (базовое правило для ЛК секционных домов, на которое ссылается 6.1.3) — не проверялся дословно\n- Таблица расстояний от дверей квартир до ЛК (раздел 5) — не сверена построчно с первоисточником\n- Табл. 6.1 СП477.1325800.2020 (повышенные пределы огнестойкости для зданий >75 м) — документ не в базе\n\n---\n\n## Связанные заметки\n[[СП 1.13130.2020]] · [[123-ФЗ]] · [[СП 4.13130.2013]] · [[СП 113.13330.2023]] · [[СП 59.13330.2020]] · [[Лестницы — ширина марша и высота ограждения]] · [[Пожарные отсеки и противопожарные преграды]] · [[Класс функциональной пожарной опасности]] · [[Блок 1 — Пожарная безопасность и эвакуация]] · [[Нормативная база — карта]]\n", "diagrams": ["<svg viewBox=\"0 0 900 390\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans, sans-serif\">\n<defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4A6178\"/></marker></defs>\n<rect x=\"0\" y=\"0\" width=\"900\" height=\"390\" fill=\"#FAFBFC\"/>\n<rect x=\"370\" y=\"15\" width=\"160\" height=\"45\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"450.0\" y=\"41.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"450.0\" dy=\"0\">Тип дома</tspan></text><line x1=\"400\" y1=\"60\" x2=\"130\" y2=\"114\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"191.7\" y=\"81.0\" width=\"146.6\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"265.0\" y=\"90.0\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">коридорный/галерейный</text><rect x=\"20\" y=\"120\" width=\"240\" height=\"55\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"140.0\" y=\"143.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"140.0\" dy=\"0\">СП1.13130, п.6.1.6 — отдельное</tspan><tspan x=\"140.0\" dy=\"15\">правило</tspan></text><line x1=\"460\" y1=\"60\" x2=\"640\" y2=\"114\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"513.0\" y=\"81.0\" width=\"74.0\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"550.0\" y=\"90.0\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">секционный</text><rect x=\"560\" y=\"120\" width=\"220\" height=\"45\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"670.0\" y=\"146.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"670.0\" dy=\"0\">Пожарно-техническая высота</tspan></text><line x1=\"670\" y1=\"165\" x2=\"670\" y2=\"202\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"20\" y=\"210\" width=\"200\" height=\"40\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"120.0\" y=\"233.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"120.0\" dy=\"0\">до 9(12) м</tspan></text><line x1=\"120\" y1=\"250\" x2=\"120\" y2=\"282\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"20\" y=\"290\" width=\"200\" height=\"62\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/><text x=\"120\" y=\"312\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\">≤550: 1вых Л2</text><text x=\"120\" y=\"328\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\">>550: 2вых Л2</text><rect x=\"250\" y=\"210\" width=\"200\" height=\"40\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"350.0\" y=\"233.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"350.0\" dy=\"0\">до 28 м</tspan></text><line x1=\"350\" y1=\"250\" x2=\"350\" y2=\"282\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"250\" y=\"290\" width=\"200\" height=\"62\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/><text x=\"350\" y=\"312\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\">≤550: 1вых Л1(+сигн.)</text><text x=\"350\" y=\"328\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\">>550: 2вых Л1+Н2/Н3</text><rect x=\"480\" y=\"210\" width=\"200\" height=\"40\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"580.0\" y=\"233.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"580.0\" dy=\"0\">28-75 м</tspan></text><line x1=\"580\" y1=\"250\" x2=\"580\" y2=\"282\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"480\" y=\"290\" width=\"200\" height=\"78\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/><text x=\"580\" y=\"312\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\">≤500: 1вых Н1</text><text x=\"580\" y=\"328\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\">500-550: 1вых Н1+сигн.</text><text x=\"580\" y=\"344\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\">>550: 2вых Н1+Н2</text><rect x=\"700\" y=\"210\" width=\"200\" height=\"40\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"800.0\" y=\"233.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"800.0\" dy=\"0\">>75 м</tspan></text><line x1=\"800\" y1=\"250\" x2=\"800\" y2=\"282\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"700\" y=\"290\" width=\"200\" height=\"62\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/><text x=\"800\" y=\"312\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\">≤550: 1вых Н2+тш</text><text x=\"800\" y=\"328\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\">>550: 2вых Н2</text>\n</svg>"]}, {"title": "Эвакуационные и аварийные выходы — раздел 4.2", "file": "Эвакуационные и аварийные выходы — раздел 4.2 СП1.13130", "md": "#нормативка #пожарная_безопасность #эвакуация #справочник\n\n← [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[Пути эвакуации — жилые здания (Ф1.3)]] · [[Нормативная база — карта]]\n\n# Раздел 4.2 СП1.13130.2020 — эвакуационные и аварийные выходы\n\nЭто **общая** глава (не привязана к конкретному классу Ф) — базовые правила, из которых потом строятся все объектные разделы (5–9 СП1.13130, включая жильё и МГН). До этого момента у нас были только разрозненные фрагменты этой главы — здесь собрана целиком.\n\n**Документ:** [[СП 1.13130.2020]], разделы 4.2–4.4\n\n---\n\n## Аварийные выходы — полный список (п.4.2.4)\n\nАварийные выходы **не учитываются** при проектировании путей эвакуации и не входят в расчёт числа/ширины эвакуационных выходов — это дополнительная мера безопасности, не замена эвакуации.\n\n**а)** Выход на балкон/лоджию с глухим простенком:\n- не менее **1,2 м** от торца балкона (лоджии) до оконного проёма (остеклённой двери)\n- **или** не менее **1,6 м** между остеклёнными проёмами, выходящими на балкон (лоджию)\n- простенки — в одной плоскости с проёмами\n- балкон/лоджия — ширина не менее **0,6 м**, неостеклённые **либо** с проветриванием по СП7.13130 и не менее **двух окон** ≥0,8 м² каждое (напротив простенка и напротив двери), верхняя кромка окон — не ниже **2,5 м** от пола балкона\n\n**б)** Выход на открытый наружный переход (галерею) шириной не менее **0,6 м** в смежную секцию/отсек — без ограждающих конструкций, препятствующих проходу, в том числе на границе секций\n\n**в)** Выход на балкон/лоджию шириной не менее **0,6 м** с лестницей (в т.ч. складной), соединяющей этажи через люк не менее **0,6×0,8 м**\n\n**г)** Выход прямо наружу из помещений с отметкой пола **не ниже −4,5 м и не выше +5,0 м** через окно/дверь ≥0,75×1,5 м или люк ≥0,6×0,8 м (приямок — с лестницей в приямке, люк — с лестницей в помещении)\n\n**д)** Выход на кровлю здания I–III степени, классов С0/С1, через окно/дверь/люк с лестницей по правилам подпункта «г» (уклон таких лестниц не нормируется)\n\n## Где и когда аварийный выход обязателен — по типам зданий\n\nП.4.2.4 — это только «словарь конструкций» (что физически может считаться аварийным выходом). А вот **обязательность** для конкретного типа здания задаётся отдельно, в объектных разделах 5–9 СП1.13130 (плюс СП54 для жилья). Общего правила «для всех одинаково» нет.\n\n| Тип / раздел | Условие, когда аварийный выход обязателен | Источник |\n|---|---|---|\n| **Ф1.2, гостиницы** — двухуровневые номера | Верхний уровень >18 м без выхода с каждого уровня → допустимо только при обеспечении аварийным выходом | п.7.2.3 |\n| **Ф1.3, МКД секционные** — этаж с одним эвакуационным выходом | Каждая квартира выше **15 м** — аварийный выход обязателен | п.6.1.1 |\n| **Ф1.3, здания с ЛК типа Л2** высотой >9 м | Аварийный выход обязателен в каждой квартире выше **4 м** | п.6.1.5 |\n| **Ф1.3, двухуровневые квартиры** | Верхний уровень >18 м → как правило выход с каждого уровня; **допустимо** аварийным вместо этого, если верхний уровень ≤18 м и на нём нет помещений, выделенных перегородками | п.6.1.12 |\n| **Ф1.3, надстройка существующего здания** (+1 этаж поверх существующих 28 м, с сохранением Л1) | Надстроенный этаж — аварийный выход **обязателен**, но с увеличенными простенками: **3,6 м** от торца до проёма (не 1,2 м, как в обычном случае!) или **4,8 м** между остеклёнными проёмами | п.6.1.4 |\n| **Ф1.4, одноквартирные/блокированные** — подвал/цоколь с выходом через вышестоящий этаж | Дополнительно нужен аварийный выход наружу (отметка ≥−4,5 м) через окно/дверь ≥0,75×1,5м или люк ≥0,6×0,8м | п.6.2.1 |\n| **Любое жильё, мансардный этаж** (СП54) | Аварийный выход на кровлю — с площадками/переходными мостиками, ограждение **≥1,2 м** | СП54, п.6.2.2.13 |\n| **Любое здание, подвал/цоколь** (общее правило) | При пребывании 6–15 человек — один из двух требуемых эвакуационных выходов **можно** сделать аварийным (это опция, не обязанность) | п.4.2.7 |\n\n> [!note] Секционные здания ≤28 м — доп. возможность (не обязанность)\n> Допускается устройство аварийных выходов **на кровлю** — с площадками и переходными мостиками к лестницам 3-го типа/П2/ЛК соседних секций (п.6.1.13). Это разрешение, не требование.\n\n⚠️ Обрати внимание на п.6.1.4 — это редкий случай, где параметры аварийного выхода **сильно строже** стандартных из п.4.2.4 (3,6/4,8 м вместо 1,2/1,6 м), потому что это надстройка поверх существующего здания с сохранённой (не изменённой) лестничной клеткой Л1 — компенсация за не незадымляемую ЛК на новом этаже.\n\n---\n\n```mermaid\nflowchart TD\n    A[\"Помещение/этаж/здание\"] --> B{\"Подпадает под критерий<br/>из списка ниже?\"}\n    B -->|да| C[\"Нужно ≥2 выхода\"]\n    B -->|нет| D[\"Достаточно 1 выхода\"]\n    C --> E[\"Рассредоточить:<br/>расстояние между гранями ≥ 0,5×диагонали;<br/>в коридоре L ≥ 0,4×D\"]\n```\n\n**Не менее двух выходов должны иметь (п.4.2.7):**\n- Помещения подвала/цоколя (заглубление >0,5м) с пребыванием >6 человек (при 6–15 человек — один из двух может быть аварийным по п.4.2.4\"г\")\n- Помещения с пребыванием **50 и более** человек одновременно\n- Помещения (кроме Ф5) на <50 человек, если путь до выхода **>25 м** (считая путь из смежных помещений, если через них тоже эвакуируются)\n- Помещение, если суммарно с примыкающими (у которых выход только через это помещение) набирается **≥50 человек**\n\n**п.4.2.8:** если из помещения нужно ≥2 выхода — через одно соседнее помещение допускается не более **50%** таких выходов.\n\n**п.4.2.9:** этажи классов **Ф1.1, Ф1.2, Ф2.1, Ф2.2, Ф3, Ф4** — как правило, ≥2 выхода.\nИсключение: высота этажа ≤15 м (кроме V степени) + класс Ф1.2/Ф3/Ф4.3 + площадь ≤300 м² + ≤20 человек + противопожарные двери 2-го типа на входе на ЛК → допустим 1 выход.\n\n**п.4.2.10:** этажи с численностью **≥50 человек** — ≥2 выхода.\n\n**п.4.2.11:** подвальные/цокольные этажи (заглубление >0,5м) площадью **>300 м²** или пребыванием **>15 человек** — ≥2 выхода; **плюс** обязательное деление на секции противопожарными преградами (перегородки ≥1-го типа, перекрытия ≥3-го типа), площадь секции ≤**700 м²**.\n\n**п.4.2.12 — технические этажи:** ≤300 м² → 1 выход; на каждые последующие 2000 м² — ещё 1 выход. В техподпольях выходы обособлены от прочих, ведут прямо наружу. Из тех.пространств только для прокладки сетей (без оборудования) — двери ≥0,75×1,5м или люки ≥0,6×0,8м. Расстояние между выходами из технических этажей — не более **100 м**.\n\n**п.4.2.13:** этаж должен иметь ≥2 выхода, если на нём есть хотя бы одно помещение, которому нужно ≥2 выхода.\n\n**п.4.2.14:** если этаж требует ≥2 выхода — все помещения на этаже должны иметь доступ ко всем требуемым выходам (не менее чем к двум).\n\n**п.4.2.15:** число выходов из здания ≥ числа выходов с любого этажа.\n\n**п.4.2.16 — рассредоточенность:**\n- расстояние между ближайшими гранями выходов в помещении — не менее **половины максимальной диагонали** помещения\n- в коридоре: **L ≥ 0,4·D**, где D — длина коридора\n\n**п.4.2.6 — многофункциональные здания:** части здания разной функциональной опасности, разделённые преградами, должны иметь самостоятельные выходы; допустимо не более **50%** выходов в соседние отсеки на одном этаже (если преграды — противопожарные стены/перегородки), **кроме** выхода в отсек класса Ф5 — туда так нельзя, и части класса Ф5 всегда должны иметь обособленные выходы.\n\n---\n\n## Тамбуры на путях эвакуации (п.4.3.11)\n\n- Ширина тамбура/тамбур-шлюза — больше ширины дверного проёма **не менее чем на 0,5 м**\n- Глубина — больше ширины дверного полотна **не менее чем на 0,5 м**, но не менее **1,5 м**\n- При выходе в тамбур двух и более дверей — траектории их открывания **не должны пересекаться**\n\n**п.4.3.12:** на путях эвакуации — аварийное освещение по [[СП 52.13330.2016]].\n\n---\n\n## Лестницы на путях эвакуации — общая таблица (п.4.4.1–4.4.3)\n\nЭто **базовая** таблица ширины марша по классам Ф — шире, чем то, что мы фиксировали раньше только для жилья:\n\n| Случай | Мин. ширина марша |\n|---|---|\n| Ф1.1, Ф2.1, Ф2.2, Ф3.4, Ф4.1 — посетители; или любой класс с >200 чел. на этаже (кроме 1-го) | **1,35 м** |\n| Здания с >600 чел. на этаже (кроме 1-го) | **1,6 м** |\n| Прочие здания, кроме Ф1.3/Ф1.4/Ф5 | **1,2 м** |\n| **Ф1.3** | **1,05 м** |\n| Лестницы к одиночным рабочим местам / ≤5 человек | **0,7 м** |\n| Все остальные случаи | **0,9 м** |\n\nВысота пути эвакуации по лестнице — не менее **2,2 м** (совпадает с уже известным).\n\n**Лестничные площадки** — ширина не менее ширины марша; перед лифтами с распашными дверями — не менее суммы ширины марша и половины ширины двери лифта, но не менее **1,6 м**. Промежуточные площадки в прямом марше — не менее **1 м** длиной. Двери на ЛК в открытом положении не должны уменьшать требуемую ширину площадок/маршей.\n\n**Уклон и ступени (п.4.4.3):** уклон — как правило не более **1:1**; ширина проступи — как правило не менее **25 см** (кроме наружных лестниц); высота ступени — не более **22 см** и не менее **5 см**. Уклон открытых лестниц к одиночным рабочим местам — можно увеличить до **2:1**. Ширину проступи криволинейных лестниц в узкой части, а также лестниц в тех.этажи/чердаки/некспл.кровлю — можно уменьшить до **22 см**.\n\n---\n\n## Область применения самого СП1.13130 (п.1.1–1.2) — на всякий случай\n\nРаспространяется на все объекты защиты при проектировании/реконструкции/капремонте.\n\n**Не распространяется на:** здания спецназначения (радиоактивные/взрывчатые вещества, военное назначение, метрополитен, горные выработки), **жилые здания высотой >75 м**, иные здания **>50 м**, здания с числом подвальных этажей **более одного** (кроме случаев, для которых есть отдельные нормы по факту размещения).\n\n---\n\n## Связанные заметки\n[[СП 1.13130.2020]] · [[СП 52.13330.2016]] · [[Пути эвакуации — жилые здания (Ф1.3)]] · [[Лестницы — ширина марша и высота ограждения]] · [[Пожарные отсеки и противопожарные преграды]] · [[Категории помещений по пожарной опасности]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[Нормативная база — карта]]\n", "diagrams": ["<svg viewBox=\"0 0 500 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans, sans-serif\">\n<defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4A6178\"/></marker></defs>\n<rect x=\"0\" y=\"0\" width=\"500\" height=\"460\" fill=\"#FAFBFC\"/>\n<rect x=\"140\" y=\"15\" width=\"220\" height=\"45\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"250.0\" y=\"41.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"250.0\" dy=\"0\">Помещение/этаж/здание</tspan></text><line x1=\"250\" y1=\"60\" x2=\"250\" y2=\"92\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><polygon points=\"250.0,100 380,145.0 250.0,190 120,145.0\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"250.0\" y=\"135.25\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"250.0\" dy=\"0\">Подпадает под</tspan><tspan x=\"250.0\" dy=\"13\">критерий из</tspan><tspan x=\"250.0\" dy=\"13\">списка ниже?</tspan></text><line x1=\"180\" y1=\"190\" x2=\"90\" y2=\"254\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"124.4\" y=\"216.0\" width=\"21.2\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"135.0\" y=\"225.0\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">да</text><rect x=\"10\" y=\"260\" width=\"180\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"100.0\" y=\"288.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"100.0\" dy=\"0\">Нужно ≥2 выхода</tspan></text><line x1=\"320\" y1=\"190\" x2=\"410\" y2=\"254\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"351.1\" y=\"216.0\" width=\"27.799999999999997\" height=\"12\" fill=\"white\" opacity=\"0.9\"/><text x=\"365.0\" y=\"225.0\" text-anchor=\"middle\" font-size=\"9.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#4A6178\">нет</text><rect x=\"320\" y=\"260\" width=\"180\" height=\"50\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"410.0\" y=\"288.75\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"410.0\" dy=\"0\">Достаточно 1 выхода</tspan></text><line x1=\"100\" y1=\"310\" x2=\"100\" y2=\"367\" stroke=\"#4A6178\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"10\" y=\"375\" width=\"260\" height=\"65\" rx=\"8\" fill=\"#E4ECF4\" stroke=\"#1E4C7A\" stroke-width=\"1.5\"/>\n<text x=\"140.0\" y=\"396.25\" text-anchor=\"middle\" font-size=\"12.5\" font-family=\"DejaVu Sans, sans-serif\" fill=\"#16324F\"><tspan x=\"140.0\" dy=\"0\">Рассредоточить: расстояние между</tspan><tspan x=\"140.0\" dy=\"15\">гранями ≥0,5×диагонали; в коридоре</tspan><tspan x=\"140.0\" dy=\"15\">L≥0,4×D</tspan></text>\n</svg>"]}, {"title": "Категории помещений по пожарной опасности", "file": "Категории помещений по пожарной опасности", "md": "#нормативка #пожарная_безопасность #справочник\n\n← [[КОНСПЕКТ-ЗАЛП — Блок 1]] · [[Нормативная база — карта]]\n\n# Категории помещений по пожарной и взрывопожарной опасности\n\n**Документ:** [[123-ФЗ]], глава 8 (ст.26–27) — определения; методика подробного расчёта (В1–В4) — **СП 12.13130.2009, не в базе**\n\n> [!important] Кто это считает на практике\n> Категорию помещения **определяют инженеры по пожарной безопасности** (по составу и количеству горючих веществ/материалов) — это не задача архитектора. Архитектору нужно **понимать логику и последствия** (категория влияет на преграды, расстояния, деление ЛК — раздел ниже), чтобы правильно читать задание от ПБ-инженера и закладывать нужные объёмно-планировочные решения — а не самому присваивать категорию или запоминать пороги в МДж/м² для В1–В4.\n\n---\n\n## Область применения — важное ограничение\n\nКатегории применяются **только к помещениям производственного и складского назначения** (ст.27, п.1) — независимо от того, в каком по функциональному назначению здании они находятся. Жилые комнаты, офисы, торговые залы сами по себе **не категорируются**. Но категории регулярно всплывают внутри жилых/общественных зданий — через встроенные технические/складские помещения: ИТП, венткамеры, электрощитовые, кладовые, паркинг.\n\nЗдания, сооружения и помещения **иного** назначения (не производственного/складского) разделению на категории **не подлежат** (ст.26, п.2).\n\n---\n\n## Логика определения — последовательная проверка от опасной к безопасной\n\nОпределение категории — **не свободный выбор**, а последовательная проверка от наиболее опасной (А) к наименее опасной (Д); останавливаешься на первой подходящей.\n\n### Определения (123-ФЗ, ст.27, п.5–10)\n\n| Категория | Определение |\n|---|---|\n| **А** — повышенная взрывопожароопасность | Горючие газы, ЛВЖ с температурой вспышки ≤28°C в количестве, дающем расчётное избыточное давление взрыва **>5 кПа**; или вещества, взрывающиеся/горящие при взаимодействии с водой/кислородом/друг с другом |\n| **Б** — взрывопожароопасность | Горючая пыль/волокна, ЛВЖ с вспышкой >28°C, горючие жидкости — та же логика (давление взрыва >5 кПа), но пылевоздушные/паровоздушные смеси |\n| **В1–В4** — пожароопасность | Горючие/трудногорючие жидкости и твёрдые вещества (в т.ч. пыли/волокна), способные **только гореть** (не взрываться) — при условии, что не попадают в А/Б |\n| **Г** — умеренная пожароопасность | Негорючие вещества в горячем/раскалённом/расплавленном состоянии (искры, лучистое тепло, пламя при обработке); или горючие газы/жидкости/твёрдые вещества, сжигаемые как топливо |\n| **Д** — пониженная пожароопасность | Негорючие вещества и материалы в холодном состоянии |\n\n### Разделение В1–В4 — где реальный пробел\n\nОтнесение к В1, В2, В3 или В4 зависит от **количества и способа размещения пожарной нагрузки** (в МДж/м²) и объёмно-планировочных характеристик помещения (ст.27, п.8). Точные числовые пороги в 123-ФЗ не приводятся — методика в **СП 12.13130.2009** (документ не в базе). Если нужна точность до В1/В2/В3/В4 — это нужно проверять отдельно, не по памяти.\n\n---\n\n## Категория здания в целом — отдельный расчёт по проценту площади (ст.27, п.12–20)\n\nКатегория здания **не равна** категории самого опасного помещения внутри — считается по доле суммарной площади.\n\n| Категория здания | Условие «относится» | Условие «не относится» (смягчение) |\n|---|---|---|\n| **А** | Сумм. площадь помещений А >5% всех помещений **или** >200 м² | ≤25% (и ≤1000 м²) + автопожаротушение в этих помещениях |\n| **Б** | Не А, и сумм.(А+Б) >5% или >200 м² | ≤25% (и ≤1000 м²) + автопожаротушение |\n| **В** | Не А/Б, и сумм.(А+Б+В1+В2+В3) >5% (**или 10%**, если нет А/Б в здании) | ≤25% (и ≤3500 м²) + автопожаротушение |\n| **Г** | Не А/Б/В, и сумм.(А+Б+В1–3+Г) >5% | ≤25% (и ≤5000 м²) + А/Б/В1–3 оснащены автопожаротушением |\n| **Д** | Не подходит ни под одну из категорий выше | — |\n\n---\n\n## Где категории прямо влияют на проектные решения (СП1.13130)\n\n- **Табл. 16** — расстояние по коридору до выхода зависит от категории самого опасного помещения на этаже: А/Б — строже всего (35–50 м), В1–В3 — среднее, В4/Г/Д — мягче всего (до 180–260 м)\n- **Табл. 18** — количество людей на 1 м ширины эвакуационного выхода тоже зависит от категории: А/Б — 85 чел./м, В4/Г/Д — до 260 чел./м\n- Незадымляемые ЛК типа Н2 делятся глухой перегородкой через каждые **20 м** по высоте в зданиях категории В, и через **30 м** — в категориях Г/Д\n- Эвакуационные пути из помещений В/Г/Д **не могут** проходить через тамбур-шлюзы помещений категорий А/Б\n- Один эвакуационный выход из встройки/вставки высотой ≤11 м с категориями В4/Г/Д — допустим при определённых условиях (двусторонние выходы, остальные — прямо наружу)\n- При размещении на этаже помещений разных категорий — расстояние по коридору считается **по более опасной категории**\n\n---\n\n## Практический вывод для жилых/общественных зданий\n\nДаже если основной объект — жильё (Ф1.3) или офис (Ф4.3), встроенным техническим/складским помещениям — паркингу, венткамерам/ИТП, хозяйственным кладовым — всё равно присваивается категория. **Это делает инженер ПБ, не архитектор.** Архитектору важно знать: раз категория есть — от неё зависят преграды/расстояния/деление ЛК (раздел выше), и эти требования нужно закладывать в планировку **после** получения задания от ПБ-инженера, а не до. Если задание от ПБ ещё не пришло, а решение уже нужно принимать — стоит закладывать более консервативный (строгий) вариант, а не предполагать самую мягкую категорию.\n\n---\n\n## Что не входит в зону ответственности архитектора\n- Точная методика разделения В1/В2/В3/В4 по величине пожарной нагрузки (СП12.13130.2009) — считает инженер ПБ\n- Полные версии таблиц 15–19 СП1.13130 по всем категориям/степеням огнестойкости — открывать точечно при получении конкретного задания от ПБ, не запоминать целиком\n\n---\n\n## Связанные заметки\n[[123-ФЗ]] · [[СП 1.13130.2020]] · [[Класс функциональной пожарной опасности]] · [[КОНСПЕКТ-ЗАЛП — Блок 1]]
